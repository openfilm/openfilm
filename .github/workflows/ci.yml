name: 0.4.1 Windows Agent verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pi-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test src/pi-agent.test.mjs src/agents.test.mjs
        working-directory: apps/desktop
  studio:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openfilm exec playwright-core install chromium-headless-shell
      - run: node --test --test-concurrency=1 studio/workspaces.test.mjs studio/project-title.test.mjs studio/caption-group-move.test.mjs studio/preview-cue.test.mjs
        working-directory: packages/openfilm
