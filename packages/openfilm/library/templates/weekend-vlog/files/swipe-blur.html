<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Swipe</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #f6f6f2; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A panel whips across from the right with motion streaks racing ahead of it, covers the cut, and whips on off to
 * the left with streaks trailing. It lasts 0.6 s and covers the cut at its middle: put its middle on the cut. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so it fits
 * a stage of any shape.
 */
const D = 0.6;
const DEFAULT = '#f6f6f2';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
/* 0 at a, 1 at b, 0 again at c */
const tri = (u, a, b, c) => (u < b ? seg(u, a, b) : 1 - seg(u, b, c));
const mix = (a, b, x) => a + (b - a) * x;
const inOutQuart = (x) => (x < 0.5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2);
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

function draw(u) {
  const c = color();
  const lead = mix(1.1, -0.1, inOutQuart(seg(u, 0.04, 0.42))) * W;
  const tail = mix(1.1, -0.1, inOutQuart(seg(u, 0.58, 0.96))) * W;
  const right = u < 0.5 ? W * 1.1 : tail;
  const speed = (u < 0.5 ? tri(u, 0.04, 0.23, 0.42) : tri(u, 0.58, 0.77, 0.96));
  /* the panel, its edges soft with motion */
  const blur = W * 0.12 * speed;
  const left = u < 0.5 ? lead : -W * 0.2;
  if (right > left) {
    g.fillStyle = c;
    g.fillRect(left, 0, right - left, H);
    const soft = (x, dir) => {
      const gr = g.createLinearGradient(x, 0, x + dir * blur, 0);
      gr.addColorStop(0, tone(c, 0, 0.9));
      gr.addColorStop(1, tone(c, 0, 0));
      g.fillStyle = gr;
      g.fillRect(Math.min(x, x + dir * blur), 0, blur, H);
    };
    if (blur > 1) soft(u < 0.5 ? lead : tail, u < 0.5 ? -1 : 1);
  }
  /* streaks: ahead of it coming in, behind it going out */
  const edge = u < 0.5 ? lead : tail, dir = u < 0.5 ? -1 : 1;
  for (let i = 0; i < 18; i++) {
    const y = hash(i) * H, h = 2 + hash(i + 30) * H * 0.04, len = W * (0.1 + 0.5 * hash(i + 60)) * speed;
    const x0 = edge + dir * W * 0.04 * hash(i + 90), x1 = x0 + dir * len;
    const gr = g.createLinearGradient(x0, 0, x1, 0);
    gr.addColorStop(0, tone(c, (hash(i + 7) - 0.5) * 0.3, 0.9));
    gr.addColorStop(1, tone(c, 0, 0));
    g.fillStyle = gr;
    g.fillRect(Math.min(x0, x1), y, Math.abs(len), h);
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
