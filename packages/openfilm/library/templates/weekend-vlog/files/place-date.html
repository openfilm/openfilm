<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar date</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ff4a3d; --paper: #ffffff; --ink: #16171c; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); perspective: 200vh; }
.c { position: relative; width: 66vh; background: var(--paper); color: var(--ink); border-radius: 6vh; overflow: hidden; box-shadow: 0 3vh 7vh rgba(0, 0, 0, 0.35); transform-origin: 50% 0; animation: flip 0.8s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.tp { background: var(--accent); color: #fff; text-align: center; padding: 6vh 0 4vh; font-size: 11vh; font-weight: 800; letter-spacing: 0.24em; padding-left: 0.24em; }
.t2 { display: block; text-align: center; font: 800 34vh/1 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; margin-top: 3vh; letter-spacing: -0.02em; }
.t3 { display: block; text-align: center; font-size: 7.4vh; font-weight: 700; letter-spacing: 0.3em; padding-left: 0.3em; opacity: 0.55; margin: 1vh 0 6vh; }
.rings { position: absolute; top: -3.4vh; left: 0; right: 0; display: flex; justify-content: center; gap: 30vh; z-index: 2; }
.rings i { width: 4vh; height: 10vh; border-radius: 2vh; background: linear-gradient(90deg, #9a9ca3, #f5f5f7, #9a9ca3); box-shadow: 0 0.6vh 1vh rgba(0, 0, 0, 0.3); }
.wrap { position: relative; }
.t4 { margin-top: 5vh; font-size: 9vh; font-weight: 700; letter-spacing: 0.3em; padding-left: 0.3em; color: #fff; text-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.5); white-space: pre; animation: rise 0.5s 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes flip { 0% { transform: rotateX(-100deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(3vh); } }
</style>
</head>
<body>
<div class="w">
  <div class="wrap"><div class="rings"><i></i><i></i></div><div class="c"><div class="tp"><span class="t1">OCT</span></div><span class="t2">31</span><span class="t3">FRIDAY</span></div></div>
  <span class="t4">2026</span>
</div>
<script>
/*
 * A calendar page that flips down on its rings: the month on a band of color, a big day, the weekday, the year
 * under it. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held
 * at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
