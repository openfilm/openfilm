<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vignette</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #000000; }
.l { background: radial-gradient(ellipse at center, transparent 50%, color-mix(in srgb, var(--color) 85%, transparent) 100%); }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A vignette: the corners of the picture darkened. A page of OpenFilm's library (CC0): what it shows at t comes
 * from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
