<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Burn through</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * The film stops in the gate and burns: holes with glowing orange rims open and run together into the lamp's white
 * over the cut; then holes burn through the white onto the next shot. It lasts 1 s and covers the cut at its
 * middle: put its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone,
 * drawn in parts of the frame so it fits a stage of any shape.
 */
const D = 1;
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const inQuad = (x) => x * x;
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
/* smooth noise in [0, 1] along x */
const noise = (x, seed = 0) => { const i = Math.floor(x), f = x - i; return mix(hash(i + seed * 57), hash(i + 1 + seed * 57), f * f * (3 - 2 * f)); };

/* where each hole starts (parts of the frame), and when */
const HOLES = [[0.48, 0.52, 0], [0.28, 0.32, 0.06], [0.74, 0.64, 0.1], [0.66, 0.24, 0.14], [0.22, 0.74, 0.18]];
/* a ragged hole around x, y */
const hole = (x, y, r, seed) => {
  for (let i = 0; i <= 72; i++) {
    const a = (i / 72) * TAU, rr = r * (0.82 + 0.36 * noise((i % 72) / 6, seed));
    if (i) g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); else g.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
  }
  g.closePath();
};
/* the glowing rim and scorch around the holes in the current path */
const rims = (w) => {
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(60, 25, 5, 0.7)';
  g.lineWidth = w * 3;
  g.filter = `blur(${w}px)`;
  g.stroke();
  g.strokeStyle = 'rgba(255, 110, 20, 0.95)';
  g.lineWidth = w * 1.4;
  g.filter = `blur(${w * 0.4}px)`;
  g.stroke();
  g.filter = 'none';
  g.strokeStyle = 'rgba(255, 230, 140, 1)';
  g.lineWidth = Math.max(1, w * 0.3);
  g.stroke();
};

function draw(u) {
  const R = Math.hypot(W, H) * 0.95, w = H * 0.02;
  const before = u < 0.5;
  const list = HOLES.map(([x, y, s], i) => (before
    ? [x * W, y * H, R * inQuad(seg(u, s, 0.42)), i]
    : [(1 - x) * W, (1 - y) * H, R * inQuad(seg(u, 0.56 + s * 0.8, 0.98)), i + 9])).filter((h) => h[2] > 0);
  const path = () => { g.beginPath(); list.forEach(([x, y, r, i]) => hole(x, y, r, i)); };
  g.fillStyle = '#fff8e8';
  if (before) {
    if (!list.length) return;
    /* the rims first, so the white covers their inner half */
    path();
    rims(w);
    path();
    g.fill();
    return;
  }
  /* after the cut the white burns away, the rims on what is left of it */
  g.fillRect(0, 0, W, H);
  if (!list.length) return;
  path();
  g.globalCompositeOperation = 'destination-out';
  g.fill();
  g.globalCompositeOperation = 'source-atop';
  rims(w);
  g.globalCompositeOperation = 'source-over';
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
