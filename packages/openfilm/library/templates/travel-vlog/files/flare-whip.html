<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flare whip</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A wide streak of light whips across the frame with a cool leading edge and racing lines, whites out the cut, and
 * its warm tail whips off the other side. It lasts 0.7 s and covers the cut at its middle: put its middle on the
 * cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so
 * it fits a stage of any shape.
 */
const D = 0.7;
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
/* 0 at a, 1 at b, 0 again at c */
const tri = (u, a, b, c) => (u < b ? seg(u, a, b) : 1 - seg(u, b, c));
const mix = (a, b, x) => a + (b - a) * x;
const inOutQuart = (x) => (x < 0.5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2);
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function draw(u) {
  const lead = mix(-0.4, 1.4, inOutQuart(seg(u, 0.08, 0.44)));
  const tail = mix(-0.4, 1.4, inOutQuart(seg(u, 0.56, 0.92)));
  const s = 0.3;
  /* the band of light, from its tail to its head, its edges soft */
  if (lead > tail - 0.01) {
    const x0 = (tail - s) * W, x1 = (lead + s) * W, n = x1 - x0;
    const band = g.createLinearGradient(x0, 0, x1, 0);
    band.addColorStop(0, 'rgba(255, 190, 120, 0)');
    band.addColorStop((s * W * 0.6) / n, 'rgba(255, 214, 170, 0.8)');
    band.addColorStop((s * W) / n, 'rgba(255, 255, 255, 1)');
    band.addColorStop(1 - (s * W) / n, 'rgba(255, 255, 255, 1)');
    band.addColorStop(1 - (s * W * 0.6) / n, 'rgba(190, 225, 255, 0.8)');
    band.addColorStop(1, 'rgba(150, 200, 255, 0)');
    g.fillStyle = band;
    g.fillRect(x0, 0, n, H);
    /* faint warm and cool streaks inside it, so it reads as moving light */
    for (let i = 0; i < 10; i++) {
      g.fillStyle = `rgba(${i % 2 ? '150, 200, 255' : '255, 190, 130'}, 0.14)`;
      g.fillRect(tail * W, hash(i + 200) * H, (lead - tail) * W, H * (0.01 + 0.04 * hash(i + 210)));
    }
  }
  /* racing lines: ahead of the head as it comes, behind the tail as it goes */
  const fast = u < 0.5 ? tri(u, 0.04, 0.3, 0.46) : tri(u, 0.54, 0.7, 0.96);
  const edge = (u < 0.5 ? lead : tail) * W;
  for (let i = 0; i < 22; i++) {
    const y = hash(i) * H, h = 1 + hash(i + 40) * 4, len = W * (0.15 + 0.6 * hash(i + 80)) * fast;
    const x0 = u < 0.5 ? edge : edge - len, x1 = u < 0.5 ? edge + len : edge;
    const line = g.createLinearGradient(x0, 0, x1, 0);
    const a = (0.4 + 0.6 * hash(i + 120)) * fast;
    line.addColorStop(u < 0.5 ? 0 : 1, `rgba(255, 255, 255, ${a})`);
    line.addColorStop(u < 0.5 ? 1 : 0, 'rgba(255, 255, 255, 0)');
    g.fillStyle = line;
    g.fillRect(x0, y, x1 - x0, h);
  }
  /* the anamorphic streak through the middle, with a cool glow */
  const k = tri(u, 0, 0.45, 1);
  const glow = g.createLinearGradient(0, H / 2 - H * 0.08, 0, H / 2 + H * 0.08);
  glow.addColorStop(0, 'rgba(120, 180, 255, 0)');
  glow.addColorStop(0.47, `rgba(170, 215, 255, ${0.6 * k})`);
  glow.addColorStop(0.5, `rgba(255, 255, 255, ${k})`);
  glow.addColorStop(0.53, `rgba(170, 215, 255, ${0.6 * k})`);
  glow.addColorStop(1, 'rgba(120, 180, 255, 0)');
  g.fillStyle = glow;
  g.fillRect(0, H / 2 - H * 0.08, W, H * 0.16);
  /* lens ghosts sliding the other way */
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = W * (1 - (u < 0.5 ? lead : tail)) + (i - 2) * W * 0.12, r = H * (0.03 + 0.05 * hash(i + 7));
    g.fillStyle = `rgba(${i % 2 ? '120, 200, 255' : '255, 180, 120'}, ${0.28 * k})`;
    g.beginPath();
    g.arc(x, H / 2, r, 0, Math.PI * 2);
    g.fill();
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
