<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quote card</title>
<style>
:root { --font: Georgia, 'Songti SC', 'Noto Serif SC', serif; --accent: #ff8a5b; --card: rgba(14, 14, 18, 0.78); --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--color); }
.c { position: relative; width: 196vh; background: var(--card); border-radius: 5vh; padding: 16vh 14vh 13vh 16vh; box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.35); animation: in 0.6s cubic-bezier(0.3, 1.3, 0.5, 1) both; }
.q { position: absolute; left: 9vh; top: -12vh; font: 700 64vh/1 var(--font); color: var(--accent); height: 40vh; transform-origin: 30% 30%; animation: q 0.7s 0.15s cubic-bezier(0.3, 1.7, 0.5, 1) both; }
.ln2 { overflow: hidden; }
.ln2 span { display: block; font: italic 400 15vh/1.25 var(--font); white-space: pre; animation: up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
.ln2.a span { animation-delay: 0.35s; } .ln2.b span { animation-delay: 0.5s; }
.by { display: flex; align-items: center; gap: 3vh; margin-top: 6vh; font: 600 8vh/1 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; letter-spacing: 0.12em; white-space: pre; animation: fade 0.6s 0.8s both; }
.by::before { content: ""; width: 12vh; height: 0.8vh; background: var(--accent); transform-origin: left; animation: grow 0.6s 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes in { from { opacity: 0; transform: scale(0.9); } }
@keyframes q { from { opacity: 0; transform: scale(0.2) rotate(-40deg); } }
@keyframes up { from { transform: translateY(105%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="w"><div class="c">
  <div class="q">&ldquo;</div>
  <div class="ln2 a"><span class="t1">Small steps, every day,</span></div>
  <div class="ln2 b"><span class="t2">add up to a life.</span></div>
  <div class="by"><span class="t3">LIN XIAO</span></div>
</div></div>
<script>
/*
 * A quote on a dark card: a big quotation mark that swings in, the words rising line by line, and who said it. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
