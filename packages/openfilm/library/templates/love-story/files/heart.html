<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Heart</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ff5a7a; }
.l { background: var(--color); clip-path: path('M50 30 C50 25 45 15 35 15 C20 15 20 32 20 32 C20 45 35 58 50 70 C65 58 80 45 80 32 C80 32 80 15 65 15 C55 15 50 25 50 30 Z'); left: calc(50% - 50px); top: calc(50% - 45px); width: 100px; height: 100px; inset: auto; animation: h 0.8s ease-in both; }
@keyframes h { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(40); opacity: 1; } 100% { transform: scale(40); opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A heart grows from the middle until it covers everything, then fades. It lasts 0.8 s and covers the cut at its
 * middle: put its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone;
 * its CSS animations are held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
