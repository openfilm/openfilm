<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Color bars</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #16161d; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Slanted panels of yellow, rose and blue sweep across one after another, the last in your colour covering the
 * cut; then they sweep on off the frame, the last first. It lasts 0.9 s and covers the cut at its middle: put its
 * middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of
 * the frame so it fits a stage of any shape.
 */
const D = 0.9;
const DEFAULT = '#16161d';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const inOutQuart = (x) => (x < 0.5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2);
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;

const PANELS = ['#ffcf3f', '#ff4f6d', '#4b5bff'];

function draw(u) {
  const list = [...PANELS, color()], n = list.length, sk = H * 0.35;
  for (let i = 0; i < n; i++) {
    const a = i * 0.06, b = 0.56 + (n - 1 - i) * 0.06;
    const lead = mix(-sk, W + sk, inOutQuart(seg(u, a, a + 0.24)));
    const tail = mix(-sk, W + sk, inOutQuart(seg(u, b, b + 0.24)));
    if (lead <= tail) continue;
    g.fillStyle = list[i];
    g.beginPath();
    g.moveTo(tail + sk / 2, 0);
    g.lineTo(lead + sk / 2, 0);
    g.lineTo(lead - sk / 2, H);
    g.lineTo(tail - sk / 2, H);
    g.closePath();
    g.fill();
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
