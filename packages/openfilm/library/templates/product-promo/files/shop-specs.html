<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spec list</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #38d9a9; --card: rgba(14, 16, 22, 0.84); --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font); color: var(--color); }
.c { width: 128vh; background: var(--card); border-radius: 4vh; padding: 7vh 8vh 6vh; box-shadow: 0 3vh 7vh rgba(0, 0, 0, 0.35); animation: in 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.t0 { font-size: 5vh; font-weight: 800; letter-spacing: 0.3em; color: var(--accent); white-space: pre; animation: side 0.5s 0.2s both; }
.t1 { display: block; margin: 1.6vh 0 3vh; font-size: 11vh; font-weight: 800; line-height: 1.1; white-space: pre; animation: side 0.5s 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.row { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 4vh; padding: 3.2vh 0; white-space: pre; animation: side 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.row::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 0.4vh; background: rgba(255, 255, 255, 0.16); transform-origin: left; animation: grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: inherit; }
.row span:first-child { font-size: 6.4vh; font-weight: 500; opacity: 0.6; }
.row span:last-child { font-size: 7.6vh; font-weight: 700; }
.row:nth-of-type(1) { animation-delay: 0.4s; } .row:nth-of-type(2) { animation-delay: 0.5s; } .row:nth-of-type(3) { animation-delay: 0.6s; } .row:nth-of-type(4) { animation-delay: 0.7s; }
.row:nth-of-type(1) span:last-child { color: var(--accent); }
@keyframes in { from { opacity: 0; transform: translateY(8vh) scale(0.92); } }
@keyframes side { from { opacity: 0; transform: translateX(-4vh); } }
@keyframes grow { from { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="w"><div class="c">
  <span class="t0">SPECS</span><span class="t1">Aero Headphones</span>
  <div class="rows">
    <div class="row"><span class="k1">Battery</span><span class="v1">40 hours</span></div>
    <div class="row"><span class="k2">Weight</span><span class="v2">250 g</span></div>
    <div class="row"><span class="k3">Charging</span><span class="v3">USB-C, 10 min = 5 h</span></div>
    <div class="row"><span class="k4">Colors</span><span class="v4">Black, Sand, Sky</span></div>
  </div>
</div></div>
<script>
/*
 * A product spec card: a name with a label above it, then four rows of a name and a value, each drawn in after the
 * last. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t
 * by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
