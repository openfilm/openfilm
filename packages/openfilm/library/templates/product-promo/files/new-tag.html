<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NEW</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Arial Black', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #ff2d55; }
.w { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.tag { position: relative; display: grid; place-items: center; height: 56vh; padding: 0 10vw; border-radius: 16vh; background: linear-gradient(115deg, var(--color), color-mix(in srgb, var(--color), #ffb300 60%)); border: 1.6vh solid #ffffff; animation: pop 0.5s cubic-bezier(.34, 1.56, .64, 1) both; transform: rotate(-6deg); }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } }
.label { color: #ffffff; font: italic 900 36vh/1 var(--font); letter-spacing: 0.02em; text-shadow: 0 0.8vh 0 rgba(0, 0, 0, 0.18); }
.sh { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.sh::after { content: ''; position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); transform: translateX(-120%) skewX(-20deg); animation: sweep 2.2s ease-in-out 0.6s infinite; }
@keyframes sweep { 0% { transform: translateX(-120%) skewX(-20deg); } 45%, 100% { transform: translateX(420%) skewX(-20deg); } }
.gl { position: absolute; right: -6vw; top: -16vh; width: 16vw; height: 16vw; overflow: visible; animation: gl0 0.4s cubic-bezier(.34, 1.56, .64, 1) 0.3s both; }
@keyframes gl0 { from { transform: scale(0) rotate(-90deg); } }
.gl path { animation: tw 1.3s ease-in-out 0.7s infinite; }
@keyframes tw { 50% { transform: scale(0.5) rotate(30deg); } }
</style>
</head>
<body>
<div class="w"><div class="tag"><div class="label">NEW</div><div class="sh"></div>
<svg class="gl" viewBox="-50 -50 100 100"><path d="M0 -46 C8.28 -8.28 8.28 -8.28 46 0 C8.28 8.28 8.28 8.28 0 46 C-8.28 8.28 -8.28 8.28 -46 0 C-8.28 -8.28 -8.28 -8.28 0 -46 Z" fill="#ffffff"/></svg></div></div>
<script>
/*
 * A NEW label that pops in tilted, a glint twinkling on its corner and a shine sweeping across it now and then. Its
 * words and color are the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t
 * alone; its CSS animations are held at t by the host.
 */
window.film = { width: 360, height: 200, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
