<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cross</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
:root { --color: #ff3b30; }
.c { stroke-dasharray: 1; animation: d 0.3s ease-out both; } .d { animation-delay: 0.25s; }
@keyframes d { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="c" d="M24 24 L76 76" fill="none" stroke="var(--color)" stroke-width="12" stroke-linecap="round" pathLength="1"/><path class="c d" d="M76 24 L24 76" fill="none" stroke="var(--color)" stroke-width="12" stroke-linecap="round" pathLength="1"/></svg>
<script>
/*
 * A cross that draws itself, stroke by stroke. Its color is the clip's to change. A page of OpenFilm's library
 * (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
