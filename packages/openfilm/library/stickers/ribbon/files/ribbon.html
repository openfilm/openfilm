<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ribbon swirl</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ff4fa3; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.d { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw var(--l, 0.45s) cubic-bezier(.6, .05, .3, 1) var(--d, 0s) both; }
@keyframes draw { from { stroke-dashoffset: 1.01; opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
.run { stroke: #ffffff; stroke-width: 5; stroke-dasharray: 0.1 0.9; stroke-dashoffset: 0.1; opacity: 0; animation: run 1.8s ease-in-out 0.7s infinite; }
@keyframes run { 0% { stroke-dashoffset: 0.1; opacity: 0; } 10%, 85% { opacity: 0.9; } 100% { stroke-dashoffset: -0.9; opacity: 0; } }
.fl { animation: fl 2.4s ease-in-out 0.7s infinite; }
@keyframes fl { 50% { transform: translateY(-6px); } }
</style>
</head>
<body>
<svg viewBox="0 0 600 300"><defs><linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0"><stop offset="0" style="stop-color: color-mix(in srgb, var(--color), #ffffff 35%)"/><stop offset="0.5" style="stop-color: var(--color)"/><stop offset="1" style="stop-color: color-mix(in srgb, var(--color), #7a5cff 45%)"/></linearGradient></defs>
<g class="fl">
<path class="d" pathLength="1" style="--l: 0.7s; stroke: url(#rg); stroke-width: 26" d="M24 210 C35 200 67.3 161.7 90 150 C112.7 138.3 139.3 134.7 160 140 C180.7 145.3 208 166 214 182 C220 198 207.3 229.3 196 236 C184.7 242.7 153.7 233 146 222 C138.3 211 138.7 187 150 170 C161.3 153 189 130.3 214 120 C239 109.7 273.7 104.7 300 108 C326.3 111.3 355.3 125.3 372 140 C388.7 154.7 401 181 400 196 C399 211 378.3 228.7 366 230 C353.7 231.3 329.7 217.7 326 204 C322.3 190.3 329.7 164.7 344 148 C358.3 131.3 386.7 113.3 412 104 C437.3 94.7 468.7 97.7 496 92 C523.3 86.3 562.7 73.7 576 70"/>
<path class="d" pathLength="1" style="--l: 0.7s; stroke: #ffffff; stroke-opacity: 0.35; stroke-width: 6" transform="translate(0 -6)" d="M24 210 C35 200 67.3 161.7 90 150 C112.7 138.3 139.3 134.7 160 140 C180.7 145.3 208 166 214 182 C220 198 207.3 229.3 196 236 C184.7 242.7 153.7 233 146 222 C138.3 211 138.7 187 150 170 C161.3 153 189 130.3 214 120 C239 109.7 273.7 104.7 300 108 C326.3 111.3 355.3 125.3 372 140 C388.7 154.7 401 181 400 196 C399 211 378.3 228.7 366 230 C353.7 231.3 329.7 217.7 326 204 C322.3 190.3 329.7 164.7 344 148 C358.3 131.3 386.7 113.3 412 104 C437.3 94.7 468.7 97.7 496 92 C523.3 86.3 562.7 73.7 576 70"/>
<path class="run" pathLength="1" transform="translate(0 -6)" d="M24 210 C35 200 67.3 161.7 90 150 C112.7 138.3 139.3 134.7 160 140 C180.7 145.3 208 166 214 182 C220 198 207.3 229.3 196 236 C184.7 242.7 153.7 233 146 222 C138.3 211 138.7 187 150 170 C161.3 153 189 130.3 214 120 C239 109.7 273.7 104.7 300 108 C326.3 111.3 355.3 125.3 372 140 C388.7 154.7 401 181 400 196 C399 211 378.3 228.7 366 230 C353.7 231.3 329.7 217.7 326 204 C322.3 190.3 329.7 164.7 344 148 C358.3 131.3 386.7 113.3 412 104 C437.3 94.7 468.7 97.7 496 92 C523.3 86.3 562.7 73.7 576 70"/>
</g></svg>
<script>
/*
 * A satin ribbon that swirls across in loops, drawn from end to end, then a gleam keeps running along it. Its color
 * is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 600, height: 300, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
