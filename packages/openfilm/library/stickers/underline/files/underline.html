<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Underline</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
.c { stroke-dasharray: 1; animation: d 0.5s ease-out both; }
@keyframes d { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 20"><path class="c" d="M4 12 C30 6 60 16 96 8" fill="none" stroke="var(--color)" stroke-width="5" stroke-linecap="round" pathLength="1"/></svg>
<script>
/*
 * A brush stroke that underlines something. Its color is the clip's to change. A page of OpenFilm's library (CC0):
 * what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 600, height: 120, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
