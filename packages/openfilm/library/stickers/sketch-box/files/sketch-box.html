<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sketch box</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd60a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
path { fill: none; stroke: var(--color); stroke-width: 9; stroke-linecap: round; }
.d { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw var(--l, 0.45s) cubic-bezier(.6, .05, .3, 1) var(--d, 0s) both; }
@keyframes draw { from { stroke-dashoffset: 1.01; opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
.p { transform-origin: 300px 180px; animation: p 1.6s ease-in-out 0.8s infinite; }
@keyframes p { 50% { transform: scale(1.02); } }
</style>
</head>
<body>
<svg viewBox="0 0 600 360"><defs><filter id="boil" filterUnits="userSpaceOnUse" x="-60" y="-36" width="720" height="432"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g filter="url(#boil)"><g class="p">
<path class="d" pathLength="1" style="--l: 0.17s" d="M28 50 L572 38"/>
<path class="d" pathLength="1" style="--d: 0.15s; --l: 0.14s" d="M556 22 L566 336"/>
<path class="d" pathLength="1" style="--d: 0.27s; --l: 0.17s" d="M584 320 L22 328"/>
<path class="d" pathLength="1" style="--d: 0.42s; --l: 0.14s" d="M44 344 L40 26"/>
</g></g></svg>
<script>
/*
 * A box drawn round something by hand, four quick strokes whose corners cross. Its color is the clip's to change. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
const noise = [...document.querySelectorAll('feTurbulence')];
window.film = {
  width: 600,
  height: 360,
  frame(t) {
    for (const n of noise) n.setAttribute('seed', String(1 + (Math.floor(t * 8) % 4)));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
