<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Share</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #30b0ff; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.in { transform-origin: 150px 150px; animation: in 0.5s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes in { from { transform: scale(0) rotate(-30deg); } }
.a { transform-origin: 150px 150px; animation: a0 0.45s cubic-bezier(.34, 1.56, .64, 1) 0.15s both, a 1.4s cubic-bezier(.2, .8, .2, 1) 0.7s infinite; }
@keyframes a0 { from { transform: translateX(-40px) scale(0.4); opacity: 0; } }
@keyframes a { 0%, 100% { transform: none; } 20% { transform: translate(14px, -8px) rotate(-8deg); } 45% { transform: translate(-3px, 2px); } 60% { transform: none; } }
.s path { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1 2; opacity: 0; animation: s 1.4s cubic-bezier(.2, .8, .2, 1) 0.7s infinite; }
@keyframes s { 0% { stroke-dashoffset: -1; opacity: 0; } 1%, 30% { opacity: 0.9; } 15% { stroke-dashoffset: 0; } 32%, 100% { stroke-dashoffset: 1.01; opacity: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 300 300"><g class="in">
<circle cx="150" cy="150" r="130" fill="var(--color)"/>
<circle cx="150" cy="150" r="130" fill="url(#hi)"/>
<defs><linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<g class="s"><path pathLength="1" d="M92 118 L62 118"/><path pathLength="1" d="M86 146 L50 146"/></g>
<g class="a"><path d="M168 82 L232 140 L168 198 L168 166 C130 164 104 178 82 208 C88 160 116 122 168 116 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/></g>
</g></svg>
<script>
/*
 * A share button: a round button pops in and its curved arrow keeps swinging forward, trailing quick strokes. Its
 * color is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 300, height: 300, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
