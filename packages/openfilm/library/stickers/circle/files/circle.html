<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Circle it</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
:root { --color: #ff3b30; }
.c { stroke-dasharray: 1; animation: d 0.7s ease-out both; }
@keyframes d { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 60"><path class="c" d="M50 6 C78 5 96 16 95 30 C94 46 72 55 48 54 C22 53 5 44 6 29 C7 15 26 8 55 9" fill="none" stroke="var(--color)" stroke-width="3.5" stroke-linecap="round" pathLength="1"/></svg>
<script>
/*
 * A hand-drawn ring that circles something. Its color is the clip's to change. A page of OpenFilm's library (CC0):
 * what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 500, height: 300, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
