<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wavy underline</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ff4fa3; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.w { fill: none; stroke: var(--color); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg viewBox="0 0 600 120"><path class="w" d="M24 60"/></svg>
<script>
/*
 * A wavy line that runs out under a word and then keeps rippling along. Its color is the clip's to change. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
const line = document.querySelector('.w');
const ease = (k) => 1 - Math.pow(1 - Math.min(Math.max(k, 0), 1), 3);
window.film = {
  width: 600,
  height: 120,
  frame(t) {
    const end = 24 + 552 * ease(t / 0.55);
    let d = '';
    for (let x = 24; x <= end; x += 3) {
      const y = 60 + 17 * Math.sin((x - 24) / 78 * Math.PI * 2 - t * 5);
      d += (d ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    line.setAttribute('d', d || 'M24 60');
    line.style.opacity = t > 0.01 ? 1 : 0;
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
