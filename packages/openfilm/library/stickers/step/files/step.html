<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Step number</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Arial Black', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #2f7bff; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.in { transform-origin: 150px 150px; animation: in 0.45s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes in { from { transform: scale(0); } }
.ring { fill: none; stroke: var(--color); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw 0.5s cubic-bezier(.6, .05, .3, 1) 0.15s both; }
@keyframes draw { from { opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
.run { fill: none; stroke: #ffffff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 0.12 0.88; opacity: 0; animation: run 1.8s linear 0.65s infinite; }
@keyframes run { 0% { stroke-dashoffset: 0; opacity: 0.9; } 100% { stroke-dashoffset: -1; opacity: 0.9; } }
.num { transform-origin: 150px 170px; animation: num 0.45s cubic-bezier(.34, 1.56, .64, 1) 0.22s both; }
@keyframes num { from { transform: scale(0) rotate(-20deg); } }
.label { font: 400 112px var(--font); fill: #ffffff; }
.label2 { font: 800 26px 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #ffffff; letter-spacing: 6px; opacity: 0.85; }
</style>
</head>
<body>
<svg viewBox="0 0 300 300">
<circle class="ring" cx="150" cy="150" r="138" pathLength="1" transform="rotate(-90 150 150)"/>
<circle class="run" cx="150" cy="150" r="138" pathLength="1" transform="rotate(-90 150 150)"/>
<g class="in"><circle cx="150" cy="150" r="118" fill="var(--color)"/><circle cx="150" cy="150" r="118" fill="url(#hi)"/>
<defs><linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<text class="label2" x="153" y="100" text-anchor="middle">STEP</text>
<g class="num"><text class="label" x="150" y="210" text-anchor="middle">1</text></g>
</g></svg>
<script>
/*
 * A step number in a round badge: the badge pops in, a ring draws round it and a light keeps running along the ring.
 * Its number, word and color are the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes
 * from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 300, height: 300, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
