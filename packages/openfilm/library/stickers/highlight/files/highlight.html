<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Highlighter</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffe14d; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
path { fill: none; stroke: var(--color); stroke-linecap: butt; }
.d { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw var(--l, 0.45s) cubic-bezier(.6, .05, .3, 1) var(--d, 0s) both; }
@keyframes draw { from { stroke-dashoffset: 1.01; opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
</style>
</head>
<body>
<svg viewBox="0 0 600 160"><defs><filter id="boil" filterUnits="userSpaceOnUse" x="-60" y="-16" width="720" height="192"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g filter="url(#boil)">
<path class="d" pathLength="1" style="--l: 0.42s; stroke-width: 84; stroke-opacity: 0.62" d="M24 84 C200 81 400 79 576 76"/>
</g></svg>
<script>
/*
 * A highlighter swept across a line, in two passes of see-through ink with its flat ends. Its color is the clip's to
 * change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at
 * t by the host.
 */
const noise = [...document.querySelectorAll('feTurbulence')];
window.film = {
  width: 600,
  height: 160,
  frame(t) {
    for (const n of noise) n.setAttribute('seed', String(1 + (Math.floor(t * 8) % 4)));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
