<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Check mark</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
:root { --color: #34c759; }
.c { stroke-dasharray: 1; animation: d 0.5s ease-out both; }
@keyframes d { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="c" d="M18 52 L40 74 L84 26" fill="none" stroke="var(--color)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>
<script>
/*
 * A check mark that draws itself. Its color is the clip's to change. A page of OpenFilm's library (CC0): what it
 * shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
