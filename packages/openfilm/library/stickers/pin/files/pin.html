<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Location pin</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
:root { --color: #ff3b30; }
.p { animation: p 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
@keyframes p { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="p" d="M50 92 C50 92 20 58 20 38 C20 21 33 8 50 8 C67 8 80 21 80 38 C80 58 50 92 50 92 Z M50 50 A12 12 0 1 0 50 26 A12 12 0 1 0 50 50 Z" fill="var(--color)" fill-rule="evenodd"/></svg>
<script>
/*
 * A map pin that drops in and settles. Its color is the clip's to change. A page of OpenFilm's library (CC0): what
 * it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
