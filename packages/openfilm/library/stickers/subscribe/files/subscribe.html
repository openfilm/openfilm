<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Subscribe</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #ff0033; }
.w { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4vw; filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.btn { position: relative; display: grid; place-items: center; height: 44vh; padding: 0 7vw; border-radius: 22vh; background: var(--color); animation: pop 0.45s cubic-bezier(.34, 1.56, .64, 1) both, press 0.35s ease-in-out 0.9s forwards, done 0.25s ease 1.02s both; }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } 40% { opacity: 1; } }
@keyframes press { 40% { transform: scale(0.93); } }
@keyframes done { to { background: #3a3a3c; } }
.btn > div { grid-area: 1 / 1; color: #ffffff; font: 800 18vh var(--font); letter-spacing: 0.04em; white-space: nowrap; }
.label { animation: out 0.2s ease 1.02s both; }
.label2 { opacity: 0; color: #d1d1d6 !important; animation: in2 0.3s cubic-bezier(.2, .8, .2, 1) 1.06s both; }
@keyframes out { to { opacity: 0; transform: translateY(-30%); } }
@keyframes in2 { from { opacity: 0; transform: translateY(30%); } to { opacity: 1; transform: none; } }
.bell { width: 28vh; height: 28vh; overflow: visible; animation: bell 0.45s cubic-bezier(.34, 1.56, .64, 1) 1.1s both; }
@keyframes bell { from { transform: scale(0); } }
.bell g { transform-origin: 50px 12px; animation: ring 1.6s ease-in-out 1.4s infinite; }
@keyframes ring { 0%, 50%, 100% { transform: none; } 8% { transform: rotate(22deg); } 16% { transform: rotate(-18deg); } 24% { transform: rotate(12deg); } 32% { transform: rotate(-7deg); } 40% { transform: rotate(3deg); } }
.cur { position: absolute; width: 18vh; height: 27vh; animation: cur 0.5s cubic-bezier(.2, .8, .2, 1) 0.45s both; }
.cur svg { width: 100%; height: 100%; overflow: visible; }
.cur g { transform-origin: 0 0; animation: press 0.3s ease-in-out 0.9s both; }
@keyframes cur { from { transform: translate(30vh, 40vh); opacity: 0; } 50% { opacity: 1; } }
@keyframes press { 40% { transform: scale(0.8); } }
.cur { left: 56vw; top: 52vh; animation: cur 0.5s cubic-bezier(.2, .8, .2, 1) 0.45s both, leave 0.45s ease-in 1.5s forwards; }
@keyframes leave { to { transform: translate(12vh, 18vh); opacity: 0; } }
</style>
</head>
<body>
<div class="w">
<div class="btn"><div class="label">SUBSCRIBE</div><div class="label2">SUBSCRIBED</div></div>
<svg class="bell" viewBox="0 0 100 100"><g><circle cx="50" cy="84" r="9" fill="#ffffff"/><path d="M50 14 C30 14 22 32 22 50 L22 66 L12 78 L88 78 L78 66 L78 50 C78 32 70 14 50 14 Z" fill="#ffffff"/><circle cx="50" cy="12" r="6" fill="#ffffff"/></g></svg>
</div>
<div class="cur"><svg viewBox="0 0 100 150"><g><path d="M0 0 L0 118 L29 90 L51 138 L72 129 L51 83 L92 82 Z" fill="#ffffff" stroke="#16161a" stroke-width="7" stroke-linejoin="round"/></g></svg></div>
<script>
/*
 * A subscribe button: it pops in, a pointer comes and clicks it, and it turns into subscribed with a bell that keeps
 * ringing. Its words and color are the clip's to change. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 600, height: 200, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
