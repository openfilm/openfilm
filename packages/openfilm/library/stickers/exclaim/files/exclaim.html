<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Exclamation</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ff3b30; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.m { fill: var(--color); stroke: #ffffff; stroke-width: 10; stroke-linejoin: round; paint-order: stroke; }
.in { transform-origin: 150px 360px; animation: in 0.6s linear both; }
@keyframes in {
  0% { transform: translateY(-380px) scale(0.85, 1.2); animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
  40% { transform: translateY(0) scale(1.3, 0.72); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  62% { transform: translateY(-34px) scale(0.94, 1.06); animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
  80% { transform: translateY(0) scale(1.08, 0.93); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  100% { transform: none; }
}
.hop { transform-origin: 150px 360px; animation: hop 1.4s linear 0.6s infinite; }
@keyframes hop {
  0% { transform: none; animation-timing-function: ease-out; }
  10% { transform: scale(1.1, 0.9); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  30% { transform: translateY(-26px) scale(0.95, 1.06); animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
  46% { transform: scale(1.08, 0.93); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  60%, 100% { transform: none; }
}
.s path { fill: none; stroke: var(--color); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1 2; opacity: 0; animation: s 1.4s cubic-bezier(.2, .8, .2, 1) 0.62s infinite; }
@keyframes s { 0% { stroke-dashoffset: 1.01; opacity: 0; } 1%, 30% { opacity: 1; } 15% { stroke-dashoffset: 0; } 32%, 100% { stroke-dashoffset: -1; opacity: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 300 400">
<g class="s"><path pathLength="1" d="M70 90 L40 62"/><path pathLength="1" d="M56 150 L18 146"/><path pathLength="1" d="M230 90 L260 62"/><path pathLength="1" d="M244 150 L282 146"/></g>
<g class="in"><g class="hop">
<path class="m" d="M114 40 L186 40 Q196 40 195 50 L178 248 Q177 258 167 258 L133 258 Q123 258 122 248 L105 50 Q104 40 114 40 Z"/>
<circle class="m" cx="150" cy="318" r="34"/>
</g></g></svg>
<script>
/*
 * An exclamation mark that drops in, squashes as it lands and keeps hopping, with strokes of surprise beside it. Its
 * color is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 300, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
