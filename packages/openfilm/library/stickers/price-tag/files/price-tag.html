<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Price tag</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Arial Black', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #ffd60a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.sw { transform-origin: 150px 0; animation: sw 1.4s both; }
@keyframes sw {
  0% { transform: translateY(-380px) rotate(18deg); animation-timing-function: cubic-bezier(.4, 0, .9, .6); }
  24% { transform: rotate(-20deg); animation-timing-function: ease-in-out; }
  42% { transform: rotate(12deg); animation-timing-function: ease-in-out; }
  60% { transform: rotate(-7deg); animation-timing-function: ease-in-out; }
  78% { transform: rotate(3deg); animation-timing-function: ease-in-out; }
  100% { transform: none; }
}
.sway { transform-origin: 150px 0; animation: sway 2.8s ease-in-out 1.4s infinite; }
@keyframes sway { 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
.label { font: 400 52px var(--font); fill: #16161a; letter-spacing: -1px; }
.label2 { font: 800 24px 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #16161a; letter-spacing: 6px; opacity: 0.7; }
</style>
</head>
<body>
<svg viewBox="0 0 300 400"><g class="sw"><g class="sway">
<path d="M150 -10 C140 40 160 80 150 132" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
<path d="M150 98 L238 156 L238 360 Q238 378 220 378 L80 378 Q62 378 62 360 L62 156 Z" fill="var(--color)" stroke="var(--color)" stroke-width="12" stroke-linejoin="round"/>
<path d="M150 98 L238 156 L238 200 L62 200 L62 156 Z" fill="#ffffff" opacity="0.18"/>
<circle cx="150" cy="148" r="15" fill="#16161a" opacity="0.85"/><circle cx="150" cy="148" r="15" fill="none" stroke="#ffffff" stroke-width="5"/>
<path d="M150 132 L150 148" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
<text class="label2" x="153" y="250" text-anchor="middle">ONLY</text>
<text class="label" x="150" y="320" text-anchor="middle">$9.99</text>
</g></g></svg>
<script>
/*
 * A price tag that drops in on its string, swings to rest and keeps gently swaying. Its price and color are the
 * clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations
 * are held at t by the host.
 */
window.film = { width: 300, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
