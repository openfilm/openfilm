<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tap here</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
.r { transform-origin: 50px 50px; animation: r 1.2s ease-out infinite; }
@keyframes r { from { transform: scale(1); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="12" fill="var(--color)"/><circle class="r" cx="50" cy="50" r="12" fill="none" stroke="var(--color)" stroke-width="4"/></svg>
<script>
/*
 * A ring that pulses out from a point, as a tap. Its color is the clip's to change. A page of OpenFilm's library
 * (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
