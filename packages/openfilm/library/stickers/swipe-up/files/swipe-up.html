<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Swipe up</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #ffffff; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.in { animation: in 0.55s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes in { from { transform: translateY(60px); opacity: 0; } 50% { opacity: 1; } }
.bob { animation: bob 1.2s ease-in-out 0.6s infinite; }
@keyframes bob { 50% { transform: translateY(-14px); } }
.c { fill: none; stroke: var(--color); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; opacity: 0.3; animation: c 1.2s ease-in-out infinite; }
@keyframes c { 0%, 100% { opacity: 0.4; } 30% { opacity: 1; } }
.label { fill: var(--color); font: 700 40px var(--font); letter-spacing: 1px; animation: lab 0.5s cubic-bezier(.2, .8, .2, 1) 0.2s both; }
@keyframes lab { from { opacity: 0; transform: translateY(16px); } }
</style>
</head>
<body>
<svg viewBox="0 0 300 400"><g class="in">
<g class="bob">
<path class="c" style="animation-delay: 0.4s" d="M96 236 L150 196 L204 236"/>
<path class="c" style="animation-delay: 0.55s" d="M96 172 L150 132 L204 172"/>
<path class="c" style="animation-delay: 0.7s" d="M96 108 L150 68 L204 108"/>
</g>
<text class="label" x="150" y="306" text-anchor="middle">Swipe up</text>
</g></svg>
<script>
/*
 * A swipe-up hint: three chevrons that rise and light up from the bottom, over a word. Its words and color are the
 * clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations
 * are held at t by the host.
 */
window.film = { width: 300, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
