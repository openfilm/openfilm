<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loop arrow</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd60a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
path { fill: none; stroke: var(--color); stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
.d { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw var(--l, 0.45s) cubic-bezier(.6, .05, .3, 1) var(--d, 0s) both; }
@keyframes draw { from { stroke-dashoffset: 1.01; opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
.n { animation: n 1.1s ease-in-out 0.8s infinite; }
@keyframes n { 50% { transform: translate(7px, -6px); } }
</style>
</head>
<body>
<svg viewBox="0 0 500 300"><defs><filter id="boil" filterUnits="userSpaceOnUse" x="-50" y="-30" width="600" height="360"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g filter="url(#boil)"><g class="n">
<path class="d" pathLength="1" style="--l: 0.5s" d="M34 236 C46.7 237.7 84 247.7 110 246 C136 244.3 169 238.7 190 226 C211 213.3 229 189.3 236 170 C243 150.7 238.7 123 232 110 C225.3 97 206.3 90 196 92 C185.7 94 171 108.7 170 122 C169 135.3 175.3 160.7 190 172 C204.7 183.3 234 190.7 258 190 C282 189.3 310.3 178.7 334 168 C357.7 157.3 381.3 140.3 400 126 C418.7 111.7 438.3 89.3 446 82"/>
<path class="d" pathLength="1" style="--d: 0.44s; --l: 0.18s" d="M396.5 88.7 L446 82 L437.1 131.2"/>
</g></g></svg>
<script>
/*
 * A playful arrow that loops once on its way, drawn by hand from its tail to its head, then nudging on. Its color is
 * the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
const noise = [...document.querySelectorAll('feTurbulence')];
window.film = {
  width: 500,
  height: 300,
  frame(t) {
    for (const n of noise) n.setAttribute('seed', String(1 + (Math.floor(t * 8) % 4)));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
