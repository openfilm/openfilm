<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Surprise marks</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd60a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.m { fill: var(--color); stroke: var(--color); stroke-width: 6; stroke-linejoin: round; }
.s { transform-origin: 40px 260px; animation: in 0.42s cubic-bezier(.34, 1.56, .64, 1) var(--d) both; }
@keyframes in { from { transform: scale(0); } }
.tw { transform-origin: 40px 260px; animation: tw 0.9s cubic-bezier(.2, .8, .2, 1) 0.6s infinite; }
@keyframes tw { 0%, 40%, 100% { transform: none; } 12% { transform: scale(0.86); } 24% { transform: scale(1.06); } }
</style>
</head>
<body>
<svg viewBox="0 0 300 300"><g class="tw">
<g transform="rotate(-62 40 260)"><g class="s" style="--d: 0s"><path class="m" d="M112 260 L262 246 Q274 260 262 274 Z"/></g></g>
<g transform="rotate(-38 40 260)"><g class="s" style="--d: 0.07s"><path class="m" d="M124 260 L284 248 Q294 260 284 272 Z"/></g></g>
<g transform="rotate(-14 40 260)"><g class="s" style="--d: 0.14s"><path class="m" d="M112 260 L262 246 Q274 260 262 274 Z"/></g></g>
</g></svg>
<script>
/*
 * Three tapered strokes that spring out from a corner, as a comic shows a start of surprise, and keep twitching. Its
 * color is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 300, height: 300, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
