<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sparkle</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
.s, .s2 { transform-box: fill-box; transform-origin: center; animation: t 1.4s ease-in-out infinite; }
.s2 { animation-delay: -0.7s; }
@keyframes t { 50% { transform: scale(0.6) rotate(20deg); opacity: 0.6; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="s" d="M45 10 L52 38 L80 45 L52 52 L45 80 L38 52 L10 45 L38 38 Z" fill="var(--color)"/><path class="s2" d="M78 64 L81 74 L91 77 L81 80 L78 90 L75 80 L65 77 L75 74 Z" fill="var(--color)"/></svg>
<script>
/*
 * A four-pointed star that twinkles, with a small one beside it. Its color is the clip's to change. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
