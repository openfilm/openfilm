<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Star</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
.s { transform-origin: 50px 55px; animation: w 1.2s ease-in-out infinite; }
@keyframes w { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="s" d="M50 8 L61 38 L94 39 L68 59 L77 91 L50 73 L23 91 L32 59 L6 39 L39 38 Z" fill="var(--color)"/></svg>
<script>
/*
 * A star that rocks from side to side. Its color is the clip's to change. A page of OpenFilm's library (CC0): what
 * it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
