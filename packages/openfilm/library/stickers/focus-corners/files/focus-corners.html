<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Focus frame</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffffff; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
path { fill: none; stroke: var(--color); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.c { animation: in 0.5s cubic-bezier(.34, 1.56, .64, 1) var(--d) both; }
@keyframes in { from { transform: translate(var(--x), var(--y)); opacity: 0; } 30% { opacity: 1; } }
.c path { animation: br 1.4s ease-in-out 0.65s infinite; }
@keyframes br { 50% { transform: translate(calc(var(--x) * 0.12), calc(var(--y) * 0.12)); } }
.dot { fill: var(--color); transform-origin: 300px 180px; animation: dot 0.35s cubic-bezier(.34, 1.56, .64, 1) 0.35s both, blink 1.4s ease-in-out 0.65s infinite; }
@keyframes dot { from { transform: scale(0); } }
@keyframes blink { 50% { opacity: 0.4; } }
</style>
</head>
<body>
<svg viewBox="0 0 600 360">
<g class="c" style="--d: 0s; --x: -60px; --y: -60px"><path d="M30 110 L30 30 L110 30"/></g>
<g class="c" style="--d: 0.05s; --x: 60px; --y: -60px"><path d="M490 30 L570 30 L570 110"/></g>
<g class="c" style="--d: 0.1s; --x: 60px; --y: 60px"><path d="M570 250 L570 330 L490 330"/></g>
<g class="c" style="--d: 0.15s; --x: -60px; --y: 60px"><path d="M110 330 L30 330 L30 250"/></g>
<path class="dot" d="M300 166 L300 194 M286 180 L314 180" style="stroke-width: 5; fill: none"/>
</svg>
<script>
/*
 * Four corners that snap in round something, as a camera finds its focus, and then breathe in and out. Its color is
 * the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 600, height: 360, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
