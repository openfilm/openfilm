<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arrow, bouncing</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
.a { animation: b 0.9s ease-in-out infinite; }
@keyframes b { 50% { transform: translateY(10px); } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="a" d="M50 12 V70 M28 50 L50 74 L72 50" fill="none" stroke="var(--color)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
<script>
/*
 * An arrow pointing down, bouncing. Its color is the clip's to change. A page of OpenFilm's library (CC0): what it
 * shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
