<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SALE ribbon</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Arial Black', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #ff3b30; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.bob { animation: bob 2s ease-in-out 0.7s infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.mid { transform-origin: 280px 100px; animation: mid 0.5s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes mid { from { transform: scaleX(0); } }
.tl { animation: tl 0.35s cubic-bezier(.2, .8, .2, 1) 0.25s both; } .tr { animation: tr 0.35s cubic-bezier(.2, .8, .2, 1) 0.25s both; }
@keyframes tl { from { transform: translateX(80px); opacity: 0; } }
@keyframes tr { from { transform: translateX(-80px); opacity: 0; } }
.label { font: 400 84px var(--font); fill: #ffffff; letter-spacing: 6px; animation: lab 0.4s cubic-bezier(.34, 1.56, .64, 1) 0.3s both; transform-origin: 280px 100px; }
@keyframes lab { from { transform: scale(0.3); opacity: 0; } }
.shine { animation: sh 2.4s ease-in-out 0.9s infinite; }
@keyframes sh { 0% { transform: translateX(-200px) skewX(-20deg); } 45%, 100% { transform: translateX(640px) skewX(-20deg); } }
</style>
</head>
<body>
<svg viewBox="0 0 560 220"><defs><clipPath id="band"><rect x="70" y="40" width="420" height="120" rx="6"/></clipPath>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<g class="bob">
<g class="tl"><polygon points="114,82 12,82 44,132 12,182 114,182" style="fill: color-mix(in srgb, var(--color), #000000 28%)"/><polygon points="70,160 114,160 114,182" style="fill: color-mix(in srgb, var(--color), #000000 55%)"/></g>
<g class="tr"><polygon points="446,82 548,82 516,132 548,182 446,182" style="fill: color-mix(in srgb, var(--color), #000000 28%)"/><polygon points="490,160 446,160 446,182" style="fill: color-mix(in srgb, var(--color), #000000 55%)"/></g>
<g class="mid"><rect x="70" y="40" width="420" height="120" rx="6" fill="var(--color)"/><rect x="70" y="40" width="420" height="10" fill="#ffffff" opacity="0.22"/>
<g clip-path="url(#band)"><rect class="shine" x="0" y="20" width="110" height="160" fill="url(#sg)"/></g></g>
<text class="label" x="283" y="130" text-anchor="middle">SALE</text>
</g></svg>
<script>
/*
 * A ribbon banner that unfolds from its middle with SALE on it, its tails tucking out behind, a shine passing over
 * it now and then. Its words and color are the clip's to change. A page of OpenFilm's library (CC0): what it shows
 * at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 560, height: 220, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
