<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cursor click</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffffff; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
.in { animation: in 0.45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes in { from { transform: translate(130px, 150px); opacity: 0; } 40% { opacity: 1; } }
.p { transform-origin: 200px 200px; animation: press 1.6s ease-in-out 0.45s infinite; }
@keyframes press { 0%, 22%, 100% { transform: none; } 8% { transform: scale(0.84); } }
.r { fill: none; stroke: var(--color); stroke-width: 7; opacity: 0; transform-origin: 200px 200px; animation: ring 1.6s cubic-bezier(.2, .8, .2, 1) 0.5s infinite; }
.r2 { animation-delay: 0.62s; stroke-width: 4; }
@keyframes ring { 0% { transform: scale(0.2); opacity: 1; } 60%, 100% { transform: scale(1.6); opacity: 0; } }
.dot { fill: var(--color); opacity: 0; transform-origin: 200px 200px; animation: dot 1.6s ease-out 0.45s infinite; }
@keyframes dot { 0% { opacity: 0; transform: scale(0.4); } 8% { opacity: 0.45; transform: scale(1); } 40%, 100% { opacity: 0; transform: scale(1.1); } }
.k path { opacity: 0; stroke: var(--color); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: k 1.6s cubic-bezier(.2, .8, .2, 1) 0.5s infinite; }
@keyframes k { 0% { stroke-dashoffset: 1.01; opacity: 0; } 1%, 48% { opacity: 1; } 25% { stroke-dashoffset: 0; } 50%, 100% { stroke-dashoffset: -1; opacity: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 400 400">
<circle class="dot" cx="200" cy="200" r="30"/>
<circle class="r" cx="200" cy="200" r="44"/><circle class="r r2" cx="200" cy="200" r="44"/>
<g class="k"><path pathLength="1" d="M178 172 L150 140"/><path pathLength="1" d="M200 162 L200 122"/><path pathLength="1" d="M168 196 L128 196"/></g>
<g class="in"><g class="p"><path d="M200 200 L200 318 L229 290 L251 338 L272 329 L251 283 L292 282 Z" fill="#ffffff" stroke="#16161a" stroke-width="7" stroke-linejoin="round"/></g></g>
</svg>
<script>
/*
 * A pointer that glides in and clicks, again and again, each click a ripple and a few sparks. The ripple's color is
 * the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
