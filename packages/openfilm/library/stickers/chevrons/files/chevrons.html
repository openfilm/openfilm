<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chevrons</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd60a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); }
path { fill: none; stroke: var(--color); stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
.c { animation: in 0.5s cubic-bezier(.34, 1.56, .64, 1) var(--d) both; }
@keyframes in { from { transform: translateX(-40px) scale(0.3); opacity: 0; } }
.c path { animation: glow 0.9s ease-in-out calc(var(--d) + 0.55s) infinite; }
@keyframes glow { 0%, 100% { opacity: 0.5; } 35% { opacity: 1; } }
</style>
</head>
<body>
<svg viewBox="0 0 400 200">
<g transform="translate(110 100)"><g class="c" style="--d: 0s"><path d="M-26 -50 L24 0 L-26 50"/></g></g>
<g transform="translate(200 100)"><g class="c" style="--d: 0.09s"><path d="M-26 -50 L24 0 L-26 50"/></g></g>
<g transform="translate(290 100)"><g class="c" style="--d: 0.18s"><path d="M-26 -50 L24 0 L-26 50"/></g></g>
</svg>
<script>
/*
 * Three chevrons that pop in one after another and then light up in turn, leading the eye to the right. Its color is
 * the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 400, height: 200, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
