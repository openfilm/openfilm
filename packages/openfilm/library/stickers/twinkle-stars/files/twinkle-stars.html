svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
svg { filter: drop-shadow(0 0 1.4vmin var(--color)); }
.s { animation: in 0.45s cubic-bezier(.34, 1.56, .64, 1) var(--d) both; }
@keyframes in { from { transform: scale(0) rotate(-90deg); } }
.s > * { animation: tw var(--p) ease-in-out calc(var(--d) + 0.45s) infinite; }
@keyframes tw { 50% { transform: scale(0.6) rotate(25deg); opacity: 0.5; } }
.a { fill: var(--color); } .b { fill: #ffffff; } .c { fill: color-mix(in srgb, var(--color), #ffffff 50%); }
</style>

<script>
/*
 * A scatter of little stars and glints that pop in here and there and keep twinkling, each in its own time. Its
 * color is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 500, height: 300, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
