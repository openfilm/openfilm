<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Heart</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffd35a; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
:root { --color: #ff4d6d; }
.h { transform-origin: 50px 50px; animation: h 0.9s ease-in-out infinite; }
@keyframes h { 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><path class="h" d="M50 82 C20 62 10 45 10 32 C10 20 20 12 31 12 C40 12 46 18 50 25 C54 18 60 12 69 12 C80 12 90 20 90 32 C90 45 80 62 50 82 Z" fill="var(--color)"/></svg>
<script>
/*
 * A heart that beats. Its color is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { width: 400, height: 400, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
