<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HOT</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --font: 'Arial Black', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; --color: #ff3b30; }
.w { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0.6vmin 1.4vmin rgba(0, 0, 0, 0.32)); animation: in 0.5s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes in { from { transform: translateX(-30vw) scale(0.5); opacity: 0; } 40% { opacity: 1; } }
.pill { position: relative; display: flex; align-items: center; height: 56vh; padding: 0 8vw 0 21vw; border-radius: 28vh; background: linear-gradient(100deg, color-mix(in srgb, var(--color), #ff9500 55%), var(--color)); animation: glow 1.2s ease-in-out 0.5s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 6vh color-mix(in srgb, var(--color), #ff9500 40%); } }
.label { color: #ffffff; font: italic 900 34vh/1 var(--font); letter-spacing: 0.04em; }
.fl { position: absolute; left: 1vw; bottom: 4vh; width: 20vw; height: 76vh; overflow: visible; }
.fl g { transform-origin: 50px 116px; animation: fl 0.5s ease-in-out infinite alternate; }
.fl g + g { animation-duration: 0.36s; animation-delay: -0.2s; }
@keyframes fl { 0% { transform: scale(1, 1) skewX(-3deg); } 100% { transform: scale(0.96, 1.08) skewX(4deg); } }
.sh { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.sh::after { content: ''; position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); transform: translateX(-120%) skewX(-20deg); animation: sweep 2.4s ease-in-out 0.8s infinite; }
@keyframes sweep { 0% { transform: translateX(-120%) skewX(-20deg); } 45%, 100% { transform: translateX(420%) skewX(-20deg); } }
</style>
</head>
<body>
<div class="w"><div class="pill">
<svg class="fl" viewBox="0 0 100 120">
<g><path d="M50 4 C58 28 86 42 86 76 C86 100 70 116 50 116 C30 116 14 100 14 78 C14 60 26 50 32 34 C38 46 43 50 48 52 C46 36 44 20 50 4 Z" fill="#ffd60a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/></g>
<g><path d="M50 54 C56 68 70 76 70 92 C70 104 61 112 50 112 C39 112 30 104 30 93 C30 81 41 76 44 66 C46 72 48 74 50 76 C50 68 48 60 50 54 Z" fill="#ff7a00"/></g>
</svg>
<div class="label">HOT</div><div class="sh"></div></div></div>
<script>
/*
 * A HOT label with a flame on it: it slides in, the flame keeps flickering and the label glows. Its words and color
 * are the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { width: 360, height: 180, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
