<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Speed ring</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { --color: #ffffff; }
svg { width: 100vw; height: 100vh; display: block; overflow: visible; }
polygon { fill: var(--color); }
</style>
</head>
<body>
<svg viewBox="0 0 400 400"></svg>
<script>
/*
 * A ring of speed lines that rush in toward the middle and keep flickering, the way a comic shows a sudden moment.
 * Its color is the clip's to change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its
 * CSS animations are held at t by the host.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const svg = document.querySelector('svg');
const ns = 'http://www.w3.org/2000/svg';
const lines = Array.from({ length: 64 }, () => svg.appendChild(document.createElementNS(ns, 'polygon')));
const ease = (k) => 1 - Math.pow(1 - Math.min(Math.max(k, 0), 1), 3);
window.film = {
  width: 400,
  height: 400,
  frame(t) {
    const step = Math.floor(t * 12), grow = ease(t / 0.35);
    lines.forEach((el, i) => {
      const a = (i / lines.length) * Math.PI * 2 + (hash(i + step * 0.37) - 0.5) * 0.09;
      const r0 = 200 - (200 - (108 + hash(i * 3.1 + step) * 46)) * grow, r1 = 206;
      const w = 2.5 + hash(i * 7.7 + step * 1.3) * 5;
      const c = Math.cos(a), s = Math.sin(a), px = -s * w, py = c * w;
      el.setAttribute('points', `${200 + c * r0},${200 + s * r0} ${200 + c * r1 + px},${200 + s * r1 + py} ${200 + c * r1 - px},${200 + s * r1 - py}`);
      el.style.opacity = hash(i * 1.9 + step * 2.3) < 0.18 ? 0 : 1;
    });
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
