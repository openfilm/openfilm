<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>News</title>
<style>
:root { --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #e1251b; --ink: #111111; --paper: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.shade { position: fixed; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0) 45%); }
.live { position: fixed; left: 4vw; top: 4vh; font-family: var(--font); font-size: 1.6vmax; font-weight: 800; letter-spacing: .12em; color: #fff; background: rgba(0,0,0,.55); padding: .4em .7em; border-radius: .3em; }
.live::before { content: ""; display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: var(--accent); margin-right: .5em; vertical-align: .05em; }
.box { position: fixed; left: 4vw; right: 4vw; bottom: 7vh; font-family: var(--font); }
.t3 { display: inline-block; font-size: 2.6vmax; font-weight: 900; color: #fff; background: var(--accent); padding: .25em .55em; }
.t1 { display: block; font-size: 5.2vmax; font-weight: 900; line-height: 1.12; color: var(--ink); background: var(--paper); padding: .22em .4em .26em; box-shadow: 0 .1em .4em rgba(0,0,0,.35); }
.t2 { display: block; margin-top: .9vmax; font-size: 1.9vmax; font-weight: 600; color: #fff; text-shadow: 0 .1em .3em rgba(0,0,0,.6); }
@media (max-aspect-ratio: 1/1) { .t1 { font-size: 5.6vmax; } .t3 { font-size: 3vmax; } }
/* a full-screen feed: words kept clear of its caption, its buttons and its top bar */
@media (max-aspect-ratio: 10/16) { .box { bottom: 24vh; right: 18vw; } .live { top: 9vh; } }
</style>
</head>
<body>
<div class="shade"></div><span class="live">LIVE</span><div class="box"><span class="t3">突发</span><span class="t1">城市第一场雪提前到来</span><span class="t2">今晨 6 点 · 现场直击</span></div>
<script>
/*
 * A breaking label over a white headline box: a news cover. A page of OpenFilm's library (CC0): a still, the same at every t.
 */
window.film = { frame() {} };
</script>
</body>
</html>
