<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Confetti</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
i { position: fixed; top: -5vh; width: 0.9vw; height: 1.5vw; animation: c linear infinite; }
@keyframes c { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)) rotateX(720deg); } }
</style>
</head>
<body>

<script>
/*
 * Confetti in many colors, tumbling down. A page of OpenFilm's library (CC0): what it shows at t comes from t
 * alone; its CSS animations are held at t by the host.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function scatter(n, make) {
  for (let i = 0; i < n; i++) { const el = document.createElement('i'); make(el, (k) => hash(i * 7.31 + k)); document.body.append(el); }
}
scatter(90, (el, r) => { el.style.left = `${r(1) * 100}%`; el.style.background = `hsl(${Math.round(r(2) * 360)} 90% 60%)`; el.style.animationDuration = `${2.5 + r(3) * 2.5}s`; el.style.animationDelay = `${-r(4) * 5}s`; el.style.setProperty('--dx', `${(r(5) - 0.5) * 20}vw`); el.style.setProperty('--rot', `${Math.round(r(6) * 720)}deg`); });
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
