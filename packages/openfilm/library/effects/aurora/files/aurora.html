<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aurora</title>
<style>
  /* what a clip of it may change: the curtains' lower color and upper color, how bright (0 to 1), how fast they ripple */
  :root { --color: #4dffa6; --top: #9a5cff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * The northern lights over the top of the frame: curtains of light rippling sideways, bright along their hems and
 * streaked with fine rays that rise into a violet glow and fade. A page of OpenFilm's library (CC0): worked out from
 * t alone at a low resolution and drawn soft.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const buf = document.createElement('canvas'), bx = buf.getContext('2d');
let image = null;
const CURTAINS = [
  { y: 0.3, a: 1, k: 1.0, p: 0.3, s: 1 },
  { y: 0.2, a: 0.7, k: 1.4, p: 2.1, s: -0.7 },
  { y: 0.42, a: 0.45, k: 0.8, p: 4.2, s: 0.5 },
];
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight;
    const amount = num('--amount', 1), speed = num('--speed', 1), lo = rgb('--color', '#4dffa6'), hi = rgb('--top', '#9a5cff');
    const tt = t * speed;
    const lw = 220, lh = Math.max(60, Math.round(220 * h / w));
    if (buf.width !== lw || buf.height !== lh) { buf.width = lw; buf.height = lh; image = bx.createImageData(lw, lh); }
    const aspect = lw / lh, d = image.data;
    d.fill(0);
    for (const c of CURTAINS) {
      for (let x = 0; x < lw; x++) {
        const X = (x / lw) * aspect * c.k;   // across, in screen heights, so a tall frame isn't stretched
        // the hem: a slow fold, a faster ripple running along it
        const hem = c.y + 0.1 * Math.sin(X * 2.2 + tt * 0.25 * c.s + c.p) + 0.03 * Math.sin(X * 6.1 - tt * 0.6 * c.s + c.p * 2) + 0.012 * Math.sin(X * 15 + tt * 1.3);
        // rays: fine streaks drifting along the hem, brighter in some places than others
        const rays = 0.62 + 0.24 * Math.sin(X * 29 + tt * 1.2 * c.s + Math.sin(X * 7 + tt * 0.4) * 2) + 0.14 * Math.sin(X * 67 - tt * 1.9 + c.p);
        const swell = 0.55 + 0.45 * Math.sin(X * 3.3 - tt * 0.35 + c.p * 3);
        const tall = 0.16 + 0.1 * Math.sin(X * 4.1 + tt * 0.3 + c.p);
        const strength = c.a * Math.max(0, rays) * swell;
        for (let y = 0; y < lh; y++) {
          const Y = y / lh;
          const above = hem - Y;
          let v;
          v = above >= 0 ? Math.exp(-above / tall) : Math.exp(above / 0.025);
          v *= strength;
          if (v < 0.004) continue;
          const m = Math.min(1, Math.max(0, above / (tall * 1.6)));   // 0 at the hem, 1 high up
          const k = (y * lw + x) * 4;
          d[k] += v * (lo[0] + (hi[0] - lo[0]) * m); d[k + 1] += v * (lo[1] + (hi[1] - lo[1]) * m); d[k + 2] += v * (lo[2] + (hi[2] - lo[2]) * m);
          d[k + 3] += v * 255;
        }
      }
    }
    // straight (not premultiplied) color: lift each pixel's color back to full strength where it has any alpha
    for (let k = 0; k < d.length; k += 4) {
      const a = d[k + 3];
      if (a > 0) { const f = Math.min(4, 255 / a); d[k] = Math.min(255, d[k] * f); d[k + 1] = Math.min(255, d[k + 1] * f); d[k + 2] = Math.min(255, d[k + 2] * f); d[k + 3] = Math.min(255, a * 0.85); }
    }
    bx.putImageData(image, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    ctx.globalAlpha = Math.min(1, amount);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(buf, 0, 0, w, h);
    // a faint night tint over the sky
    ctx.globalCompositeOperation = 'source-over';
    const sky = ctx.createLinearGradient(0, 0, 0, h * 0.7);
    sky.addColorStop(0, `rgba(10,20,50,${0.25 * amount})`); sky.addColorStop(1, 'rgba(10,20,50,0)');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
