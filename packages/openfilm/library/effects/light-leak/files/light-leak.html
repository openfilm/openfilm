<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light leak</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ff9a3c; }
.l { mix-blend-mode: screen; animation: m 5s ease-in-out infinite alternate;
background: radial-gradient(50% 80% at 8% 30%, var(--color), transparent 70%), radial-gradient(40% 70% at 92% 80%, rgba(255, 60, 90, 0.55), transparent 70%); }
@keyframes m { from { opacity: 0.55; transform: translateX(-4%); } to { opacity: 1; transform: translateX(4%); } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A light leak: warm light drifting over the picture from its edges. A page of OpenFilm's library (CC0): what it
 * shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
