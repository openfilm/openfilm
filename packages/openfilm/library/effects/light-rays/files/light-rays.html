<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light rays</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { mix-blend-mode: screen; animation: b 5s ease-in-out infinite alternate;
background: repeating-conic-gradient(from 200deg at 15% -10%, rgba(255, 240, 200, 0.2) 0 4deg, transparent 4deg 11deg);
mask-image: linear-gradient(160deg, #000 20%, transparent 85%); }
@keyframes b { to { opacity: 0.35; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * Rays of light falling from the top left, slowly brightening and fading. A page of OpenFilm's library (CC0): what
 * it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
