<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scan lines</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 3px); }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * Scan lines, as on an old screen. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its
 * CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
