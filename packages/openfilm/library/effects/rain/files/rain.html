<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rain</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
i { position: fixed; top: -20vh; width: 1.5px; height: 14vh; background: linear-gradient(transparent, rgba(210, 225, 255, 0.75)); transform: rotate(12deg); animation: r linear infinite; }
@keyframes r { to { transform: translate(-22vh, 125vh) rotate(12deg); } }
</style>
</head>
<body>

<script>
/*
 * Rain: thin streaks falling fast, slanted by the wind. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function scatter(n, make) {
  for (let i = 0; i < n; i++) { const el = document.createElement('i'); make(el, (k) => hash(i * 7.31 + k)); document.body.append(el); }
}
scatter(120, (el, r) => { el.style.left = `${r(1) * 120}%`; el.style.animationDuration = `${0.45 + r(2) * 0.3}s`; el.style.animationDelay = `${-r(3) * 2}s`; el.style.opacity = String(0.3 + r(4) * 0.7); });
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
