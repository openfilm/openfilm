<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Camera viewfinder</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ffffff; }
.l { inset: 5%; background:
linear-gradient(var(--color), var(--color)) 0 0 / 7% 2px no-repeat, linear-gradient(var(--color), var(--color)) 0 0 / 2px 12% no-repeat,
linear-gradient(var(--color), var(--color)) 100% 0 / 7% 2px no-repeat, linear-gradient(var(--color), var(--color)) 100% 0 / 2px 12% no-repeat,
linear-gradient(var(--color), var(--color)) 0 100% / 7% 2px no-repeat, linear-gradient(var(--color), var(--color)) 0 100% / 2px 12% no-repeat,
linear-gradient(var(--color), var(--color)) 100% 100% / 7% 2px no-repeat, linear-gradient(var(--color), var(--color)) 100% 100% / 2px 12% no-repeat; }
.rec { position: fixed; left: 8%; top: 9%; color: var(--color); font: 600 2.4vw/1 ui-monospace, Menlo, monospace; letter-spacing: 0.1em; text-shadow: 0 0 4px rgba(0, 0, 0, 0.6); }
.rec b { color: #ff3b30; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div><div class="rec"><b>●</b> REC</div>
<script>
/*
 * A camera's viewfinder: corner marks and a blinking REC. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
