<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Emotion marks</title>
<style>
  /* what a clip of it may change: the anger mark's color, the sweat drops' color, how fast they move */
  :root { --color: #ff2d3f; --accent: #6cc8ff; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Comic marks of feeling: a throbbing anger mark up on the right, sweat drops sliding down on the left, and a
 * little spiral of confusion turning between them. A page of OpenFilm's library (CC0): every mark comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const INK = '#21141c';
function anger(x, y, s, c) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.2); ctx.scale(s, s);
  ctx.lineCap = 'round';
  for (const [width, color] of [[0.5, '#ffffff'], [0.34, INK], [0.2, `rgb(${c})`]]) {
    ctx.lineWidth = width; ctx.strokeStyle = color;
    for (let q = 0; q < 4; q++) {
      ctx.save(); ctx.rotate(q * Math.PI / 2);
      // a bent stroke whose elbow points at the middle
      ctx.beginPath(); ctx.moveTo(0.2, 0.75); ctx.quadraticCurveTo(0.24, 0.24, 0.75, 0.2); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}
function drop(x, y, s, c, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y); ctx.rotate(0.25); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -1);
  ctx.bezierCurveTo(0.2, -0.6, 0.62, -0.1, 0.62, 0.3);
  ctx.arc(0, 0.3, 0.62, 0, Math.PI);
  ctx.bezierCurveTo(-0.62, -0.1, -0.2, -0.6, 0, -1);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -1, 0, 0.92);
  g.addColorStop(0, `rgb(${c.map((v) => Math.round(v + (255 - v) * 0.7))})`); g.addColorStop(1, `rgb(${c})`);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 0.3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  ctx.lineWidth = 0.12; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.ellipse(-0.24, 0.22, 0.11, 0.24, 0.3, 0, 6.283); ctx.fill();
  ctx.restore();
}
function spiral(x, y, r, turn, u) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(turn);
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = (i / 120) * 6.283 * 2.6, rr = r * (i / 120);
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(0, 0);
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 1.4 * u; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.stroke();
  ctx.lineWidth = 0.65 * u; ctx.strokeStyle = '#3b3a8f'; ctx.stroke();
  ctx.restore();
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const speed = num('--speed', 1), c = rgb('--color', '#ff2d3f'), d = rgb('--accent', '#6cc8ff');
    const tt = t * speed;
    // the anger mark throbs twice a beat, like a pulse
    const beat = (tt * 1.4) % 1, throb = Math.exp(-beat * 9) + 0.6 * Math.exp(-Math.max(0, beat - 0.22) * 9) * (beat > 0.22);
    const pop = Math.min(1, t / 0.25), popS = pop < 1 ? 1 - Math.pow(1 - pop, 3) * Math.cos(pop * 8) : 1;
    anger(w * 0.8, h * 0.2, 12 * u * (1 + 0.16 * throb) * Math.max(0.2, popS), c);
    // three drops sliding down by the left edge, each on its own round
    for (let i = 0; i < 3; i++) {
      const cyc = 1.5, p = ((tt + i * 0.5 + 0.3) % cyc) / cyc;
      const slide = p * p * 10 * u;
      const a = Math.min(1, p / 0.12) * (1 - Math.max(0, (p - 0.75) / 0.25));
      const s = (5.6 - i * 1.1) * u * (0.85 + 0.15 * Math.min(1, p / 0.12));
      drop(w * 0.2 + [0, -9, 8][i] * u, h * 0.15 + [0, 8, 13][i] * u + slide, s, d, a);
    }
    spiral(w * 0.64, h * 0.13, 6 * u, -tt * 4, u);
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
