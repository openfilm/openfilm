<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Impact marks</title>
<style>
  /* what a clip of it may change: the marks' color, the burst's color behind them, how quickly they come */
  :root { --color: #ffe14a; --accent: #ff3d5a; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Comic marks of surprise: a bold "!!!" or "!?" slams in on a spiky burst, overshoots, shakes and settles, then
 * flies off as the next one lands on the other side. A page of OpenFilm's library (CC0): each mark comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const MARKS = ['!!!', '!?', '!!', '!!!', '?!'];
const easeBack = (p) => { const s = 2.2; p -= 1; return 1 + p * p * ((s + 1) * p + s); };
function burst(x, y, r, spikes, seed, fill) {
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const a = (i / (spikes * 2)) * 6.283 + seed;
    const rr = i % 2 ? r * (0.58 + hash(seed * 13 + i) * 0.1) : r * (0.85 + hash(seed * 7 + i) * 0.35);
    const px = x + Math.cos(a) * rr * 1.25, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
}
function mark(t, k, w, h, u, A, B) {
  const s = t - k;                                  // seconds into this mark (in beats)
  if (s < 0 || s > 1) return;
  const right = k % 2 === 0;
  const x = w * (right ? 0.74 : 0.26) + (hash(k * 3.1) - 0.5) * w * 0.08;
  const y = h * (0.26 + hash(k * 5.7) * 0.1);
  const text = MARKS[Math.floor(hash(k * 9.3) * MARKS.length)];
  const pop = easeBack(Math.min(1, s / 0.16));
  const out = Math.max(0, (s - 0.86) / 0.14);
  const scale = pop * (1 + out * 0.35), alpha = 1 - out;
  const shake = Math.max(0, 1 - s / 0.35), step = Math.floor(t * 24 * 2.4);
  const sx = (hash(step * 1.3 + k) - 0.5) * 2.4 * u * shake, sy = (hash(step * 2.9 + k) - 0.5) * 2.4 * u * shake;
  const size = Math.min(w, h) * 0.2 * (0.9 + hash(k * 4.4) * 0.25);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x + sx, y + sy);
  ctx.rotate((right ? 1 : -1) * (0.12 + hash(k * 6.1) * 0.08));
  ctx.scale(scale, scale);
  ctx.lineJoin = 'miter'; ctx.strokeStyle = '#1a1014';
  // the spiky burst behind it, a white one under a colored one
  ctx.lineWidth = 0.7 * u;
  burst(0, 0, size * 0.95, 14, k * 1.7, 'rgba(255,255,255,0.95)');
  burst(0, 0, size * 0.72, 12, k * 2.3 + 0.2, `rgb(${B})`);
  // action ticks flying off the burst
  ctx.lineCap = 'round'; ctx.lineWidth = 0.9 * u; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  for (let i = 0; i < 5; i++) {
    const a = -2.4 + i * 0.32 + (right ? 0 : Math.PI + 1.6), r0 = size * (1.25 + Math.min(1, s / 0.2) * 0.15);
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0 * 0.85); ctx.lineTo(Math.cos(a) * (r0 + size * 0.25), Math.sin(a) * (r0 + size * 0.25) * 0.85); ctx.stroke();
  }
  // the mark itself: leaning, black outline, hard shadow
  ctx.transform(1, 0, -0.18, 1, 0, 0);
  ctx.font = `900 ${size * 0.95}px "Arial Black", "Helvetica Neue", "PingFang SC", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  // a hard shadow, a white sticker edge, a thin ink line, then the color
  ctx.lineWidth = size * 0.2; ctx.strokeStyle = 'rgba(26,16,20,0.85)';
  ctx.strokeText(text, size * 0.07, size * 0.09);
  ctx.strokeStyle = '#ffffff'; ctx.strokeText(text, 0, 0);
  ctx.lineWidth = size * 0.075; ctx.strokeStyle = '#1a1014'; ctx.strokeText(text, 0, 0);
  const g = ctx.createLinearGradient(0, -size * 0.4, 0, size * 0.4);
  g.addColorStop(0, `rgb(${A.map((v) => Math.round(v + (255 - v) * 0.75))})`); g.addColorStop(0.5, `rgb(${A})`); g.addColorStop(1, `rgb(${A.map((v, i) => Math.round(v * [1, 0.72, 0.5][i]))})`);
  ctx.fillStyle = g;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const speed = Math.max(0.1, num('--speed', 1)), A = rgb('--color', '#ffe14a'), B = rgb('--accent', '#ff3d5a');
    // one mark every 1.2 seconds or so, starting already in place
    const beat = (t + 0.3) * speed / 1.2, k = Math.floor(beat);
    mark(beat, k - 1, w, h, u, A, B);
    mark(beat, k, w, h, u, A, B);
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
