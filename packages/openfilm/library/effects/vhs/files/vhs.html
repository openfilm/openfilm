<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VHS</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px); }
.band { position: fixed; left: 0; right: 0; height: 7vh; background: linear-gradient(transparent, rgba(255, 255, 255, 0.12), transparent); animation: roll 4s linear infinite; }
.osd { position: fixed; color: #fff; font: 700 2.6vw/1.25 ui-monospace, Menlo, monospace; text-shadow: 2px 0 #f0f, -2px 0 #0ff; }
@keyframes roll { from { top: -8vh; } to { top: 105vh; } }
</style>
</head>
<body>
<div class="l"></div><div class="band"></div><div class="osd" style="left:5%;top:6%">PLAY ▶</div><div class="osd" style="left:5%;bottom:7%">AM 07:42<br>OCT 30 2026</div>
<script>
/*
 * A VHS tape: scan lines, a PLAY mark, a date in the corner and a band of noise rolling down. A page of OpenFilm's
 * library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
