<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lens flare</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { mix-blend-mode: screen; animation: p 3s ease-in-out infinite;
background: radial-gradient(circle at 78% 22%, rgba(255, 255, 240, 0.95) 0 2%, rgba(255, 220, 150, 0.5) 7%, transparent 22%),
radial-gradient(circle at 55% 45%, rgba(255, 200, 120, 0.18) 0 4%, transparent 8%),
radial-gradient(circle at 40% 62%, rgba(140, 200, 255, 0.16) 0 3%, transparent 6%),
linear-gradient(140deg, transparent 40%, rgba(255, 210, 140, 0.16) 55%, transparent 70%); }
@keyframes p { 50% { opacity: 0.7; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A lens flare in the top corner, breathing a little. A page of OpenFilm's library (CC0): what it shows at t comes
 * from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
