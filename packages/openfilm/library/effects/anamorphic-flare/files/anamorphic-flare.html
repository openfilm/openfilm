<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Anamorphic flare</title>
<style>
  /* what a clip of it may change: the streak's color, how strong it is (0 to 1), how fast the light drifts */
  :root { --color: #5aa8ff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * An anamorphic lens flare: a bright light drifting through the top of the picture, drawing the long thin blue
 * streak of a cinema lens across the whole frame, with ghosts of the lens strung on the line through the middle and
 * a faint shimmer. A page of OpenFilm's library (CC0): what it shows at t comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const mix = (c, k) => c.map((v) => Math.round(v + (255 - v) * k));
// a radial glow squashed to an ellipse: rx wide, ry tall
function ellipse(x, y, rx, ry, stops) {
  ctx.save(); ctx.translate(x, y); ctx.scale(rx / 100, ry / 100);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 100);
  for (const [o, c] of stops) g.addColorStop(o, c);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 100, 0, 6.283); ctx.fill();
  ctx.restore();
}
function polygon(x, y, r, sides, turn) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) { const a = turn + (i / sides) * 6.283; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}
// the lens's ghosts: where on the line through the middle (1 is the light, -1 its mirror), how big, which tint
const GHOSTS = Array.from({ length: 9 }, (_, i) => ({ at: 0.75 - i * 0.27 + (hash(i + 0.3) - 0.5) * 0.12, r: 1.2 + hash(i + 0.6) * 6, ring: hash(i + 0.9) > 0.7, hex: hash(i + 0.1) > 0.45, tint: hash(i + 0.5) }));
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = num('--amount', 1), tt = t * num('--speed', 1), c = rgb('--color', '#5aa8ff');
    // the light drifts slowly along a long loop in the upper part of the frame
    const sx = w * (0.5 + 0.32 * Math.sin(tt * 0.21 + 0.9) + 0.06 * Math.sin(tt * 0.53)), sy = h * (0.28 + 0.1 * Math.sin(tt * 0.17 + 2.1));
    const flicker = 0.9 + 0.06 * Math.sin(tt * 7.3) + 0.04 * Math.sin(tt * 13.1 + 1);
    const a = amount * flicker;
    ctx.globalCompositeOperation = 'lighter';
    // a wide faint haze, then the streak: a long thin line with a brighter, shorter one inside it
    ellipse(sx, sy, 0.5 * w, 0.32 * h, [[0, `rgba(${c},${0.16 * a})`], [1, `rgba(${c},0)`]]);
    ellipse(sx, sy, 1.15 * w, 2.6 * u, [[0, `rgba(${mix(c, 0.5)},${0.75 * a})`], [0.25, `rgba(${c},${0.38 * a})`], [1, `rgba(${c},0)`]]);
    ellipse(sx, sy, 0.45 * w, 0.7 * u, [[0, `rgba(255,255,255,${0.9 * a})`], [0.4, `rgba(${mix(c, 0.6)},${0.5 * a})`], [1, `rgba(${c},0)`]]);
    // a second streak a little below, fainter: the lens's reflection of the first
    ellipse(w - sx * 0.2 - w * 0.4, sy + 7 * u, 0.6 * w, 0.8 * u, [[0, `rgba(${c},${0.18 * a})`], [1, `rgba(${c},0)`]]);
    // the light itself
    ellipse(sx, sy, 9 * u, 9 * u, [[0, `rgba(255,255,255,${a})`], [0.12, `rgba(255,255,255,${0.9 * a})`], [0.35, `rgba(${mix(c, 0.4)},${0.35 * a})`], [1, `rgba(${c},0)`]]);
    // a few thin spikes through it
    for (let i = 0; i < 4; i++) {
      const ang = i * 0.785 + 0.3 + tt * 0.05;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      ellipse(0, 0, (7 + 5 * hash(i)) * u, 0.18 * u, [[0, `rgba(255,255,255,${0.5 * a})`], [1, 'rgba(255,255,255,0)']]);
      ctx.restore();
    }
    // the ghosts on the line through the middle of the frame
    const cx = w / 2, cy = h / 2, dx = sx - cx, dy = sy - cy;
    const tints = [c, [255, 190, 110], [140, 255, 200], [200, 150, 255]];
    for (const g of GHOSTS) {
      const x = cx + dx * g.at, y = cy + dy * g.at, r = g.r * u * (1 + 0.3 * Math.abs(g.at));
      const tc = mix(tints[Math.floor(g.tint * tints.length)], 0.25);
      if (g.ring) {
        ctx.strokeStyle = `rgba(${tc},${0.14 * a})`; ctx.lineWidth = 0.35 * u;
        ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 6.283); ctx.stroke();
      } else if (g.hex) {
        const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, `rgba(${tc},${0.05 * a})`); gr.addColorStop(0.85, `rgba(${tc},${0.13 * a})`); gr.addColorStop(1, `rgba(${tc},${0.02 * a})`);
        ctx.fillStyle = gr; polygon(x, y, r, 6, 0.2); ctx.fill();
      } else {
        ellipse(x, y, r, r, [[0, `rgba(${tc},${0.2 * a})`], [1, `rgba(${tc},0)`]]);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
