<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Disco ball</title>
<style>
  /* what a clip of it may change: how many light spots (0 to 1), how fast the ball turns, whether the ball shows (0 or 1) */
  :root { --amount: 1; --speed: 1; --ball: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A mirror ball turning at the top of the picture: its facets glitter, colored beams sweep down through a faint
 * haze, and its reflections slide across the frame as spots of light, stretching as they reach the sides, their
 * colors slowly cycling. The room is dimmed a little so the light reads. A page of OpenFilm's library (CC0): every
 * spot's place is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const sprites = new Map();
function sprite(c) {
  const key = c.join();
  if (sprites.has(key)) return sprites.get(key);
  const g = document.createElement('canvas'); g.width = g.height = 64;
  const x = g.getContext('2d'), r = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, `rgba(${c.map((v) => Math.round(v + (255 - v) * 0.6))},1)`); r.addColorStop(0.35, `rgba(${c},0.9)`); r.addColorStop(0.6, `rgba(${c},0.25)`); r.addColorStop(1, `rgba(${c},0)`);
  x.fillStyle = r; x.fillRect(0, 0, 64, 64);
  sprites.set(key, g);
  return g;
}
const COLORS = [[255, 60, 200], [60, 220, 255], [255, 200, 60], [150, 90, 255], [255, 255, 255], [80, 255, 160]];
// a color drifting round the palette
const cycle = (p) => { const n = COLORS.length, i = Math.floor(((p % n) + n) % n), f = ((p % 1) + 1) % 1, a = COLORS[i], b = COLORS[(i + 1) % n]; const s = f * f * (3 - 2 * f); return a.map((v, k) => Math.round(v + (b[k] - v) * s)); };
const SPOTS = 190;
const spots = Array.from({ length: SPOTS }, (_, i) => ({ lon: hash(i * 3.1) * Math.PI * 2, lat: hash(i * 5.7) * 2 - 1, size: 0.6 + hash(i * 7.3) * 0.9, hue: hash(i * 9.1) * COLORS.length, order: hash(i * 11.3) }));
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), showBall = num('--ball', 1) > 0.5;
    const spin = t * 0.45 * speed;
    const bx = w / 2, by = 10 * u, R = 7 * u;
    // the room, dimmed toward the edges
    const dim = ctx.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.5, Math.hypot(w, h) * 0.6);
    dim.addColorStop(0, 'rgba(10,4,24,0.18)'); dim.addColorStop(1, 'rgba(6,2,16,0.5)');
    ctx.fillStyle = dim; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    // beams sweeping down from the ball through the haze
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 2 + Math.sin(t * (0.35 + i * 0.07) * speed + i * 1.9) * 0.95;
      const L = Math.hypot(w, h), spread = 0.05 + 0.03 * hash(i);
      // pale tints: over a bright picture a beam must still read as light, not a colored shadow
      const c = cycle(i * 1.3 + t * 0.25).map((v) => Math.round(v + (255 - v) * 0.5));
      for (const [k, a0] of [[2.4, 0.1], [1, 0.22]]) {
        const g = ctx.createLinearGradient(bx, by, bx + Math.cos(a) * L, by + Math.sin(a) * L);
        g.addColorStop(0, `rgba(${c},${a0})`); g.addColorStop(0.45, `rgba(${c},${a0 * 0.3})`); g.addColorStop(1, `rgba(${c},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a - spread * k) * L, by + Math.sin(a - spread * k) * L);
        ctx.lineTo(bx + Math.cos(a + spread * k) * L, by + Math.sin(a + spread * k) * L);
        ctx.closePath(); ctx.fill();
      }
    }
    // the reflections sliding round the room: a spot is seen while its facet faces us, stretched near the sides
    for (const s of spots) {
      if (s.order > amount) continue;
      const th = ((s.lon + spin) % (Math.PI * 2)) - Math.PI;
      const c = Math.cos(th);
      if (c < 0.05) continue;
      const x = w / 2 + Math.sin(th) * w * 0.62;
      const y = h * 0.55 + s.lat * h * 0.55 + Math.sin(th) * s.lat * h * 0.05;
      const d = s.size * 2.6 * u;
      const col = cycle(s.hue + t * 0.3);
      ctx.globalAlpha = Math.min(1, c * 1.4) * 0.85;
      ctx.drawImage(sprite(col), x - d / c * 0.9, y - d * 0.9, d / c * 1.8, d * 1.8);
    }
    ctx.globalAlpha = 1;
    // the ball itself, on its wire
    if (showBall) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(200,200,210,0.7)'; ctx.lineWidth = Math.max(1, 0.25 * u);
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, by - R); ctx.stroke();
      const base = ctx.createRadialGradient(bx - R * 0.35, by - R * 0.35, R * 0.1, bx, by, R);
      base.addColorStop(0, '#9aa0ad'); base.addColorStop(0.7, '#3a3d48'); base.addColorStop(1, '#14151b');
      ctx.fillStyle = base; ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.clip();
      const rows = 12;
      for (let i = 0; i < rows; i++) {
        const la = -Math.PI / 2 + (i + 0.5) / rows * Math.PI, cl = Math.cos(la);
        const cols = Math.max(4, Math.round(26 * cl));
        for (let j = 0; j < cols; j++) {
          const lo = (j / cols) * Math.PI * 2 + spin * 1.6;
          const nx = Math.sin(lo) * cl, nz = Math.cos(lo) * cl, ny = Math.sin(la);
          if (nz <= 0) continue;
          const fw = (Math.PI * 2 / cols) * cl * R * Math.max(0.1, nz) * 0.92, fh = Math.PI / rows * R * Math.cos(la) * 0.92 + Math.PI / rows * R * Math.abs(ny) * 0.3;
          const lit = Math.max(0, -0.45 * nx - 0.55 * ny + 0.7 * nz);
          const id = i * 97 + j;
          const flash = hash(id + Math.floor(t * 10) * 13.1) > 0.94;
          const v = Math.round(60 + 170 * lit * (0.6 + 0.4 * hash(id)));
          const tint = cycle(hash(id) * 6 + t * 0.3);
          ctx.fillStyle = flash ? '#ffffff' : `rgb(${Math.round(v * 0.85 + tint[0] * 0.15)},${Math.round(v * 0.85 + tint[1] * 0.15)},${Math.round(v * 0.85 + tint[2] * 0.15)})`;
          ctx.fillRect(bx + nx * R - fw / 2, by + ny * R - fh / 2, fw, fh);
        }
      }
      ctx.restore();
      // glints flaring off the ball
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const k = Math.floor(t * 3 + i * 0.33), f = (t * 3 + i * 0.33) % 1, e = Math.sin(f * Math.PI);
        const a = hash(k * 7 + i) * Math.PI * 2, rr = R * (0.3 + 0.6 * hash(k * 3 + i));
        const gx = bx + Math.cos(a) * rr, gy = by + Math.sin(a) * rr, L = R * 0.9 * e;
        ctx.fillStyle = `rgba(255,255,255,${0.9 * e})`;
        ctx.beginPath(); ctx.moveTo(gx - L, gy); ctx.lineTo(gx, gy - L * 0.08); ctx.lineTo(gx + L, gy); ctx.lineTo(gx, gy + L * 0.08); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(gx, gy - L); ctx.lineTo(gx + L * 0.08, gy); ctx.lineTo(gx, gy + L); ctx.lineTo(gx - L * 0.08, gy); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 0.6 * e; ctx.drawImage(sprite([255, 255, 255]), gx - L * 0.5, gy - L * 0.5, L, L); ctx.globalAlpha = 1;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
