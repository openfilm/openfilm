<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glitch</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { mix-blend-mode: screen; animation: g 1.4s steps(1) infinite; opacity: 0;
background: repeating-linear-gradient(0deg, rgba(255, 0, 90, 0.45) 0 2px, transparent 2px 14px, rgba(0, 230, 255, 0.4) 14px 16px, transparent 16px 31px); }
@keyframes g { 0% { opacity: 0; } 10% { opacity: 1; transform: translateX(-3%); } 14% { transform: translateX(4%); } 18% { opacity: 0; } 60% { opacity: 0; } 62% { opacity: 1; transform: translateX(2%) scaleY(1.3); } 66% { opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A broken signal: colored bars that jump across the picture now and then. A page of OpenFilm's library (CC0):
 * what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
