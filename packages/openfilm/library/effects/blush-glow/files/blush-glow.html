<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blush</title>
<style>
  /* what a clip of it may change: the blush's color, how strong it is (0 to 1), how fast it pulses */
  :root { --color: #ff7aa8; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Shy and flustered: a warm pink glow creeping in from the edges and pulsing like a heartbeat, two soft blush marks
 * hatched with quick pink strokes, and little hearts floating up. A page of OpenFilm's library (CC0): everything
 * comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const HEART = Array.from({ length: 40 }, (_, i) => {
  const a = (i / 40) * 6.283, s = Math.sin(a);
  return [16 * s * s * s / 34, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 34];
});
function heart(x, y, size, turn) {
  const c = Math.cos(turn), s = Math.sin(turn);
  ctx.beginPath();
  HEART.forEach(([hx, hy], i) => {
    const px = x + (hx * c - hy * s) * size, py = y + (hx * s + hy * c) * size;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.closePath();
}
function blush(x, y, u, c, a, step, seed) {
  // a soft oval of color
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, 0.55);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 12 * u);
  g.addColorStop(0, `rgba(${c},${0.6 * a})`); g.addColorStop(0.55, `rgba(${c},${0.3 * a})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 12 * u, 0, 6.283); ctx.fill();
  ctx.restore();
  // four quick strokes, redrawn eight times a second like a hand-drawn loop
  ctx.lineCap = 'round';
  const deep = c.map((v, i) => Math.round(v * [0.95, 0.45, 0.55][i]));
  for (let i = 0; i < 4; i++) {
    const j = (k) => (hash(seed + step * 3.1 + i * 7 + k) - 0.5) * 0.5 * u;
    const sx = x + (i - 1.5) * 3.4 * u;
    ctx.lineWidth = 1 * u;
    ctx.strokeStyle = `rgba(${deep},${0.9 * a})`;
    ctx.beginPath(); ctx.moveTo(sx + 1.5 * u + j(1), y - 2.6 * u + j(2)); ctx.lineTo(sx - 1.5 * u + j(3), y + 2.6 * u + j(4)); ctx.stroke();
  }
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, num('--amount', 1)), speed = num('--speed', 1), c = rgb('--color', '#ff7aa8');
    const tt = t * speed;
    // a heartbeat: two quick swells, then rest
    const b = (tt * 1.1) % 1, beat = Math.exp(-b * 7) + 0.7 * (b > 0.25 ? Math.exp(-(b - 0.25) * 7) : 0);
    const glow = (0.35 + 0.25 * beat) * amount;
    const R = Math.hypot(w, h) / 2;
    const g = ctx.createRadialGradient(w / 2, h / 2, R * 0.35, w / 2, h / 2, R);
    g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(0.55, `rgba(${c},${glow * 0.45})`); g.addColorStop(1, `rgba(${c},${glow})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // a faint warm wash over everything
    ctx.fillStyle = `rgba(${c},${0.07 * amount})`; ctx.fillRect(0, 0, w, h);
    const step = Math.floor(t * 8);
    const s = Math.min(1, amount * (0.85 + 0.15 * beat));
    blush(w * 0.5 - Math.min(w * 0.26, 30 * u), h * 0.6, u, c, s, step, 1);
    blush(w * 0.5 + Math.min(w * 0.26, 30 * u), h * 0.6, u, c, s, step, 2);
    // little hearts floating up the sides
    ctx.lineJoin = 'round';
    for (let i = 0; i < 12; i++) {
      const r = (k) => hash(i * 17.3 + k);
      if (r(9) > amount) continue;
      const cyc = 3 + r(1) * 2, p = ((tt + r(2) * cyc) % cyc) / cyc;
      const side = i % 2 ? 1 : -1;
      const x = w / 2 + side * w * (0.3 + r(3) * 0.17) + Math.sin(p * 6.283 * 1.2 + r(4) * 6) * 2.2 * u;
      const y = h * (1.05 - p * 0.75);
      const a = Math.min(1, p / 0.15) * (1 - Math.max(0, (p - 0.6) / 0.4));
      const size = (3.6 + r(5) * 3.4) * u * (0.85 + 0.15 * beat);
      ctx.globalAlpha = a;
      heart(x, y, size, Math.sin(p * 9 + i) * 0.3);
      ctx.fillStyle = `rgb(${c.map((v) => Math.round(v + (255 - v) * 0.25))})`; ctx.fill();
      ctx.lineWidth = Math.max(1, size * 0.1); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
