<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dust in the light</title>
<style>
  /* what a clip of it may change: the light's color, how much dust floats (0 to 1), how fast it drifts */
  :root { --color: #ffe2ad; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Sunlight slanting in through a high window, a fan of shafts that shimmer as the air moves, and dust floating in
 * the light: dark outside the beam, glittering where the beam catches it. A page of OpenFilm's library (CC0): every
 * shaft and speck comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
// a soft round glow, drawn once for each color: a hot white core fading out through the color
const sprites = new Map();
function sprite(c) {
  const key = c.join();
  if (sprites.has(key)) return sprites.get(key);
  const g = document.createElement('canvas'); g.width = g.height = 128;
  const x = g.getContext('2d'), r = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  const hot = c.map((v) => Math.round(v + (255 - v) * 0.7));
  r.addColorStop(0, `rgba(${hot},1)`); r.addColorStop(0.18, `rgba(${c},0.85)`); r.addColorStop(0.45, `rgba(${c},0.22)`); r.addColorStop(1, `rgba(${c},0)`);
  x.fillStyle = r; x.fillRect(0, 0, 128, 128);
  sprites.set(key, g);
  return g;
}
const RAYS = 9;
const rays = Array.from({ length: RAYS }, (_, i) => ({ at: (i + 0.5) / RAYS + (hash(i + 0.4) - 0.5) * 0.06, width: 0.03 + hash(i + 0.8) * 0.06, rate: 0.3 + hash(i + 1.3) * 0.7, phase: hash(i + 1.9) * 6.283 }));
const SPREAD = 0.6;                              // the fan's width in radians
// how bright the fan is across its width (0..1 from one edge to the other) at time t
function across(f, t) {
  if (f <= 0 || f >= 1) return 0;
  const edge = Math.sin(Math.PI * f);
  let v = 0.25;
  for (const r of rays) { const d = (f - r.at) / r.width; v += Math.exp(-d * d) * (0.45 + 0.4 * Math.sin(t * r.rate + r.phase)); }
  return Math.min(1.4, v) * edge * edge;
}
const N = 420;
const motes = Array.from({ length: N }, (_, i) => {
  const r = (k) => hash(i * 3.91 + k);
  return { x: r(1), y: r(2), order: r(3), depth: r(4), f: [0.05 + r(5) * 0.12, 0.07 + r(6) * 0.12, 0.2 + r(7) * 0.3], p: [r(8), r(9), r(10)].map((v) => v * 6.283), tw: 1 + r(11) * 3, fall: (r(12) - 0.3) * 0.01 };
});
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = num('--amount', 1), speed = num('--speed', 1), c = rgb('--color', '#ffe2ad');
    const tt = t * speed;
    // the source sits up and to the left, beyond the frame; the fan points down and to the right
    const sx = 0.02 * w, sy = -0.2 * h, axis = Math.atan2(h * 1.1, w * 0.85), len = Math.hypot(w, h) * 1.25;
    const a0 = axis - SPREAD / 2;
    const g = ctx.createConicGradient(a0, sx, sy);
    const steps = 48;
    for (let k = 0; k <= steps; k++) {
      const f = k / steps, v = across(f, t * 0.9);
      g.addColorStop((f * SPREAD) / 6.283, `rgba(${c},${(0.5 * v).toFixed(3)})`);
    }
    g.addColorStop(Math.min(1, (SPREAD + 0.01) / 6.283), `rgba(${c},0)`);
    g.addColorStop(1, `rgba(${c},0)`);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // fade the shafts out with distance
    ctx.globalCompositeOperation = 'destination-out';
    const fall = ctx.createRadialGradient(sx, sy, len * 0.15, sx, sy, len);
    fall.addColorStop(0, 'rgba(0,0,0,0)'); fall.addColorStop(0.65, 'rgba(0,0,0,0.4)'); fall.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = fall; ctx.fillRect(0, 0, w, h);
    // the dust
    ctx.globalCompositeOperation = 'lighter';
    const img = sprite(c.map((v) => Math.round(v + (255 - v) * 0.3)));
    for (const m of motes) {
      if (m.order > amount) continue;
      const x = (((m.x + 0.03 * Math.sin(tt * m.f[0] + m.p[0]) + 0.012 * Math.sin(tt * m.f[2] + m.p[2])) % 1 + 1) % 1) * w;
      const y = (((m.y + m.fall * tt + 0.03 * Math.sin(tt * m.f[1] + m.p[1]) + 0.01 * Math.cos(tt * m.f[2] * 1.3 + m.p[0])) % 1 + 1) % 1) * h;
      const ang = Math.atan2(y - sy, x - sx), dist = Math.hypot(x - sx, y - sy) / len;
      const lit = across((ang - a0) / SPREAD, t * 0.9) * Math.max(0, 1 - dist * 0.9);
      if (lit < 0.03) continue;
      const tw = 0.6 + 0.4 * Math.sin(t * m.tw + m.p[1]);
      const d = (0.5 + m.depth * m.depth * 2.4) * u * (m.depth > 0.92 ? 2.4 : 1);
      ctx.globalAlpha = Math.min(1, lit * tw * (m.depth > 0.92 ? 0.45 : 1.6));
      ctx.drawImage(img, x - d / 2, y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
