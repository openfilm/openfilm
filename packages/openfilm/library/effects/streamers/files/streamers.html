<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Streamers</title>
<style>
  /* what a clip of it may change: how many streamers (0 to 1), how fast they fall */
  :root { --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Party streamers drifting down: curly ribbons that twist as they fall, showing their bright face and their darker
 * back by turns, with a little confetti among them. Each ribbon is a strip along a wavy line whose waves travel and
 * whose twist turns with t, so its shape comes from t alone. A page of OpenFilm's library (CC0).
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const PALETTE = [[255, 77, 109], [255, 209, 102], [6, 214, 160], [76, 201, 240], [155, 93, 229], [241, 91, 181], [255, 140, 66], [250, 250, 255]];
const mix = (c, k) => c.map((v) => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k));
const RIB = 16, BITS = 70;
const ribbons = Array.from({ length: RIB }, (_, i) => {
  const r = (k) => hash(i * 19.3 + k);
  return { x: r(1), y: r(2), depth: r(3), order: r(4), c: PALETTE[Math.floor(r(5) * PALETTE.length)], len: 0.3 + r(6) * 0.3, waves: 2.5 + r(7) * 2.5, amp: 1.5 + r(8) * 2.5, twist: 3 + r(9) * 4, ph: r(10) * 6.28, lean: (r(11) - 0.5) * 0.5, wob: 0.6 + r(12) };
}).sort((a, b) => a.depth - b.depth);
function ribbon(rb, t, w, h, u, speed) {
  const scale = 0.6 + rb.depth * 0.7;
  const L = rb.len * Math.max(h, w * 0.6) * scale, W = 1.3 * u * scale;
  const span = h + L + 10 * u;
  const fall = (0.06 + rb.depth * 0.06) * h * speed;
  const top = ((rb.y * span + t * fall) % span) - L - 5 * u;
  const x0 = rb.x * (w + 10 * u) - 5 * u + Math.sin(t * 0.7 * rb.wob + rb.ph) * 3 * u;
  const n = 46;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n;
    // the curl: waves that travel down the ribbon, larger toward its free end
    const a = s * rb.waves * Math.PI * 2 - t * 3 * rb.wob + rb.ph;
    const x = x0 + Math.sin(a) * rb.amp * u * scale * (0.6 + s * 0.8) + s * L * rb.lean;
    const y = top + s * L + Math.cos(a) * rb.amp * 0.35 * u * scale;
    // the twist: the ribbon's width as seen, and which face is toward us
    const tw = Math.cos(s * rb.twist * Math.PI + t * 2.4 * rb.wob + rb.ph);
    pts.push([x, y, tw]);
  }
  for (let i = 0; i < n; i++) {
    const [x1, y1, t1] = pts[i], [x2, y2, t2] = pts[i + 1];
    const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
    const w1 = W * t1, w2 = W * t2;
    const face = (t1 + t2) / 2;
    const c = face > 0 ? mix(rb.c, 0.15 * face - 0.05) : mix(rb.c, -0.35 + 0.15 * face);
    ctx.fillStyle = `rgb(${c})`;
    ctx.beginPath();
    ctx.moveTo(x1 + nx * w1, y1 + ny * w1); ctx.lineTo(x2 + nx * w2, y2 + ny * w2);
    ctx.lineTo(x2 - nx * w2, y2 - ny * w2); ctx.lineTo(x1 - nx * w1, y1 - ny * w1);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.8; ctx.stroke();   // closes the hairline seams between pieces
    // a soft sheen where the face turns square to the light
    if (face > 0.8) { ctx.fillStyle = `rgba(255,255,255,${(face - 0.8) * 1.6})`; ctx.fill(); }
  }
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1);
    ctx.lineJoin = 'round';
    for (const rb of ribbons) if (rb.order <= amount) ribbon(rb, t, w, h, u, speed);
    // a little confetti falling among them
    for (let i = 0; i < BITS; i++) {
      const r = (k) => hash(i * 7.77 + k + 500);
      if (r(0) > amount) continue;
      const fall = (0.07 + r(1) * 0.07) * h * speed;
      const y = ((r(2) * (h + 8 * u) + t * fall) % (h + 8 * u)) - 4 * u;
      const x = r(3) * w + Math.sin(t * (1.5 + r(4)) + r(5) * 6.28) * 2.5 * u;
      const flip = Math.cos(t * (4 + r(6) * 6) + r(7) * 6.28);
      const c = PALETTE[Math.floor(r(8) * PALETTE.length)];
      ctx.fillStyle = `rgb(${mix(c, flip > 0 ? 0.1 * flip : -0.3)})`;
      ctx.save(); ctx.translate(x, y); ctx.rotate(r(9) * 6.28 + t * (r(10) - 0.5) * 4);
      ctx.scale(1, Math.max(0.1, Math.abs(flip)));
      const s = (0.6 + r(11) * 0.5) * u;
      ctx.fillRect(-s, -s * 0.6, 2 * s, 1.2 * s);
      ctx.restore();
    }
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
