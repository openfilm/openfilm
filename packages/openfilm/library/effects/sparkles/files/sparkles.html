<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sparkles</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #fff6c8; }
i { position: fixed; width: 2.2vw; height: 2.2vw; background: var(--color); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: s 1.8s ease-in-out infinite; opacity: 0; }
@keyframes s { 50% { opacity: 1; transform: scale(1) rotate(45deg); } 0%, 100% { opacity: 0; transform: scale(0.2); } }
</style>
</head>
<body>

<script>
/*
 * Sparkles: small stars that twinkle here and there. A page of OpenFilm's library (CC0): what it shows at t comes
 * from t alone; its CSS animations are held at t by the host.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function scatter(n, make) {
  for (let i = 0; i < n; i++) { const el = document.createElement('i'); make(el, (k) => hash(i * 7.31 + k)); document.body.append(el); }
}
scatter(26, (el, r) => { el.style.left = `${r(1) * 96}%`; el.style.top = `${r(2) * 92}%`; el.style.animationDelay = `${-r(3) * 1.8}s`; const s = 0.5 + r(4); el.style.width = el.style.height = `${s * 2.2}vw`; });
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
