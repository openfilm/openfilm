<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phone frame</title>
<style>
  /* what a clip of it may change: the backdrop's color, the phone's frame color */
  :root { --color: #23252b; --frame: #9a9ca3; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * The picture on a phone's screen: a modern phone with a metal frame, a thin black bezel, round screen corners, the
 * camera pill and a status bar, standing on a soft backdrop with its shadow. On a tall stage the phone stands up; on
 * a wide one it lies on its side. A soft glare crosses the glass now and then. A page of OpenFilm's library (CC0):
 * what it shows at t comes from t alone.
 */
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const shade = (c, k) => c.map((v) => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k));
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, tall = h >= w;
    const bg = rgb('--color', '#23252b'), metal = rgb('--frame', '#9a9ca3');
    // the phone's size: 19.5 by 9, as large as fits with a margin
    const R = 19.5 / 9;
    let long = (tall ? h : w) * 0.9, short = long / R;
    if (short > (tall ? w : h) * 0.86) { short = (tall ? w : h) * 0.86; long = short * R; }
    const bw = tall ? short : long, bh = tall ? long : short;
    const bx = (w - bw) / 2, by = (h - bh) / 2, r = short * 0.165;
    // backdrop: a soft light behind the phone, darker at the edges
    const g = ctx.createRadialGradient(w / 2, h * 0.42, 0, w / 2, h / 2, Math.hypot(w, h) * 0.6);
    g.addColorStop(0, `rgb(${shade(bg, 0.16)})`); g.addColorStop(0.55, `rgb(${bg})`); g.addColorStop(1, `rgb(${shade(bg, -0.45)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // its shadow on the backdrop
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = short * 0.12; ctx.shadowOffsetY = short * 0.04;
    rr(bx, by, bw, bh, r); ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();
    // side buttons
    const btn = (x, y, bw2, bh2) => { rr(x, y, bw2, bh2, Math.min(bw2, bh2) / 2); const bg2 = ctx.createLinearGradient(x, y, x + bw2, y + bh2); bg2.addColorStop(0, `rgb(${shade(metal, -0.3)})`); bg2.addColorStop(0.5, `rgb(${shade(metal, 0.25)})`); bg2.addColorStop(1, `rgb(${shade(metal, -0.4)})`); ctx.fillStyle = bg2; ctx.fill(); };
    const k = short * 0.012;
    if (tall) {
      btn(bx - k, by + bh * 0.16, k * 1.4, bh * 0.045); btn(bx - k, by + bh * 0.24, k * 1.4, bh * 0.08); btn(bx - k, by + bh * 0.34, k * 1.4, bh * 0.08);
      btn(bx + bw - k * 0.4, by + bh * 0.26, k * 1.4, bh * 0.12);
    } else {
      btn(bx + bw * 0.16, by - k, bw * 0.045, k * 1.4); btn(bx + bw * 0.24, by - k, bw * 0.08, k * 1.4); btn(bx + bw * 0.34, by - k, bw * 0.08, k * 1.4);
      btn(bx + bw * 0.62, by + bh - k * 0.4, bw * 0.12, k * 1.4);
    }
    // the metal frame: brushed, lit from the top left
    const m = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
    m.addColorStop(0, `rgb(${shade(metal, 0.45)})`); m.addColorStop(0.3, `rgb(${shade(metal, -0.25)})`); m.addColorStop(0.55, `rgb(${shade(metal, 0.15)})`); m.addColorStop(1, `rgb(${shade(metal, -0.5)})`);
    rr(bx, by, bw, bh, r); ctx.fillStyle = m; ctx.fill();
    const f = short * 0.016;
    rr(bx + f * 0.35, by + f * 0.35, bw - f * 0.7, bh - f * 0.7, r - f * 0.35);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(0.6, f * 0.18); ctx.stroke();
    // the black glass around the screen
    rr(bx + f, by + f, bw - 2 * f, bh - 2 * f, r - f); ctx.fillStyle = '#060607'; ctx.fill();
    // the screen: cut out, so the picture shows
    const b = short * 0.042, sx = bx + b, sy = by + b, sw = bw - 2 * b, sh = bh - 2 * b, sr = r - b;
    ctx.save(); ctx.globalCompositeOperation = 'destination-out'; rr(sx, sy, sw, sh, sr); ctx.fill(); ctx.restore();
    // a dark rim where the glass meets the screen
    ctx.save(); rr(sx, sy, sw, sh, sr); ctx.clip();
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = short * 0.02;
    ctx.lineWidth = short * 0.02; ctx.strokeStyle = '#000'; rr(sx - short * 0.01, sy - short * 0.01, sw + short * 0.02, sh + short * 0.02, sr + short * 0.01); ctx.stroke();
    ctx.shadowBlur = 0;
    // a glare crossing the glass every 6 seconds, and a faint steady sheen
    const sheen = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
    sheen.addColorStop(0, 'rgba(255,255,255,0.07)'); sheen.addColorStop(0.45, 'rgba(255,255,255,0)'); sheen.addColorStop(1, 'rgba(255,255,255,0.03)');
    ctx.fillStyle = sheen; ctx.fillRect(sx, sy, sw, sh);
    const p = ((t + 1.2) % 6) / 1.6;
    if (p < 1) {
      const e = p * p * (3 - 2 * p), D = sw + sh, gx = sx - D * 0.4 + e * D * 1.4;
      const gl = ctx.createLinearGradient(gx - short * 0.3, sy, gx + short * 0.3, sy + short * 0.25);
      gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(0.5, `rgba(255,255,255,${0.16 * Math.sin(p * Math.PI)})`); gl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gl; ctx.fillRect(sx, sy, sw, sh);
    }
    ctx.restore();
    // the camera pill, the status bar and the home bar
    const ink = 'rgba(255,255,255,0.95)';
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = short * 0.02;
    const iw = short * 0.3, ih = short * 0.088;
    if (tall) {
      const ix = sx + sw / 2 - iw / 2, iy = sy + short * 0.03;
      rr(ix, iy, iw, ih, ih / 2); ctx.fillStyle = '#000'; ctx.shadowColor = 'transparent'; ctx.fill();
      const lens = ctx.createRadialGradient(ix + iw - ih * 0.55, iy + ih * 0.42, 0, ix + iw - ih * 0.5, iy + ih / 2, ih * 0.3);
      lens.addColorStop(0, '#3a4a78'); lens.addColorStop(0.6, '#0d1222'); lens.addColorStop(1, '#000');
      ctx.beginPath(); ctx.arc(ix + iw - ih * 0.5, iy + ih / 2, ih * 0.28, 0, Math.PI * 2); ctx.fillStyle = lens; ctx.fill();
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      const fs = short * 0.05, cy = iy + ih / 2;
      ctx.font = `600 ${fs}px -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif`;
      ctx.fillStyle = ink; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.fillText('9:41', sx + sw * 0.17, cy);
      // signal, wifi, battery on the right
      let x = sx + sw * 0.695;
      for (let i = 0; i < 4; i++) { const bh2 = fs * (0.3 + i * 0.17); rr(x + i * fs * 0.23, cy + fs * 0.38 - bh2, fs * 0.16, bh2, fs * 0.04); ctx.fill(); }
      x += fs * 1.25;
      ctx.lineWidth = fs * 0.12; ctx.strokeStyle = ink; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + fs * 0.35, cy + fs * 0.33, fs * (0.16 + i * 0.22), -Math.PI * 0.75, -Math.PI * 0.25); ctx.stroke(); }
      x += fs * 1.1;
      rr(x, cy - fs * 0.27, fs * 1.05, fs * 0.54, fs * 0.15); ctx.lineWidth = fs * 0.07; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
      rr(x + fs * 0.1, cy - fs * 0.17, fs * 0.72, fs * 0.34, fs * 0.08); ctx.fill();
      rr(x + fs * 1.1, cy - fs * 0.1, fs * 0.07, fs * 0.2, fs * 0.03); ctx.fill();
    } else {
      const ix = sx + short * 0.03, iy = sy + sh / 2 - iw / 2;
      rr(ix, iy, ih, iw, ih / 2); ctx.fillStyle = '#000'; ctx.shadowColor = 'transparent'; ctx.fill();
      ctx.beginPath(); ctx.arc(ix + ih / 2, iy + iw - ih * 0.5, ih * 0.28, 0, Math.PI * 2); ctx.fillStyle = '#10162a'; ctx.fill();
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
    }
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const hw = short * 0.36, hh = short * 0.013;
    rr(sx + sw / 2 - hw / 2, sy + sh - short * 0.035, hw, hh, hh / 2); ctx.fill();
    ctx.restore();
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
