<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Prism</title>
<style>
  /* what a clip of it may change: how strong the colors are (0 to 1), how fast they drift */
  :root { --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A prism held in front of the lens: light split into its colors, fanned across the frame from the edges in soft
 * spectral beams, with crisp rainbow slivers where the glass's edges catch it, all drifting as the prism turns. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
// a spectrum, light enough to brighten what it lies on
const SPECTRUM = [[255, 110, 110], [255, 180, 90], [255, 240, 120], [150, 255, 150], [120, 230, 255], [140, 150, 255], [210, 130, 255]];
// a fan of colored wedges from (x, y) toward angle `dir`, spreading `spread` radians, reaching `len`
function fan(x, y, dir, spread, len, a) {
  const n = SPECTRUM.length, step = spread / n;
  SPECTRUM.forEach((c, i) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, len);
    g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(0.15, `rgba(${c},${a})`); g.addColorStop(0.55, `rgba(${c},${a * 0.5})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g;
    const a0 = dir - spread / 2 + i * step;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, len, a0, a0 + step * 1.25); ctx.closePath(); ctx.fill();
  });
}
// a short sharp rainbow line, like the glass's edge on the picture
function sliver(x, y, ang, len, thick, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const g = ctx.createLinearGradient(0, -thick / 2, 0, thick / 2);
  SPECTRUM.forEach((c, i) => g.addColorStop(i / (SPECTRUM.length - 1), `rgba(${c},${a})`));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, len / 2, thick / 2, 0, 0, 6.283); ctx.fill();
  ctx.restore();
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100, diag = Math.hypot(w, h);
    const amount = num('--amount', 1), tt = t * num('--speed', 1);
    ctx.globalCompositeOperation = 'lighter';
    // two fans from outside the frame, turning slowly and breathing
    ctx.filter = `blur(${2.2 * u}px)`;
    const b1 = 0.6 + 0.4 * Math.sin(tt * 0.8), b2 = 0.6 + 0.4 * Math.sin(tt * 0.6 + 2);
    fan(-0.08 * w, h * (0.15 + 0.1 * Math.sin(tt * 0.3)), 0.35 + 0.18 * Math.sin(tt * 0.4), 0.22 + 0.05 * Math.sin(tt * 0.9), 0.9 * diag, 0.4 * b1 * amount);
    fan(1.06 * w, h * (0.85 + 0.08 * Math.sin(tt * 0.35 + 1)), 3.6 + 0.15 * Math.sin(tt * 0.33 + 1), 0.16, 0.7 * diag, 0.32 * b2 * amount);
    // crisp slivers where the edges of the glass catch the light, sliding as it turns
    ctx.filter = `blur(${0.25 * u}px)`;
    for (let i = 0; i < 8; i++) {
      const p = (hash(i + 0.21) + tt * (0.03 + hash(i + 0.41) * 0.04)) % 1;
      const x = w * (0.05 + hash(i + 0.61) * 0.9) + (p - 0.5) * 30 * u, y = h * (0.1 + hash(i + 0.81) * 0.8) - (p - 0.5) * 12 * u;
      const life = Math.pow(Math.sin(Math.PI * p), 2);
      sliver(x, y, -0.5 + hash(i + 0.91) * 0.5, (16 + hash(i + 0.71) * 26) * u, (1.6 + hash(i + 0.51) * 2.2) * u, 0.6 * life * amount);
    }
    // the faint rainbow ring of the glass around the middle, very soft
    ctx.filter = `blur(${1.5 * u}px)`;
    const R = 0.42 * Math.min(w, h) * 1.6, cx = w * (0.55 + 0.05 * Math.sin(tt * 0.2)), cy = h * 0.5;
    SPECTRUM.forEach((c, i) => {
      ctx.strokeStyle = `rgba(${c},${0.12 * amount})`; ctx.lineWidth = 1.2 * u;
      ctx.beginPath(); ctx.arc(cx, cy, R + i * 1.1 * u, -2.6 + tt * 0.05, -0.6 + tt * 0.05); ctx.stroke();
    });
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
