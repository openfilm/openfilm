<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Focus lines</title>
<style>
  /* what a clip of it may change: the lines' color, how many show (0 to 1), how often they are redrawn */
  :root { --color: #ffffff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Comic focus lines: sharp wedges of ink rushing in from every edge toward the middle and stopping short of it, so
 * the eye lands on what is there; redrawn a dozen times a second, each time a little different. A page of
 * OpenFilm's library (CC0): every line comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
const N = 220;
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = num('--amount', 1), speed = num('--speed', 1), c = rgb('--color', '#ffffff');
    const step = Math.floor(t * 12 * Math.max(0.1, speed));
    const cx = w / 2, cy = h / 2, R = Math.hypot(w, h) * 0.6;
    // the clear middle: an oval that breathes a little between drawings
    const rx = w * 0.3 * (1 + (hash(step * 1.7) - 0.5) * 0.05), ry = h * 0.3 * (1 + (hash(step * 2.3) - 0.5) * 0.05);
    // a soft rim of the color behind the lines, so they read on bright pictures too
    const rim = ctx.createRadialGradient(cx, cy, Math.min(rx, ry), cx, cy, R);
    rim.addColorStop(0, `rgba(${c},0)`); rim.addColorStop(1, `rgba(${c},0.28)`);
    ctx.fillStyle = rim; ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 0.6 * u;
    ctx.fillStyle = `rgb(${c})`;
    ctx.beginPath();
    const n = Math.round(N * Math.max(0, Math.min(1, amount)));
    for (let i = 0; i < n; i++) {
      const r = (k) => hash(i * 7.13 + step * 31.7 + k);
      const a = ((i + r(1) * 0.9) / n) * Math.PI * 2;
      const reach = 1.02 + Math.pow(r(2), 1.6) * 0.55;      // how close to the middle the tip gets
      const half = (0.05 + Math.pow(r(3), 2.4) * 0.42) * u / R * 9;  // half the wedge's width at the edge, in radians
      const tx = cx + Math.cos(a) * rx * reach, ty = cy + Math.sin(a) * ry * reach;
      ctx.moveTo(tx, ty);
      ctx.lineTo(cx + Math.cos(a - half) * R, cy + Math.sin(a - half) * R);
      ctx.lineTo(cx + Math.cos(a + half) * R, cy + Math.sin(a + half) * R);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
