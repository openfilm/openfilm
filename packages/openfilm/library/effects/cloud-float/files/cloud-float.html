<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dreamy clouds</title>
<style>
  /* what a clip of it may change: the clouds' tint, how fast they drift */
  :root { --color: #ffd3ea; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Dreamy clouds: soft, round, candy-tinted clouds drifting along the bottom of the picture in two layers, the far
 * ones slower, one tucked into each top corner, a light haze where they meet the edge and a few twinkles. A page of
 * OpenFilm's library (CC0): every cloud's place comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
// a cloud drawn once for each tint: one soft silhouette of puffs, white on top, shading to lilac below, each puff
// catching a little light on its upper side, the whole blurred soft. A long cloud has a flat underside; a round
// one (for the corners) is a cluster
const clouds = new Map();
function cloud(c, seed, round) {
  const key = c.join() + '/' + seed + '/' + round;
  if (clouds.has(key)) return clouds.get(key);
  const W = 640, H = 340;
  const shape = document.createElement('canvas'); shape.width = W; shape.height = H;
  const x = shape.getContext('2d');
  const shade = c.map((v, i) => Math.round(v * 0.6 + [190, 178, 232][i] * 0.4));
  const puffs = [];
  if (round) {
    puffs.push([W / 2, H / 2, H * 0.3]);
    for (let i = 0; i < 9; i++) {
      const r = (k) => hash(seed * 31.7 + i * 5.3 + k), a = (i / 9) * 6.283;
      puffs.push([W / 2 + Math.cos(a) * H * 0.42, H / 2 + Math.sin(a) * H * 0.26, H * (0.15 + r(1) * 0.08)]);
    }
  } else {
    const n = 8;
    for (let i = 0; i < n; i++) {
      const r = (k) => hash(seed * 31.7 + i * 5.3 + k);
      const f = i / (n - 1), dome = Math.sin(Math.PI * (0.06 + f * 0.88));
      const rad = W * (0.06 + dome * 0.1 + r(2) * 0.035);
      puffs.push([W * (0.15 + f * 0.7 + (r(1) - 0.5) * 0.04), H * 0.8 - dome * H * (0.2 + r(3) * 0.1), rad]);
    }
    // a row of small puffs keeps the underside flat
    for (let i = 0; i < 9; i++) puffs.push([W * (0.14 + (i / 8) * 0.72), H * 0.82, W * 0.05]);
  }
  x.fillStyle = `rgb(${c})`;
  for (const [px, py, rad] of puffs) { x.beginPath(); x.arc(px, py, rad, 0, 6.283); x.fill(); }
  x.globalCompositeOperation = 'source-atop';
  const top = Math.min(...puffs.map(([, py, rad]) => py - rad)), bottom = Math.max(...puffs.map(([, py, rad]) => py + rad));
  const g = x.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, 'rgb(255,255,255)'); g.addColorStop(0.5, `rgb(${c})`); g.addColorStop(1, `rgb(${shade})`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (const [px, py, rad] of puffs) {
    const l = x.createRadialGradient(px - rad * 0.25, py - rad * 0.4, 0, px - rad * 0.25, py - rad * 0.4, rad * 0.85);
    l.addColorStop(0, 'rgba(255,255,255,0.55)'); l.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = l; x.fillRect(0, 0, W, H);
  }
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.filter = 'blur(9px)';
  o.drawImage(shape, 0, 0);
  clouds.set(key, out);
  return out;
}
const BACK = 6, FRONT = 5;
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const tt = t * num('--speed', 1), c = rgb('--color', '#ffd3ea');
    // a haze rising from the bottom edge
    const haze = ctx.createLinearGradient(0, h, 0, h * 0.6);
    haze.addColorStop(0, `rgba(${c.map((v) => Math.round(v + (255 - v) * 0.5))},0.55)`); haze.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = haze; ctx.fillRect(0, 0, w, h);
    const layers = [[BACK, 0.34, 0.012, 0.75, h * 0.97, 1], [FRONT, 0.48, 0.022, 0.95, h * 1.06, 2]];
    for (const [count, scale, v, alpha, floor, layer] of layers) {
      for (let i = 0; i < count; i++) {
        const r = (k) => hash(layer * 101 + i * 7.7 + k);
        const cw = Math.max(w, h * 0.9) * scale * (0.8 + r(1) * 0.4), ch = cw * 340 / 640;
        const span = w + cw;
        const x = (((i + r(2) * 0.6) / count + tt * v) % 1) * span - cw;
        const y = floor - ch * (0.84 + r(3) * 0.08) + Math.sin(tt * 0.8 + r(4) * 6) * 0.8 * u;
        ctx.globalAlpha = alpha;
        ctx.drawImage(cloud(c, Math.floor(r(5) * 4), false), x, y, cw, ch);
      }
    }
    // one in each top corner, leaning in and out
    for (const side of [0, 1]) {
      const cw = Math.max(w, h * 0.9) * 0.36, ch = cw * 340 / 640;
      const sway = Math.sin(tt * 0.5 + side * 2) * 1.5 * u;
      const x = side ? w - cw * 0.62 + sway : -cw * 0.38 + sway, y = -ch * 0.42 + Math.sin(tt * 0.7 + side) * 0.6 * u;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(cloud(c, 4 + side, true), x, y, cw, ch);
    }
    // a few twinkles above the clouds
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 14; i++) {
      const r = (k) => hash(i * 13.1 + k);
      const tw = Math.pow(Math.max(0, Math.sin(t * (1.5 + r(1) * 2) + r(2) * 6.283)), 6);
      if (tw < 0.02) continue;
      const x = r(3) * w, y = h * (0.55 + r(4) * 0.3) + (r(4) < 0.3 ? -h * 0.45 : 0), L = (2 + r(5) * 2.5) * u * tw;
      ctx.globalAlpha = tw;
      ctx.beginPath();
      ctx.moveTo(x - L, y); ctx.quadraticCurveTo(x, y, x, y - L); ctx.quadraticCurveTo(x, y, x + L, y);
      ctx.quadraticCurveTo(x, y, x, y + L); ctx.quadraticCurveTo(x, y, x - L, y);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
