<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Story bars</title>
<style>
  /* what a clip of it may change: how long one bar takes to fill (seconds), how many bars; the name is its text */
  :root { --speed: 4; --amount: 5; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .shade { position: fixed; left: 0; right: 0; pointer-events: none; }
  .top { top: 0; height: 24vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.18) 55%, transparent); }
  .bottom { bottom: 0; height: 20vh; background: linear-gradient(transparent, rgba(0,0,0,0.45)); }
  .bars { position: fixed; top: 2.08vmin; left: 2.08vmin; right: 2.08vmin; display: flex; gap: 0.78vmin; }
  .bar { flex: 1; height: 0.72vmin; min-height: 2px; border-radius: 1.3vmin; background: rgba(255,255,255,0.35); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: inherit; box-shadow: 0 0 0.78vmin rgba(255,255,255,0.6); }
  .head { position: fixed; top: 4.68vmin; left: 2.86vmin; right: 2.86vmin; display: flex; align-items: center; gap: 2.08vmin; text-shadow: 0 0.2vmin 0.78vmin rgba(0,0,0,0.35); }
  .avatar { width: 7.8vmin; height: 7.8vmin; border-radius: 50%; padding: 0.52vmin; box-sizing: border-box;
    background: conic-gradient(from 210deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5, #feda75); }
  .avatar b { display: block; width: 100%; height: 100%; border-radius: 50%; border: 0.45vmin solid #111; box-sizing: border-box;
    background: radial-gradient(circle at 30% 30%, #ffd6a5, transparent 55%), radial-gradient(circle at 75% 70%, #9bf6ff, transparent 55%), linear-gradient(135deg, #bdb2ff, #ffc6ff); }
  .name { font-weight: 650; font-size: 3.51vmin; }
  .time { font-size: 3.25vmin; opacity: 0.7; }
  .grow { flex: 1; }
  .icon { width: 4.68vmin; height: 4.68vmin; }
  .foot { position: fixed; bottom: 3.38vmin; left: 2.86vmin; right: 2.86vmin; display: flex; align-items: center; gap: 2.86vmin; }
  .input { flex: 1; height: 8.06vmin; border-radius: 5.2vmin; border: 0.39vmin solid rgba(255,255,255,0.75); box-sizing: border-box; display: flex; align-items: center; padding: 0 3.12vmin; font-size: 3.38vmin; color: rgba(255,255,255,0.9); }
  .heart { transform-origin: 50% 60%; }
</style>
</head>
<body>
<div class="shade top"></div><div class="shade bottom"></div>
<div class="bars"></div>
<div class="head">
  <div class="avatar"><b></b></div><span class="name">openfilm</span><span class="time">2h</span><span class="grow"></span>
  <svg class="icon" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</div>
<div class="foot">
  <div class="input">Send message</div>
  <svg class="icon heart" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5S3.5 15.2 3.5 9.2A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.6c0 6-8.5 11.3-8.5 11.3z"/></svg>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M21.5 3.5L10.2 13.8M21.5 3.5l-6.8 17-4.5-6.7-6.7-4.5z"/></svg>
</div>
<script>
/*
 * The bars of a social story along the top: one bar fills in each few seconds, then the next, and when the last is
 * full they start over; an avatar ring (an abstract gradient), a name, the close and more buttons, and the message
 * field below, over soft shades that keep them legible. A page of OpenFilm's library (CC0): what it shows at t comes
 * from t alone.
 */
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const bars = document.querySelector('.bars'), heart = document.querySelector('.heart');
let fills = [];
window.film = {
  frame(t) {
    const n = Math.max(1, Math.min(12, Math.round(num('--amount', 5)))), each = Math.max(0.5, num('--speed', 4));
    if (fills.length !== n) {
      bars.textContent = '';
      fills = Array.from({ length: n }, () => { const b = document.createElement('div'); b.className = 'bar'; const i = document.createElement('i'); b.append(i); bars.append(b); return i; });
    }
    const k = Math.floor(t / each) % n, p = (t % each) / each;
    fills.forEach((el, i) => { el.style.width = `${i < k ? 100 : i === k ? p * 100 : 0}%`; });
    // the heart gives a small beat as each bar fills up
    const beat = Math.exp(-((t % each) / each) * 12);
    heart.style.transform = `scale(${1 + 0.12 * beat})`;
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
