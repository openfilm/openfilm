<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Embers</title>
<style>
  /* what a clip of it may change: the fire's color, how many sparks rise (0 to 1), how fast */
  :root { --color: #ff7a1a; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Embers rising from a fire below the frame: sparks born white-hot that cool to orange and red as they climb,
 * whirled about by the heat, streaking as they go, over a glow that flickers along the bottom. A page of OpenFilm's
 * library (CC0): every spark's flight is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
// a soft round glow, drawn once for each color: a hot white core fading out through the color
const sprites = new Map();
function sprite(c) {
  const key = c.join();
  if (sprites.has(key)) return sprites.get(key);
  const g = document.createElement('canvas'); g.width = g.height = 128;
  const x = g.getContext('2d'), r = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  const hot = c.map((v) => Math.round(v + (255 - v) * 0.7));
  r.addColorStop(0, `rgba(${hot},1)`); r.addColorStop(0.18, `rgba(${c},0.85)`); r.addColorStop(0.45, `rgba(${c},0.22)`); r.addColorStop(1, `rgba(${c},0)`);
  x.fillStyle = r; x.fillRect(0, 0, 128, 128);
  sprites.set(key, g);
  return g;
}
const N = 190;
const sparks = Array.from({ length: N }, (_, i) => {
  const r = (k) => hash(i * 5.27 + k);
  const depth = Math.pow(r(1), 1.5);
  return { i, depth, order: r(2), life: 2.4 + r(3) * 3.2, offset: r(4), rise: 0.15 + depth * 0.2 + r(5) * 0.1, swirl: 0.02 + r(6) * 0.04, sf: 1 + r(7) * 1.8, flick: 8 + r(8) * 14 };
});
// a spark's color as it cools: white-hot, yellow, the fire's color, then a dull red
function heat(base, a) {
  const stops = [[255, 236, 180], [255, 180, 70], base, [170, 40, 20]];
  const f = Math.min(0.999, a) * 3, k = Math.floor(f), m = f - k;
  return stops[k].map((v, j) => Math.round(v + (stops[k + 1][j] - v) * m));
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = num('--amount', 1), speed = num('--speed', 1), base = rgb('--color', '#ff7a1a');
    const tt = t * speed;
    // the glow of the fire along the bottom, flickering
    const flick = 0.75 + 0.12 * Math.sin(t * 7.3) + 0.08 * Math.sin(t * 13.1 + 1) + 0.05 * Math.sin(t * 23.7 + 2);
    const glow = ctx.createLinearGradient(0, h, 0, h * 0.45);
    glow.addColorStop(0, `rgba(${base},${0.42 * flick * amount})`); glow.addColorStop(0.35, `rgba(${base},${0.12 * flick * amount})`); glow.addColorStop(1, `rgba(${base},0)`);
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    // where a spark is at age a (seconds) of one flight
    const at = (s, k, a) => {
      const r = (j) => hash(s.i * 19.7 + k * 11.3 + j);
      const lift = s.rise * (a - 0.03 * a * a);
      const x = r(1) * 1.2 - 0.1 + s.swirl * (Math.sin(a * s.sf + r(2) * 6.283) + 0.4 * Math.sin(a * s.sf * 2.3 + r(3) * 6.283)) * (0.3 + 0.6 * a) + (r(4) - 0.35) * 0.025 * a;
      return [x * w, h * 1.03 - lift * Math.min(w, h) * 1.3];
    };
    for (const s of sparks) {
      if (s.order > amount) continue;
      const cyc = tt / s.life + s.offset, k = Math.floor(cyc), p = cyc - k, a = p * s.life;
      const [x, y] = at(s, k, a), [px, py] = at(s, k, Math.max(0, a - 0.05));
      const c = heat(base, p * 0.9 + s.depth * 0.1);
      const life = Math.min(1, p * 8) * Math.pow(1 - p, 1.2) * (0.6 + 0.4 * Math.sin(t * s.flick + s.i));
      const size = (0.35 + s.depth * 1.1) * u;
      ctx.globalAlpha = life;
      ctx.strokeStyle = `rgb(${c})`; ctx.lineWidth = size;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      const d = size * (s.depth > 0.85 ? 12 : 9);
      ctx.globalAlpha = life * (s.depth > 0.85 ? 0.45 : 0.85);
      ctx.drawImage(sprite(c), x - d / 2, y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
