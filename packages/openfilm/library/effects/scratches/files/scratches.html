<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Old film</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { animation: f 0.12s steps(1) infinite; }
.s { position: fixed; top: 0; bottom: 0; width: 1.5px; background: rgba(255, 255, 255, 0.55); animation: j 0.36s steps(1) infinite; }
.s.d { background: rgba(0, 0, 0, 0.6); animation-duration: 0.5s; }
@keyframes j { 0% { transform: translateX(0); opacity: 1; } 33% { transform: translateX(9vw); opacity: 0.4; } 66% { transform: translateX(-4vw); opacity: 0.9; } }
@keyframes f { 0% { background: rgba(255, 240, 210, 0.05); } 50% { background: rgba(0, 0, 0, 0.06); } }
</style>
</head>
<body>
<div class="l"></div><div class="s" style="left:22%"></div><div class="s d" style="left:63%"></div><div class="s" style="left:81%;animation-delay:-.2s"></div>
<script>
/*
 * Old film: thin scratches jumping across the picture and a faint flicker. A page of OpenFilm's library (CC0):
 * what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
