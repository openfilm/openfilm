<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flash</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ffffff; }
.l { background: var(--color); animation: f 0.6s ease-out both; }
@keyframes f { from { opacity: 0.95; } to { opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A white flash at its start, fading out: put it on a beat. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
