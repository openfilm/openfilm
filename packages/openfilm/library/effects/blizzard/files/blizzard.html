<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blizzard</title>
<style>
  /* what a clip of it may change: the snow's color, how heavy it is (0 to 1), how hard the wind blows */
  :root { --color: #ffffff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A blizzard: snow driven sideways by a gusting wind, the near flakes streaking past the lens, sheets of blown snow
 * sweeping through and the light going white as each gust hits. A page of OpenFilm's library (CC0): the wind's push
 * is integrated exactly, so every flake's place comes from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
// seamless fractal noise turned into soft sheets of blown snow
function sheetOf(size, cells, seed, lo, hi) {
  const lat = (o, n) => { const a = new Float32Array(n * n); for (let k = 0; k < n * n; k++) a[k] = hash(seed + o * 101.3 + (k % n) * 7.13 + Math.floor(k / n) * 157.9); return a; };
  const out = new Float32Array(size * size);
  let amp = 1, total = 0;
  for (let o = 0; o < 5; o++) {
    const n = cells << o, step = size / n, L = lat(o, n);
    for (let y = 0; y < size; y++) {
      const fy = y / step, j = Math.floor(fy), ty = fy - j, sy = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < size; x++) {
        const fx = x / step, i = Math.floor(fx), tx = fx - i, sx = tx * tx * (3 - 2 * tx);
        const a = L[(j % n) * n + i % n], b = L[(j % n) * n + (i + 1) % n], c = L[((j + 1) % n) * n + i % n], d = L[((j + 1) % n) * n + (i + 1) % n];
        out[y * size + x] += amp * (a + (b - a) * sx + (c - a + (a - b + d - c) * sx) * sy);
      }
    }
    total += amp; amp *= 0.5;
  }
  const g = document.createElement('canvas'); g.width = g.height = size;
  const x = g.getContext('2d'), img = x.createImageData(size, size);
  for (let k = 0; k < out.length; k++) {
    const v = Math.min(1, Math.max(0, (out[k] / total - lo) / (hi - lo)));
    img.data[k * 4] = img.data[k * 4 + 1] = img.data[k * 4 + 2] = 255; img.data[k * 4 + 3] = Math.round(255 * v * v);
  }
  x.putImageData(img, 0, 0);
  return g;
}
const SHEET = sheetOf(256, 2, 3.3, 0.36, 0.72);
// a soft flake, stretched along its motion when drawn
const FLAKE = (() => { const g = document.createElement('canvas'); g.width = g.height = 64; const x = g.getContext('2d'), r = x.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.8)'); r.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = r; x.fillRect(0, 0, 64, 64); return g; })();
// the wind: its strength now, and how far it has pushed things since 0
const gust = (t) => 1 + 0.6 * Math.sin(0.9 * t) + 0.35 * Math.sin(2.3 * t + 1.3);
const pushed = (t) => t + 0.6 * (1 - Math.cos(0.9 * t)) / 0.9 + 0.35 * (Math.cos(1.3) - Math.cos(2.3 * t + 1.3)) / 2.3;
const N = 900;
const flakes = Array.from({ length: N }, (_, i) => {
  const r = (k) => hash(i * 2.83 + k);
  const depth = Math.pow(r(1), 2);
  return { x: r(2), y: r(3), depth, order: r(4), drift: 0.35 + depth * 0.9 + r(5) * 0.2, fall: 0.18 + depth * 0.5 + r(6) * 0.1, wob: r(7) * 6.283 };
});
const wrap = (v) => ((v % 1.2) + 1.2) % 1.2 - 0.1;
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = num('--amount', 1), speed = num('--speed', 1), c = rgb('--color', '#ffffff');
    const tt = t * speed, G = gust(tt), D = pushed(tt);
    // the light goes white as a gust hits
    ctx.fillStyle = `rgba(${c},${(0.06 + 0.07 * Math.max(0, G - 1)) * amount})`; ctx.fillRect(0, 0, w, h);
    // blown sheets: two layers of soft snow sweeping across
    const m = Math.max(w, h) / 256;
    for (const [scale, rate, alpha, oy] of [[2.2, 0.3, 0.42, 0], [1.3, 0.55, 0.3, 90]]) {
      const p = ctx.createPattern(SHEET, 'repeat');
      p.setTransform(new DOMMatrix().translate(D * rate * w, tt * 30 + oy).scale(m * scale, m * scale * 0.6));
      ctx.globalAlpha = alpha * amount;
      ctx.fillStyle = p; ctx.fillRect(0, 0, w, h);
    }
    // the flakes, each drawn as a short streak along its motion
    ctx.globalAlpha = 1;
        for (const f of flakes) {
      if (f.order > amount) continue;
      const x = wrap(f.x + f.drift * 0.3 * D + 0.01 * Math.sin(tt * 3 + f.wob)) * w;
      const y = wrap(f.y + f.fall * tt + 0.012 * Math.sin(tt * 2.2 + f.wob)) * h;
      const vx = f.drift * 0.3 * G * w, vy = f.fall * h;
      const blur = 0.006 + f.depth * 0.022;           // seconds of motion the streak shows
      const size = (0.2 + f.depth * f.depth * 1.4) * u;
      ctx.globalAlpha = (0.35 + 0.6 * f.depth) * (f.depth > 0.8 ? 0.5 : 1) * (0.7 + 0.3 * Math.sin(tt * 5 + f.wob * 3));
      const len = Math.hypot(vx, vy) * blur, d = devicePixelRatio || 1;
      const big = f.depth > 0.8 ? 2.6 : 1.6;
      ctx.setTransform(d, 0, 0, d, 0, 0); ctx.translate(x, y); ctx.rotate(Math.atan2(vy, vx));
      ctx.drawImage(FLAKE, -len - size * big / 2, -size * big / 2, len + size * big, size * big);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
