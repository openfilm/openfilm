<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Heartbeat</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ff3a5c; }
.l { box-shadow: inset 0 0 18vw 2vw var(--color); animation: h 0.9s ease-out infinite; }
@keyframes h { 0% { opacity: 0.9; } 15% { opacity: 0.2; } 30% { opacity: 0.8; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * The edges pulse red twice a second, like a heartbeat. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
