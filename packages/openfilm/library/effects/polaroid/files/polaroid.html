<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instant photo</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #f4f1ea; }
.l { border: 4vw solid var(--color); border-bottom-width: 11vw; box-shadow: inset 0 0 2vw rgba(0, 0, 0, 0.25); }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * An instant photo's white border, wider at the bottom. A page of OpenFilm's library (CC0): what it shows at t
 * comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
