<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Buy now button</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ff6a00; --accent2: #ff2d55; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font); color: var(--color); }
.b { position: relative; display: flex; align-items: center; gap: 7vh; padding: 11vh 12vh 11vh 10vh; border-radius: 60vh; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 3vh 7vh rgba(0, 0, 0, 0.35), inset 0 -2vh 0 rgba(0, 0, 0, 0.12), inset 0 2vh 0 rgba(255, 255, 255, 0.18); overflow: hidden; animation: pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both, press 0.35s 1.1s ease-out both, breathe 1.6s 1.6s ease-in-out infinite; }
.b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.5) 50%, transparent 62%); background-size: 300% 100%; animation: shine 2.2s 0.7s ease-in-out infinite; }
.b svg.cart { width: 40vh; height: 40vh; flex: none; }
.cart path, .cart circle { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.t1 { font-size: 31vh; font-weight: 800; letter-spacing: 0.03em; white-space: pre; }
.ch { display: flex; margin-left: 2vh; }
.ch i { width: 10vh; height: 10vh; border: solid currentColor; border-width: 3vh 3vh 0 0; transform: rotate(45deg); margin-left: -1vh; animation: ch 1s ease-in-out infinite; }
.ch i:nth-child(2) { animation-delay: 0.15s; } .ch i:nth-child(3) { animation-delay: 0.3s; }
.hold { position: relative; }
.rip { position: absolute; left: 50%; top: 60%; width: 60vh; height: 60vh; margin: -30vh; border-radius: 50%; background: rgba(255, 255, 255, 0.45); animation: rip 0.6s 1.12s ease-out both; }
.cur { position: absolute; left: 52%; top: 58%; width: 30vh; height: 45vh; z-index: 2; filter: drop-shadow(0 1vh 1.6vh rgba(0, 0, 0, 0.5)); animation: move 0.6s 0.5s cubic-bezier(0.3, 0.7, 0.3, 1) both, click 0.3s 1.06s ease-in-out both, away 0.6s 1.8s ease-in both; }
.cur path { fill: #fff; stroke: #111; stroke-width: 1; stroke-linejoin: round; }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes press { 40% { transform: scale(0.92); } }
@keyframes breathe { 50% { transform: scale(1.04); } }
@keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -20% 0; } }
@keyframes ch { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@keyframes rip { from { transform: scale(0); opacity: 1; } to { transform: scale(4); opacity: 0; } }
@keyframes move { from { opacity: 0; transform: translate(60vh, 60vh); } }
@keyframes click { 50% { scale: 0.8; } }
@keyframes away { to { opacity: 0; transform: translate(40vh, 50vh); } }
</style>
</head>
<body>
<div class="w"><div class="hold"><div class="b">
  <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.6-1.2l1.6-6.8H6.6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
  <span class="t1">BUY NOW</span><span class="ch"><i></i><i></i><i></i></span>
  <i class="rip"></i>
</div><svg class="cur" viewBox="0 0 14 21"><path d="M1 1 L1 17 L5 13.4 L8 20 L10.6 18.9 L7.7 12.4 L13 12.4 Z"/></svg></div></div>
<script>
/*
 * A glossy buy button with a cart and moving arrows, a shine across it, clicked by a pointer. A page of OpenFilm's
 * library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
