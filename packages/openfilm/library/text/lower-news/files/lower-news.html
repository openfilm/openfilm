<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Name card, news</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #d7262e; --color: #ffffff; --ink: #14161c; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; padding-left: 4vh; font-family: var(--font); }
.in { display: flex; align-items: stretch; }
.sq { display: flex; align-items: center; justify-content: center; background: var(--ink); color: #fff; padding: 0 3.4vh; font-size: 10vh; font-weight: 800; letter-spacing: 0.08em; writing-mode: vertical-rl; transform: rotate(180deg); animation: sq 0.4s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.st { display: flex; flex-direction: column; align-items: flex-start; }
.a, .b { clip-path: inset(0 100% 0 0); white-space: pre; }
.a { background: var(--accent); color: var(--color); font-size: 25vh; font-weight: 800; line-height: 1; padding: 3.6vh 7vh 3.8vh 5vh; animation: wipe 0.5s 0.2s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
.b { background: #fff; color: var(--ink); font-size: 12vh; font-weight: 600; padding: 2.4vh 7vh 2.4vh 5vh; animation: wipe 0.5s 0.38s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
.a span, .b span { display: inline-block; animation: slide 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
.b span { animation-delay: 0.55s; }
@keyframes wipe { to { clip-path: inset(0 0 0 0); } }
@keyframes slide { from { opacity: 0; transform: translateX(-6vh); } }
@keyframes sq { from { transform: rotate(180deg) scaleX(0); } }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="w">
  <div class="in"><div class="sq t3">LIVE</div>
  <div class="st"><div class="a"><span class="t1">Dr. Amara Okafor</span></div><div class="b"><span class="t2">Climate scientist, Nairobi</span></div></div></div>
</div>
<script>
/*
 * A news name strap: a tag square, a bar of color with the name and a white bar with the role, wiped in from the
 * left. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t
 * by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
