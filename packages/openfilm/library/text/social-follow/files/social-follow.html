<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Follow pill</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ff2d55; --glass: rgba(18, 18, 24, 0.72); --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font); color: var(--color); }
.p { display: flex; align-items: center; gap: 6vh; background: var(--glass); border: 0.8vh solid rgba(255, 255, 255, 0.16); border-radius: 60vh; padding: 9vh 9vh 9vh 9vh; box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.35); animation: grow 0.7s cubic-bezier(0.3, 1.3, 0.5, 1) both; }
.av { width: 64vh; height: 64vh; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30vh; font-weight: 800; background: linear-gradient(135deg, #ffb347, #ff2d55 55%, #7a5cff); animation: spin 0.7s 0.15s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.tx { display: flex; flex-direction: column; gap: 1vh; animation: side 0.5s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t1 { font-size: 24vh; font-weight: 800; line-height: 1.05; white-space: pre; }
.t2 { font-size: 14vh; font-weight: 500; opacity: 0.6; white-space: pre; }
.bt { display: grid; margin-left: 4vh; animation: pop 0.5s 0.45s cubic-bezier(0.3, 1.7, 0.5, 1) both, press 0.4s 1.2s ease-out both; }
.bt span { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 3vh; border-radius: 30vh; padding: 8vh 10vh; font-size: 17vh; font-weight: 800; white-space: pre; }
.t4 { background: var(--accent); animation: gone 0.01s 1.3s forwards; }
.t5 { background: rgba(255, 255, 255, 0.16); animation: swap 0.01s 1.3s both; }
@keyframes grow { from { opacity: 0; transform: scaleX(0.3) scaleY(0.6); } }
@keyframes spin { from { transform: rotate(-180deg) scale(0); } }
@keyframes side { from { opacity: 0; transform: translateX(-6vh); } }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes press { 40% { transform: scale(0.88); } }
@keyframes swap { from { opacity: 0; } }
@keyframes gone { to { opacity: 0; } }
</style>
</head>
<body>
<div class="w"><div class="p">
  <div class="av t3">R</div>
  <div class="tx"><span class="t1">@river.films</span><span class="t2">128K followers</span></div>
  <div class="bt"><span class="t4">+ Follow</span><span class="t5">Following</span></div>
</div></div>
<script>
/*
 * A glassy pill with a round initial badge, a handle and a count, and a follow button that turns to following. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
