<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Timeline</title>
<style>
:root { --font: 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ffb020; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; color: var(--color); text-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.5); }
.tl { position: relative; width: 330vh; height: 90vh; display: flex; }
.tl::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.4vh; margin-top: -0.7vh; border-radius: 1vh; background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.7) 20%, rgba(255, 255, 255, 0.7) 80%, rgba(255, 255, 255, 0.15)); transform-origin: left; animation: draw 1.2s cubic-bezier(0.5, 0, 0.3, 1) both; }
.p { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.p b { width: 9vh; height: 9vh; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.4vh rgba(0, 0, 0, 0.3); animation: pop 0.45s cubic-bezier(0.3, 1.9, 0.5, 1) both; animation-delay: inherit; }
.p span { position: absolute; left: 50%; white-space: pre; transform: translateX(-50%); }
.p span:first-child { bottom: 62%; font: 800 21vh/1 var(--font); color: var(--accent); animation: up 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: inherit; }
.p span:last-child { top: 63%; font-size: 11.5vh; font-weight: 600; animation: dn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: inherit; }
.p:nth-child(1) { animation-delay: 0.15s; } .p:nth-child(2) { animation-delay: 0.45s; } .p:nth-child(3) { animation-delay: 0.75s; } .p:nth-child(4) { animation-delay: 1.05s; }
.p:nth-child(4) b { animation: pop 0.45s 1.05s cubic-bezier(0.3, 1.9, 0.5, 1) both, ring 1.6s 1.6s ease-out infinite; }
@keyframes draw { from { transform: scaleX(0); } }
@keyframes pop { from { transform: scale(0); } }
@keyframes up { from { opacity: 0; transform: translate(-50%, 4vh); } }
@keyframes dn { from { opacity: 0; transform: translate(-50%, -4vh); } }
@keyframes ring { 0% { box-shadow: 0 0 0 2.4vh rgba(0, 0, 0, 0.3), 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 2.4vh rgba(0, 0, 0, 0.3), 0 0 0 7vh transparent; } }
</style>
</head>
<body>
<div class="w"><div class="tl">
  <div class="p"><span class="y1">2019</span><b></b><span class="e1">First shop</span></div>
  <div class="p"><span class="y2">2021</span><b></b><span class="e2">Ten cities</span></div>
  <div class="p"><span class="y3">2023</span><b></b><span class="e3">Own farm</span></div>
  <div class="p"><span class="y4">2026</span><b></b><span class="e4">Worldwide</span></div>
</div></div>
<script>
/*
 * A line drawn from left to right; four points pop as it reaches them, each with a year above and a few words under
 * it. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t
 * by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
