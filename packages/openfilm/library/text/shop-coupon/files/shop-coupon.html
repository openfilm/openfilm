<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Coupon</title>
<style>
:root { --font: 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ff4d4f; --paper: #fff7ec; --ink: #2a1a14; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; }
.tk { position: relative; width: 236vh; height: 82vh; display: flex; filter: drop-shadow(0 2.4vh 4vh rgba(0, 0, 0, 0.35)); animation: in 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) both, sway 3.2s 1.2s ease-in-out infinite; }
.tk .b { position: absolute; inset: 0; display: flex; border-radius: 4vh; overflow: hidden;
  -webkit-mask: radial-gradient(circle at 36% 0, transparent 6vh, #000 6.3vh) top / 100% 51% no-repeat, radial-gradient(circle at 36% 100%, transparent 6vh, #000 6.3vh) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle at 36% 0, transparent 6vh, #000 6.3vh) top / 100% 51% no-repeat, radial-gradient(circle at 36% 100%, transparent 6vh, #000 6.3vh) bottom / 100% 51% no-repeat; }
.l { width: 36%; background: var(--accent); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.l::after { content: ""; position: absolute; right: 0; top: 9vh; bottom: 9vh; border-right: 0.8vh dashed rgba(255, 255, 255, 0.7); }
.r { flex: 1; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; justify-content: center; padding: 0 9vh 0 10vh; position: relative; overflow: hidden; }
.r::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.75) 50%, transparent 65%); background-size: 300% 100%; animation: shine 3s 1s ease-in-out infinite; }
.t1 { font: 800 30vh/1 var(--font); white-space: pre; animation: pop 0.5s 0.4s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
.t2 { font-size: 10vh; font-weight: 800; letter-spacing: 0.3em; padding-left: 0.3em; white-space: pre; animation: pop 0.5s 0.5s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
.t3 { font-size: 17vh; font-weight: 800; letter-spacing: 0.04em; white-space: pre; animation: side 0.5s 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t4 { font-size: 8.4vh; font-weight: 500; opacity: 0.65; margin-top: 1.4vh; white-space: pre; animation: side 0.5s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t5 { align-self: flex-start; margin-top: 4vh; font: 700 9vh/1 'SF Mono', Menlo, Consolas, ui-monospace, 'PingFang SC', 'Microsoft YaHei', monospace; letter-spacing: 0.16em; color: var(--accent); border: 0.7vh dashed var(--accent); border-radius: 2vh; padding: 2vh 3.4vh; white-space: pre; animation: side 0.5s 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes in { from { opacity: 0; transform: translateY(18vh) rotate(-8deg) scale(0.7); } }
@keyframes sway { 50% { transform: rotate(-1.2deg) translateY(-1.4vh); } }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes side { from { opacity: 0; transform: translateX(5vh); } }
@keyframes shine { 0% { background-position: 120% 0; } 50%, 100% { background-position: -20% 0; } }
</style>
</head>
<body>
<div class="w"><div class="tk"><div class="b">
  <div class="l"><span class="t1">$10</span><span class="t2">OFF</span></div>
  <div class="r"><span class="t3">COUPON</span><span class="t4">On orders over $50</span><span class="t5">SAVE10</span></div>
</div></div></div>
<script>
/*
 * A coupon ticket with notches and a dashed tear line: a value on its color side, a title, a condition and a code.
 * A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by
 * the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
