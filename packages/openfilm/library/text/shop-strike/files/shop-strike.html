<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sale price</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ffd23f; --tag: #ff3b30; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); color: var(--color); }
.t4 { font-size: 9vh; font-weight: 800; letter-spacing: 0.3em; padding: 1.4vh 3vh 1.4vh 3.6vh; border: 0.8vh solid var(--color); border-radius: 6vh; white-space: pre; animation: drop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.r { display: flex; align-items: flex-end; gap: 6vh; margin-top: 3vh; }
.pr { position: relative; }
.t1 { display: block; font: 800 46vh/1 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; color: var(--accent); letter-spacing: -0.01em; white-space: pre; text-shadow: 0 1.6vh 4vh rgba(0, 0, 0, 0.4); animation: pop 0.6s 0.12s cubic-bezier(0.3, 1.7, 0.5, 1) both; -webkit-mask-image: linear-gradient(110deg, #000 40%, rgba(0, 0, 0, 0.55) 50%, #000 60%); mask-image: linear-gradient(110deg, #000 40%, rgba(0, 0, 0, 0.55) 50%, #000 60%); -webkit-mask-size: 300% 100%; mask-size: 300% 100%; }
.t1 { animation: pop 0.6s 0.12s cubic-bezier(0.3, 1.7, 0.5, 1) both, shine 2.4s 1.2s ease-in-out infinite; }
.old { position: relative; margin-bottom: 7vh; animation: side 0.5s 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t2 { font: 600 20vh/1 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; opacity: 0.7; white-space: pre; }
.old::after { content: ""; position: absolute; left: -6%; right: -6%; top: 50%; height: 1.6vh; margin-top: -0.8vh; background: var(--tag); border-radius: 1vh; transform: rotate(-12deg) scaleX(0); transform-origin: left; animation: strike 0.35s 0.7s cubic-bezier(0.5, 0, 0.3, 1) forwards; }
.t3 { position: absolute; right: -18vh; top: -30vh; width: 28vh; height: 28vh; border-radius: 50%; background: var(--tag); display: flex; align-items: center; justify-content: center; font: 800 10vh/1 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; color: #fff; white-space: pre; transform: rotate(12deg); box-shadow: 0 1.4vh 3vh rgba(0, 0, 0, 0.35); animation: tag 0.5s 0.9s cubic-bezier(0.3, 1.9, 0.5, 1) both, wob 2s 1.6s ease-in-out infinite; }
@keyframes drop { from { opacity: 0; transform: translateY(-6vh); } }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes shine { 0% { -webkit-mask-position: 100% 0; mask-position: 100% 0; } 50%, 100% { -webkit-mask-position: 0 0; mask-position: 0 0; } }
@keyframes side { from { opacity: 0; transform: translateX(6vh); } }
@keyframes strike { to { transform: rotate(-12deg) scaleX(1); } }
@keyframes tag { from { transform: rotate(-90deg) scale(0); } }
@keyframes wob { 50% { transform: rotate(4deg) scale(1.06); } }
</style>
</head>
<body>
<div class="w">
  <span class="t4">NOW</span>
  <div class="r"><div class="pr"><span class="t1">$29</span></div><div class="old"><span class="t2">$49</span><span class="t3">-40%</span></div></div>
</div>
<script>
/*
 * A big new price that pops in, the old price beside it struck through by a line drawn across, and a round tag. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
