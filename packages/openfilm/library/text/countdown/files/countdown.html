<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Countdown</title>
<style>
:root { --font: ui-monospace, Menlo, monospace; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.t { font: 800 85.333vw/1 var(--font); }
.t i { font-style: normal; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; animation: c 1s ease-out both; }
.t i:nth-child(2) { animation-delay: 1s; } .t i:nth-child(3) { animation-delay: 2s; }
@keyframes c { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="w"><div class="t"><i>3</i><i>2</i><i>1</i></div></div>
<script>
/*
 * A big number counting down 3, 2, 1, a second each. Its words and color are the clip's to change. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
