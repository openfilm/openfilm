<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Speech bubble</title>
<style>
:root { --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: var(--font); line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.t { font-size: 9.476vw; font-weight: 700; color: #111; background: var(--color); border-radius: 1em; padding: 0.4em 0.9em; position: relative; }
.t::after { content: ""; position: absolute; left: 1.2em; bottom: -0.45em; border: 0.5em solid transparent; border-top-color: var(--color); border-bottom: 0; }
.t { animation: in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes in { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="w"><div class="t">You’ve got this!</div></div>
<script>
/*
 * Words in a white speech bubble. Its words and color are the clip's to change. A page of OpenFilm's library
 * (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
