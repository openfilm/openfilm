<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Numbered list</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #5b8cff; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 10vh; font-family: var(--font); color: var(--color); text-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.45); }
.t0 { align-self: flex-start; font-size: 10vh; font-weight: 800; letter-spacing: 0.08em; white-space: pre; padding-bottom: 2vh; margin-bottom: 4vh; border-bottom: 1.2vh solid var(--accent); animation: side 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.ls { position: relative; display: flex; flex-direction: column; gap: 5vh; }
.ls::before { content: ""; position: absolute; left: 7vh; top: 7vh; bottom: 7vh; width: 0.8vh; margin-left: -0.4vh; background: rgba(255, 255, 255, 0.35); transform-origin: top; animation: down 1s 0.3s cubic-bezier(0.4, 0, 0.2, 1) both; }
.it { display: flex; align-items: center; gap: 5vh; animation: side 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.it b { position: relative; width: 14vh; height: 14vh; flex: none; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font: 800 8vh/1 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; text-shadow: none; box-shadow: 0 0 0 1.4vh rgba(0, 0, 0, 0.25); animation: pop 0.45s cubic-bezier(0.3, 1.8, 0.5, 1) both; animation-delay: inherit; }
.it span { font-size: 11vh; font-weight: 700; white-space: pre; }
.it:nth-child(1) { animation-delay: 0.3s; } .it:nth-child(2) { animation-delay: 0.6s; } .it:nth-child(3) { animation-delay: 0.9s; }
@keyframes side { from { opacity: 0; transform: translateX(-6vh); } }
@keyframes pop { from { transform: scale(0); } }
@keyframes down { from { transform: scaleY(0); } }
</style>
</head>
<body>
<div class="w">
  <span class="t0">3 THINGS TO PACK</span>
  <div class="ls">
    <div class="it"><b>1</b><span class="t1">A warm layer</span></div>
    <div class="it"><b>2</b><span class="t2">Cash for the market</span></div>
    <div class="it"><b>3</b><span class="t3">An empty notebook</span></div>
  </div>
</div>
<script>
/*
 * A heading and three numbered points that come in one after another along a line drawn down beside them. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
