<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lower third</title>
<style>
:root { --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: var(--font); line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.t { font-size: 19.109vw; font-weight: 700; border-left: 2.275vw solid var(--color); padding-left: 5.46vw; }
.t { animation: in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes in { from { transform: translateX(-25%); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="w low"><div class="t"><span class="x">Lin Xiao</span><span class="s">Barista · ten years</span></div></div>
<script>
/*
 * A name and a role at the lower left, with a line beside them. Its words and color are the clip's to change. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
