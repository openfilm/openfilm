<style>
:root { --font: 'Snell Roundhand', 'Segoe Script', 'Brush Script MT', 'Kaiti SC', 'STKaiti', 'KaiTi', cursive; --color: #ffffff; --tree: #1f9d5a; --star: #ffd34d; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6vh; font-family: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; color: var(--color); }
.snow { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.snow i { position: absolute; top: -4vh; border-radius: 50%; background: #fff; animation: fall linear infinite; }
.tr { position: relative; width: 62vh; height: 84vh; flex: none; }
.tr b { position: absolute; left: 50%; background: var(--tree); clip-path: polygon(50% 0, 100% 100%, 0 100%); transform-origin: 50% 100%; animation: grow 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.tr b:nth-of-type(1) { width: 62vh; height: 34vh; margin-left: -31vh; top: 42vh; }
.tr b:nth-of-type(2) { width: 50vh; height: 30vh; margin-left: -25vh; top: 24vh; animation-delay: 0.1s; }
.tr b:nth-of-type(3) { width: 36vh; height: 24vh; margin-left: -18vh; top: 9vh; animation-delay: 0.2s; }
.tr .trunk { position: absolute; left: 50%; top: 76vh; width: 10vh; height: 8vh; margin-left: -5vh; background: #7a4a2a; border-radius: 0 0 1vh 1vh; }
.tr .star { position: absolute; left: 50%; top: 0; width: 16vh; height: 16vh; margin: -6vh 0 0 -8vh; background: var(--star); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: star 0.6s 0.4s cubic-bezier(0.3, 1.8, 0.5, 1) both, twinkle 1.6s 1.1s ease-in-out infinite; filter: drop-shadow(0 0 2vh var(--star)); }
.tr .lt { position: absolute; width: 3.4vh; height: 3.4vh; border-radius: 50%; animation: on 0.3s steps(1) both, blink 1.2s ease-in-out infinite; }
.tx { display: flex; flex-direction: column; align-items: flex-start; }
.t1 { font: 400 18vh/1.05 var(--font); white-space: pre; text-shadow: 0 1vh 3vh rgba(0, 0, 0, 0.45); -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%); -webkit-mask-size: 220% 100%; mask-size: 220% 100%; animation: write 1.2s 0.3s cubic-bezier(0.3, 0.1, 0.3, 1) both; }
.t2 { margin: 2vh 0 0 2vh; font-size: 6vh; font-weight: 600; letter-spacing: 0.3em; white-space: pre; opacity: 0.9; animation: rise 0.6s 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes fall { from { transform: translate(0, 0); } to { transform: translate(6vh, 108vh); } }
@keyframes grow { from { transform: scale(0); } }
@keyframes star { from { transform: scale(0) rotate(-144deg); } }
@keyframes twinkle { 50% { scale: 1.12; filter: drop-shadow(0 0 4vh var(--star)); } }
@keyframes on { from { opacity: 0; } }
@keyframes blink { 50% { filter: brightness(1.6); transform: scale(1.25); } }
@keyframes write { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(3vh); } }
</style>
</head>

<script>
/*
 * A simple tree of stacked triangles with a star and lights, a greeting written in script beside it, snow falling.
 * A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by
 * the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
