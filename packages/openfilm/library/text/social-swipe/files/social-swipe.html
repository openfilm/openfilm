<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Swipe up</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ffffff; --accent: #ffe14d; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); color: var(--color); text-align: center; }
.tr { position: relative; width: 26vh; height: 44vh; border-radius: 14vh; border: 1.2vh solid rgba(255, 255, 255, 0.55); background: rgba(0, 0, 0, 0.3); overflow: hidden; animation: pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.tr i { position: absolute; left: 50%; width: 11vh; height: 11vh; margin-left: -5.5vh; border: solid var(--accent); border-width: 2vh 0 0 2vh; border-radius: 0.6vh; transform: rotate(45deg); opacity: 0; animation: chev 1.2s ease-in-out infinite; }
.tr i:nth-child(1) { animation-delay: 0.3s; } .tr i:nth-child(2) { animation-delay: 0.55s; } .tr i:nth-child(3) { animation-delay: 0.8s; }
.t1 { margin-top: 5vh; font-size: 10vh; font-weight: 800; letter-spacing: 0.12em; white-space: pre; text-shadow: 0 0.8vh 2.4vh rgba(0, 0, 0, 0.5); animation: rise 0.5s 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both, float 1.2s 1s ease-in-out infinite; }
.t2 { margin-top: 1.6vh; font-size: 5.6vh; font-weight: 500; opacity: 0.85; white-space: pre; text-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.5); animation: rise 0.5s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes pop { from { opacity: 0; transform: translateY(16vh) scale(0.6); } }
@keyframes chev { 0% { top: 70%; opacity: 0; } 30% { opacity: 1; } 100% { top: 6%; opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(4vh); } }
@keyframes float { 50% { transform: translateY(-1.4vh); } }
</style>
</head>
<body>
<div class="w">
  <div class="tr"><i></i><i></i><i></i></div>
  <div class="t1">SWIPE UP</div>
  <div class="t2">for the full recipe</div>
</div>
<script>
/*
 * Chevrons rising in a row inside a rounded track, with words to swipe up under it. A page of OpenFilm's library
 * (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
