<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quote</title>
<style>
:root { --font: Georgia, serif; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.t { font: italic 400 9.103vw/1.3 var(--font); max-width: 115.862vw; }
.t { animation: in 1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes in { from { transform: translateY(40%); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="w"><div class="t">“Slow down. It’s fine.”</div></div>
<script>
/*
 * A quotation in italic serif letters. Its words and color are the clip's to change. A page of OpenFilm's library
 * (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
