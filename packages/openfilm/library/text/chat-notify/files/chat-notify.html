<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Message alert</title>
<style>
:root { --font: -apple-system, 'SF Pro Text', 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --app: #34c759; --card: rgba(246, 246, 248, 0.94); --ink: #111216; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font); }
.c { width: 340vh; display: flex; align-items: center; gap: 6vh; background: var(--card); color: var(--ink); border-radius: 12vh; padding: 9vh 10vh 9vh 8vh; box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.35); animation: drop 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.ic { width: 56vh; height: 56vh; flex: none; border-radius: 14vh; background: var(--app); display: flex; align-items: center; justify-content: center; }
.ic svg { width: 34vh; height: 34vh; }
.ic path { fill: #fff; }
.tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2vh; }
.hd { display: flex; justify-content: space-between; font-size: 11vh; font-weight: 600; opacity: 0.55; letter-spacing: 0.04em; }
.t1, .t2 { white-space: pre; }
.t3 { font-size: 15vh; font-weight: 700; white-space: pre; }
.t4 { font-size: 14vh; font-weight: 400; white-space: pre; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
@keyframes drop { from { opacity: 0; transform: translateY(-60vh) scale(0.94); } }
</style>
</head>
<body>
<div class="w"><div class="c">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3C6.8 3 2.6 6.6 2.6 11c0 2.5 1.3 4.7 3.4 6.1-.2 1.4-.9 2.7-2 3.6 2 .1 3.9-.6 5.3-1.8.9.2 1.8.3 2.7.3 5.2 0 9.4-3.6 9.4-8.2S17.2 3 12 3z"/></svg></div>
  <div class="tx"><div class="hd"><span class="t1">MESSAGES</span><span class="t2">now</span></div><span class="t3">Mom</span><span class="t4">Dinner is ready, come home soon</span></div>
</div></div>
<script>
/*
 * A phone message alert sliding down with a bounce: an app badge, its name and time, who wrote and the message. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
