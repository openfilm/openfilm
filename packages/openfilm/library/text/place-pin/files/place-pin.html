<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map pin</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ff4d5e; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; gap: 7vh; padding-left: 8vh; font-family: var(--font); color: var(--color); }
.pn { position: relative; width: 50vh; height: 84vh; flex: none; }
.pn .sh { position: absolute; left: 50%; bottom: 2vh; width: 26vh; height: 7vh; margin-left: -13vh; border-radius: 50%; background: rgba(0, 0, 0, 0.45); animation: shadow 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.pn .rg { position: absolute; left: 50%; bottom: 0; width: 30vh; height: 11vh; margin-left: -15vh; border-radius: 50%; border: 1vh solid var(--accent); opacity: 0; animation: ring 1.6s 0.6s ease-out infinite; }
.pn svg { position: absolute; left: 50%; bottom: 5vh; width: 44vh; height: 60vh; margin-left: -22vh; overflow: visible; transform-origin: 50% 100%; animation: drop 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) both, sway 2.6s 1.2s ease-in-out infinite; }
.pn path { fill: var(--accent); }
.pn circle { fill: #fff; }
.tx { display: flex; flex-direction: column; gap: 2vh; text-shadow: 0 0.8vh 2.6vh rgba(0, 0, 0, 0.5); }
.t1 { font-size: 27vh; font-weight: 800; line-height: 1.05; white-space: pre; clip-path: inset(0 100% -20% 0); animation: wipe 0.6s 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.t2 { font-size: 12vh; font-weight: 600; white-space: pre; opacity: 0.92; animation: side 0.5s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t3 { font: 500 9vh/1 'SF Mono', Menlo, Consolas, ui-monospace, 'PingFang SC', 'Microsoft YaHei', monospace; opacity: 0.65; letter-spacing: 0.04em; white-space: pre; animation: side 0.5s 0.72s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes drop { 0% { transform: translateY(-80vh); opacity: 0; } 50% { opacity: 1; } 100% { transform: none; } }
@keyframes shadow { from { transform: scale(0.2); opacity: 0; } }
@keyframes ring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
@keyframes sway { 50% { rotate: 3deg; } }
@keyframes wipe { to { clip-path: inset(0 0 -20% 0); } }
@keyframes side { from { opacity: 0; transform: translateX(-4vh); } }
</style>
</head>
<body>
<div class="w">
  <div class="pn"><i class="rg"></i><i class="sh"></i><svg viewBox="0 0 22 30"><path d="M11 0C4.9 0 0 4.8 0 10.8 0 18.4 9.2 28.4 10 29.3c.5.6 1.4.6 2 0 .8-.9 10-10.9 10-18.5C22 4.8 17.1 0 11 0z"/><circle cx="11" cy="10.8" r="4.4"/></svg></div>
  <div class="tx"><span class="t1">Alfama</span><span class="t2">Lisbon, Portugal</span><span class="t3">38.7139° N, 9.1300° W</span></div>
</div>
<script>
/*
 * A map pin that drops and bounces on a pulsing ring, a place name beside it, a region and its coordinates. A page
 * of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
