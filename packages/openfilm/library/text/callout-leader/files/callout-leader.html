<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Leader line callout</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ffffff; --accent: #ffd84d; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; font-family: var(--font); color: var(--color); }
svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
path { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.6s 0.2s cubic-bezier(0.6, 0, 0.3, 1) forwards; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4)); }
.dot { position: absolute; left: 12vh; top: 82vh; width: 6vh; height: 6vh; margin: -3vh 0 0 -3vh; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.6vh rgba(255, 255, 255, 0.25); animation: pop 0.4s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
.dot::after { content: ""; position: absolute; inset: -1vh; border-radius: 50%; border: 0.8vh solid var(--accent); animation: ring 1.6s 0.4s ease-out infinite; }
.t1 { position: absolute; left: 50vh; bottom: 63vh; font-size: 19vh; font-weight: 700; line-height: 1; white-space: pre; text-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.45); clip-path: inset(0 100% 0 0); animation: wipe 0.6s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.t2 { position: absolute; left: 50vh; top: 44vh; font-size: 10vh; font-weight: 500; opacity: 0.88; white-space: pre; text-shadow: 0 0.4vh 1.6vh rgba(0, 0, 0, 0.5); animation: rise 0.6s 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); } }
@keyframes ring { from { transform: scale(0.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
@keyframes wipe { to { clip-path: inset(0 0 -20% 0); } }
@keyframes rise { from { opacity: 0; transform: translateY(-3vh); } }
</style>
</head>
<body>
<div class="w">
  <svg viewBox="0 0 600 300" preserveAspectRatio="xMinYMin meet"><path pathLength="1" d="M36 246 L 120 114 L 580 114"/></svg>
  <div class="dot"></div>
  <span class="t1">Fresh basil</span>
  <span class="t2">picked this morning</span>
</div>
<script>
/*
 * A pulsing dot with a line drawn up from it and along, a label above the line and a note under it. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
