<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Name card, business</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ffffff; --accent: #3b82f6; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; padding-left: 5vh; font-family: var(--font); color: var(--color); }
.w::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 10, 20, 0.62), rgba(5, 10, 20, 0.35) 55%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); animation: fade 0.6s both; }
.bar { position: relative; width: 2vh; height: 74vh; background: var(--accent); border-radius: 0.4vh; animation: bar 0.45s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.txt { position: relative; overflow: hidden; padding: 2vh 4vh 2vh 4.4vh; }
.t1 { display: block; font-size: 31vh; font-weight: 700; line-height: 1.05; white-space: pre; letter-spacing: 0.01em; animation: out 0.7s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
.row { display: flex; align-items: center; gap: 2.4vh; margin-top: 1.4vh; animation: out 0.7s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
.row::before { content: ""; width: 2.6vh; height: 2.6vh; background: var(--accent); }
.t2 { font-size: 12vh; font-weight: 500; letter-spacing: 0.14em; opacity: 0.88; white-space: pre; text-transform: uppercase; }
.line { position: absolute; left: 4.4vh; right: 0; bottom: 0; height: 0.5vh; background: linear-gradient(90deg, var(--color), transparent); opacity: 0.55; transform-origin: left; animation: grow 0.9s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes bar { from { transform: scaleY(0); } }
@keyframes out { from { transform: translateX(-110%); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
<div class="w">
  <div class="bar"></div>
  <div class="txt"><span class="t1">Lin Xiao</span><div class="row"><span class="t2">Product Director</span></div><div class="line"></div></div>
</div>
<script>
/*
 * A name sliding out from behind an upright bar of color, a role and a fine line under it, on a soft dark shade. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
