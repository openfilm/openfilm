<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Name card, elegant</title>
<style>
:root { --font: Didot, 'Bodoni 72', Georgia, 'Songti SC', 'Noto Serif SC', serif; --color: #f7f2ea; --accent: #d8b77a; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 7vh; color: var(--color); text-shadow: 0 0.5vh 2vh rgba(0, 0, 0, 0.45); }
.r { display: flex; align-items: center; gap: 5vh; }
.t1 { font: 400 30vh/1.05 var(--font); white-space: pre; letter-spacing: 0.02em; animation: blur 1s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.v { width: 0.6vh; height: 38vh; background: var(--accent); animation: tall 0.7s 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t2 { font: italic 400 15vh/1.1 Georgia, 'Songti SC', 'Noto Serif SC', serif; opacity: 0.9; white-space: pre; animation: side 0.9s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.u { display: flex; align-items: center; gap: 2vh; margin-top: 3vh; width: 100%; max-width: 330vh; }
.u i { width: 2.2vh; height: 2.2vh; border: 0.45vh solid var(--accent); transform: rotate(45deg); animation: dia 0.7s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.u b { flex: 1; height: 0.6vh; background: linear-gradient(90deg, var(--accent), transparent); transform-origin: left; animation: grow 1.1s 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes blur { from { opacity: 0; filter: blur(2vh); letter-spacing: 0.2em; } }
@keyframes tall { from { transform: scaleY(0); } }
@keyframes side { from { opacity: 0; transform: translateX(-5vh); } }
@keyframes dia { from { opacity: 0; transform: rotate(-135deg) scale(0.2); } }
@keyframes grow { from { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="w">
  <div class="r"><span class="t1">Élise Moreau</span><div class="v"></div><span class="t2">Pianist</span></div>
  <div class="u"><i></i><b></b></div>
</div>
<script>
/*
 * A serif name and an italic role on either side of a fine upright line, a small diamond and a rule drawn under
 * them. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t
 * by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
