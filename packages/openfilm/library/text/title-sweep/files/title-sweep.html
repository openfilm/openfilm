<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sweep box title</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ffffff; --accent: #2ee6a6; --box: rgba(10, 12, 18, 0.88); }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 8vw; font-family: var(--font); color: var(--color); }
.tag { font-size: 4.8vh; font-weight: 800; letter-spacing: 0.16em; color: #0b0d12; background: var(--accent); padding: 0.5vh 2.2vh; margin: 0 0 0 3vh; position: relative; z-index: 2; animation: tagin 0.5s 0.55s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.box { position: relative; display: inline-block; padding: 3.4vh 6vh 4vh; background: var(--box); overflow: hidden; animation: open 0.4s 0.2s steps(1) both; }
.box::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.16) 50%, transparent 70%); background-size: 300% 100%; animation: shine 2.6s 1s ease-in-out infinite; }
.t1 { display: block; font-size: 17vh; font-weight: 800; line-height: 1; letter-spacing: 0.01em; white-space: pre; animation: open 0.4s 0.3s steps(1) both; }
.sweep { position: absolute; inset: 0; pointer-events: none; }
.sweep i { position: absolute; left: 0; top: 0; height: 100%; width: var(--bw, 100%); background: var(--accent); animation: sweep 0.75s cubic-bezier(0.7, 0, 0.2, 1) both; }
.holder { position: relative; }
.line { height: 1vh; width: 30vh; background: var(--accent); margin-top: 2.2vh; animation: grow 0.6s 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both; transform-origin: left; }
.t3 { font-size: 5.6vh; font-weight: 500; margin-top: 2vh; white-space: pre; opacity: 0.92; animation: rise 0.6s 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes sweep { 0% { transform: scaleX(0); transform-origin: left; } 50% { transform: scaleX(1); transform-origin: left; } 50.1% { transform: scaleX(1); transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }
@keyframes open { from { visibility: hidden; } }
@keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -20% 0; } }
@keyframes tagin { from { opacity: 0; transform: translateY(2vh) scale(0.7); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(2.5vh); } }
</style>
</head>
<body>
<div class="w">
  <div class="tag t2">EPISODE 03</div>
  <div class="holder"><div class="box"><span class="t1">MIDNIGHT RUN</span></div><div class="sweep"><i></i></div></div>
  <div class="line"></div>
  <div class="t3">Streets after the last train</div>
</div>
<script>
/*
 * A bar of color sweeps across and leaves a title on a dark box behind it, a tag at its corner and a line under it.
 * A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by
 * the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
