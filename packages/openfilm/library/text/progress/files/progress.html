<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Progress bar</title>
<style>
:root { --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #45c2b4; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: var(--font); line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.w { align-items: center; }
.t { width: 89.302vw; height: 38.118vh; border-radius: 31.765vh; background: rgba(255, 255, 255, 0.25); overflow: hidden; font-size: 0; }
.t::after { content: ""; display: block; height: 100%; background: var(--color); animation: p 3s linear both; }
@keyframes p { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>
<div class="w"><div class="t"></div></div>
<script>
/*
 * A bar across the bottom that fills over the clip's first three seconds. Its words and color are the clip's to
 * change. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held
 * at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
