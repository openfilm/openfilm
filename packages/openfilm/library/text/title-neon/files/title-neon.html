<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neon</title>
<style>
:root { --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --color: #ff3fd8; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: var(--font); line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.t { font-size: 29.691vw; font-weight: 700; color: #fff; text-shadow: 0 0 1.979vw var(--color), 0 0 6.598vw var(--color), 0 0 13.196vw var(--color); animation: on 1.2s steps(1) both; }
@keyframes on { 0% { opacity: 0; } 20% { opacity: 1; } 28% { opacity: 0.2; } 36% { opacity: 1; } 44% { opacity: 0.5; } 52% { opacity: 1; } }
</style>
</head>
<body>
<div class="w"><div class="t">OPEN</div></div>
<script>
/*
 * A neon sign that buzzes on. Its words and color are the clip's to change. A page of OpenFilm's library (CC0):
 * what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
