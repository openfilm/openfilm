<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weather card</title>
<style>
:root { --font: 'DIN Alternate', 'Bahnschrift', 'Avenir Next', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --sun: #ffc533; --card: rgba(18, 28, 48, 0.72); --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; color: var(--color); }
.c { display: flex; align-items: center; gap: 8vh; background: var(--card); border: 0.6vh solid rgba(255, 255, 255, 0.16); border-radius: 8vh; padding: 10vh 14vh 10vh 10vh; box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.3); animation: in 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.ic { position: relative; width: 56vh; height: 56vh; flex: none; }
.sun { position: absolute; left: 0; top: 0; width: 42vh; height: 42vh; animation: pop 0.6s 0.2s cubic-bezier(0.3, 1.7, 0.5, 1) both; }
.sun b { position: absolute; inset: 9vh; border-radius: 50%; background: var(--sun); box-shadow: 0 0 6vh var(--sun); }
.sun .rays { position: absolute; inset: 0; animation: spin 10s linear infinite; }
.sun .rays i { position: absolute; left: 50%; top: 0; width: 3.4vh; height: 7vh; margin-left: -1.7vh; border-radius: 2vh; background: var(--sun); transform-origin: 50% 21vh; }
.cd { position: absolute; right: 0; bottom: 4vh; width: 40vh; height: 22vh; animation: cloud 0.7s 0.45s cubic-bezier(0.3, 1.4, 0.5, 1) both, drift 4s 1.2s ease-in-out infinite; filter: drop-shadow(0 1.4vh 2vh rgba(0, 0, 0, 0.25)); }
.cd i { position: absolute; border-radius: 50%; background: #fff; }
.tx { display: flex; flex-direction: column; gap: 1.6vh; }
.tm { font: 700 40vh/0.95 var(--font); font-variant-numeric: tabular-nums; }
.t2 { font-size: 13vh; font-weight: 700; white-space: pre; animation: side 0.5s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t3 { font-size: 9vh; font-weight: 500; opacity: 0.75; white-space: pre; animation: side 0.5s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes in { from { opacity: 0; transform: translateY(8vh) scale(0.9); } }
@keyframes pop { from { transform: scale(0) rotate(-90deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes cloud { from { opacity: 0; transform: translateX(-16vh); } }
@keyframes drift { 50% { translate: 3vh 0; } }
@keyframes side { from { opacity: 0; transform: translateX(-4vh); } }
</style>
</head>
<body>
<div class="w"><div class="c">
  <div class="ic"><div class="sun"><div class="rays"><i style="rotate: 0deg"></i><i style="rotate: 45deg"></i><i style="rotate: 90deg"></i><i style="rotate: 135deg"></i><i style="rotate: 180deg"></i><i style="rotate: 225deg"></i><i style="rotate: 270deg"></i><i style="rotate: 315deg"></i></div><b></b></div>
    <div class="cd"><i style="left: 0; top: 9vh; width: 16vh; height: 13vh"></i><i style="left: 9vh; top: 0; width: 20vh; height: 20vh"></i><i style="left: 22vh; top: 6vh; width: 17vh; height: 16vh"></i><i style="left: 4vh; top: 12vh; width: 32vh; height: 10vh; border-radius: 5vh"></i></div></div>
  <div class="tx"><span class="ln tm"><span class="t1 src">24°</span></span><span class="t2">Kyoto</span><span class="t3">Sunny, light wind</span></div>
</div></div>
<script>
/*
 * A weather card: a sun turning slowly with a cloud drifting over it, the temperature counting up, the city and the
 * sky. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t
 * by the host.
 */
/* moves drawn from t: each layer's place at t comes from t alone */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, at, len) => clamp((t - at) / len);
const easeOut = (x) => 1 - (1 - x) ** 3;
const easeBack = (x, s = 1.9) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2);
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const draws = [];
let now = 0;
/* an element's words, a line break for each <br> (as the editor writes them) */
const linesOf = (el) => [...el.childNodes].map((n) => (n.nodeType === 3 ? n.data : n.localName === 'br' ? '\n' : '')).join('');
/*
 * An editable layer drawn again on a copy over it (letter by letter, a number counting): the layer itself stays, its
 * words see-through, so the editor still finds, moves and changes it; the copy follows its words and its tweaks.
 */
function overlay(sel, build, paint) {
  const src = document.querySelector(sel);
  const fx = document.createElement('span');
  fx.className = 'fx';
  fx.setAttribute('aria-hidden', 'true');
  src.after(fx);
  let text = null;
  let state = null;
  const sync = () => {
    fx.style.cssText = src.style.cssText;
    const words = linesOf(src);
    if (words !== text) { text = words; state = build(fx, words); }
    paint(state, now);
  };
  new MutationObserver(sync).observe(src, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  sync();
  draws.push((t) => paint(state, t));
}
/* the layer's letters, each moved by `move(letter, t, i, n)` */
function letters(sel, move) {
  overlay(sel, (fx, words) => {
    const out = [];
    fx.replaceChildren();
    words.split('\n').forEach((line, k) => {
      if (k) fx.append(document.createElement('br'));
      for (const ch of Array.from(line)) {
        const c = document.createElement('span');
        c.className = 'ch';
        c.textContent = ch;
        fx.append(c);
        out.push(c);
      }
    });
    return out;
  }, (out, t) => out.forEach((c, i) => move(c, t, i, out.length)));
}
/* the number in the layer's words, counted up from 0 between `at` and `at + len` seconds (its words around it kept) */
function countUp(sel, at, len) {
  overlay(sel, (fx, words) => {
    const m = words.match(/^([^\d]*?)(\d[\d,]*(?:\.\d+)?)([\s\S]*)$/);
    if (!m) { fx.textContent = words; return null; }
    const [, pre, num, post] = m;
    return { fx, pre, post, value: Number(num.replace(/,/g, '')), places: (num.split('.')[1] ?? '').length, commas: num.includes(',') };
  }, (s, t) => {
    if (!s) return;
    const v = s.value * easeOut(prog(t, at, len));
    let str = v.toFixed(s.places);
    if (s.commas) { const [a, b] = str.split('.'); str = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b ? '.' + b : ''); }
    s.fx.textContent = s.pre + str + s.post;
  });
}
/* the layer's words typed from `at`, `cps` letters a second, a cursor after them blinking once they are all there */
function typed(sel, at, cps) {
  overlay(sel, (fx, words) => {
    fx.replaceChildren();
    const out = [];
    words.split('\n').forEach((line, k) => {
      if (k) { const br = document.createElement('br'); fx.append(br); out.push(br); }
      for (const ch of Array.from(line)) { const c = document.createElement('span'); c.textContent = ch; fx.append(c); out.push(c); }
    });
    const cur = document.createElement('span');
    cur.className = 'cur';
    fx.append(cur);
    return { out, cur };
  }, ({ out, cur }, t) => {
    const n = Math.floor((t - at) * cps);
    out.forEach((c, i) => { c.style.display = i < n ? '' : 'none'; });
    cur.style.opacity = t < at || (n >= out.length && (t * 1.8) % 1 > 0.5) ? 0 : 1;
  });
}
/* a layer made smaller when its words grow wider than `room` (an element, or a share of the page's width): its --k */
function autofit(sel, room) {
  const el = document.querySelector(sel);
  const box = typeof room === 'string' ? document.querySelector(room) : null;
  const fit = () => {
    el.style.setProperty('--k', '1');
    const w = el.scrollWidth;
    const limit = box ? box.clientWidth : innerWidth * room;
    if (w > limit) el.style.setProperty('--k', (limit / w).toFixed(3));
  };
  new MutationObserver(fit).observe(el, { childList: true, characterData: true, subtree: true });
  fit();
}
countUp('.t1', 0.3, 1);
window.film = { frame(t) { now = t; for (const d of draws) d(t); } };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
