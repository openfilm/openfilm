<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Typewriter</title>
<style>
:root { --font: ui-monospace, Menlo, "PingFang SC", monospace; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w.low { text-align: left; }
.t { color: var(--color); font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; line-height: 1.12; }
.s { display: block; font-size: 0.42em; font-weight: 500; opacity: 0.85; margin-top: 0.3em; }
.t { font: 600 18.397vw/1.2 var(--font); white-space: pre; animation: type 1.6s steps(12) both; }
.t::after { content: "_"; animation: blink 0.8s steps(1) infinite; }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="w"><div class="t">7:42 AM</div></div>
<script>
/*
 * Words typed out letter by letter, with a blinking cursor. Its words and color are the clip's to change. A page
 * of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
