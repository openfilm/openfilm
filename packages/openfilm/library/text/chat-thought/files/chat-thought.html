<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thought bubble</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --cloud: #ffffff; --ink: #1d1e25; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; font-family: var(--font); }
.cl { position: absolute; left: 30vh; top: 10vh; width: 120vh; height: 62vh; animation: puff 0.6s 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) both, drift 3.2s 1.2s ease-in-out infinite; transform-origin: 15% 90%; filter: drop-shadow(0 2vh 4vh rgba(0, 0, 0, 0.3)); }
.cl i { position: absolute; border-radius: 50%; background: var(--cloud); }
.cl .base { left: 8vh; right: 8vh; top: 14vh; bottom: 6vh; border-radius: 22vh; }
.t1 { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-40%); text-align: center; font-size: 12.5vh; font-weight: 700; line-height: 1.15; color: var(--ink); white-space: pre; animation: fade 0.4s 0.8s both; }
.tr { position: absolute; border-radius: 50%; background: var(--cloud); filter: drop-shadow(0 1vh 2vh rgba(0, 0, 0, 0.3)); animation: pop 0.35s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
@keyframes puff { from { opacity: 0; transform: scale(0.1); } }
@keyframes drift { 50% { translate: 1.6vh -2vh; } }
@keyframes pop { from { transform: scale(0); } }
@keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
<div class="w">
      <i class="tr" style="left: 10vh; top: 86vh; width: 7vh; height: 7vh"></i>
      <i class="tr" style="left: 18vh; top: 72vh; width: 11vh; height: 11vh; animation-delay: 0.2s"></i>
      <div class="cl">
        <i style="left: 6vh; top: 20vh; width: 34vh; height: 34vh"></i><i style="left: 24vh; top: 4vh; width: 38vh; height: 38vh"></i>
        <i style="left: 52vh; top: 0; width: 42vh; height: 42vh"></i><i style="left: 80vh; top: 10vh; width: 36vh; height: 36vh"></i>
        <i style="left: 18vh; top: 28vh; width: 40vh; height: 34vh"></i><i style="left: 66vh; top: 26vh; width: 44vh; height: 36vh"></i>
        <i class="base"></i>
        <span class="t1">What's for
dinner?</span>
      </div>
    </div>
<script>
/*
 * A cloud of a thought that puffs up after two small rings of its trail, a few words in it, drifting gently. A page
 * of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
