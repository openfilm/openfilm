<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Name card, neon</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ff3da8; --accent2: #2ee8ff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; padding-left: 5vh; font-family: var(--font); }
.f { position: relative; padding: 6.4vh 12vh 7vh 9vh; border: 1.2vh solid #fff; border-radius: 6vh; background: rgba(10, 4, 20, 0.45);
  box-shadow: 0 0 1.4vh var(--accent), 0 0 5vh var(--accent), inset 0 0 1.4vh var(--accent), inset 0 0 5vh var(--accent); animation: on 1s steps(1) both, hum 2.4s 1s ease-in-out infinite; }
.t1 { display: block; color: #fff; font-size: 26vh; font-weight: 700; line-height: 1; white-space: pre; text-shadow: 0 0 1vh var(--accent), 0 0 3vh var(--accent), 0 0 7vh var(--accent); animation: on 1s 0.25s steps(1) both; }
.t2 { display: block; margin-top: 2.6vh; color: #fff; font-size: 11vh; font-weight: 600; letter-spacing: 0.16em; white-space: pre; text-shadow: 0 0 0.8vh var(--accent2), 0 0 2.6vh var(--accent2), 0 0 5vh var(--accent2); animation: on 1s 0.5s steps(1) both; }
@keyframes on { 0% { opacity: 0; } 10% { opacity: 1; } 16% { opacity: 0.15; } 24% { opacity: 1; } 34% { opacity: 0.3; } 40%, 100% { opacity: 1; } }
@keyframes hum { 50% { filter: brightness(1.18); } }
</style>
</head>
<body>
<div class="w"><div class="f"><span class="t1">DJ Nova</span><span class="t2">LIVE AT PIER 7</span></div></div>
<script>
/*
 * A glowing neon frame that buzzes on around a name, a role in a second glow under it. A page of OpenFilm's library
 * (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
