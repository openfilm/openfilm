<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Link in bio</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #7a5cff; --mark: #ffe14d; --ink: #16171c; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8vh; font-family: var(--font); }
.p { display: flex; align-items: center; gap: 7vh; background: #fff; color: var(--ink); border-radius: 60vh; padding: 8vh 12vh 8vh 8vh; box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.35); animation: pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.ic { width: 56vh; height: 56vh; flex: none; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; animation: spin 0.7s 0.15s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.ic svg { width: 32vh; height: 32vh; }
.ic path { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }
.tx { position: relative; }
.tx::before { content: ""; position: absolute; left: -2vh; right: -2vh; bottom: 3vh; height: 12vh; background: var(--mark); border-radius: 2vh; transform-origin: left; animation: mark 0.5s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t1 { position: relative; font-size: 30vh; font-weight: 800; white-space: pre; animation: side 0.5s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.ar { width: 34vh; height: 64vh; animation: pop 0.5s 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.ar svg { width: 100%; height: 100%; animation: bob 1s 1s ease-in-out infinite; filter: drop-shadow(0 1vh 2vh rgba(0, 0, 0, 0.4)); }
.ar path { fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes spin { from { transform: rotate(-200deg) scale(0); } }
@keyframes side { from { opacity: 0; transform: translateX(-5vh); } }
@keyframes mark { from { transform: scaleX(0); } }
@keyframes bob { 50% { transform: translateY(-8vh); } }
</style>
</head>
<body>
<div class="w">
  <div class="p"><div class="ic"><svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg></div><div class="tx"><span class="t1">Link in bio</span></div></div>
  <div class="ar"><svg viewBox="0 0 20 34"><path d="M10 31V4M3 11l7-7 7 7"/></svg></div>
</div>
<script>
/*
 * A white pill with a link badge and words to find the link, a marker stroke behind them and an arrow bobbing up. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t by the
 * host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
