<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Before and after</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --left: #5f6b7a; --right: #ff7a3d; --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 22vh; font-family: var(--font); color: var(--color); }
.c { position: relative; width: 88vh; height: 70vh; border-radius: 5vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; box-shadow: 0 3vh 7vh rgba(0, 0, 0, 0.35); overflow: hidden; }
.c::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255, 255, 255, 0.18), transparent 55%); }
.l { background: var(--left); animation: fromL 0.65s cubic-bezier(0.3, 1.35, 0.5, 1) both; }
.r { background: var(--right); animation: fromR 0.65s 0.1s cubic-bezier(0.3, 1.35, 0.5, 1) both; }
.c span:first-child { position: relative; font-size: 8vh; font-weight: 800; letter-spacing: 0.3em; padding-left: 0.3em; opacity: 0.85; white-space: pre; }
.c span:last-child { position: relative; font-size: 17vh; font-weight: 800; white-space: pre; }
.l span:last-child { opacity: 0.9; }
.vs { position: absolute; left: 50%; top: 50%; width: 22vh; height: 22vh; margin: -11vh; border-radius: 50%; background: #fff; color: #111; display: flex; align-items: center; justify-content: center; font-size: 10vh; font-weight: 800; font-style: italic; box-shadow: 0 0 0 2vh rgba(0, 0, 0, 0.25); z-index: 2; white-space: pre; animation: vs 0.6s 0.45s cubic-bezier(0.3, 1.8, 0.5, 1) both, beat 1.6s 1.4s ease-in-out infinite; }
.r::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.32) 50%, transparent 62%); background-size: 300% 100%; animation: shine 2.6s 1.2s ease-in-out infinite; }
@keyframes fromL { from { opacity: 0; transform: translateX(-30vh) rotate(-6deg); } }
@keyframes fromR { from { opacity: 0; transform: translateX(30vh) rotate(6deg); } }
@keyframes vs { from { transform: scale(0) rotate(-180deg); } }
@keyframes beat { 50% { scale: 1.08; } }
@keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -20% 0; } }
</style>
</head>
<body>
<div class="w">
  <div class="c l"><span class="t1">BEFORE</span><span class="t2">3 hours</span></div>
  <div class="c r"><span class="t3">AFTER</span><span class="t4">20 min</span></div>
  <div class="vs t5">VS</div>
</div>
<script>
/*
 * Two cards side by side, each with a heading and a value, sliding in from either side to a round mark between
 * them. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at t
 * by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
