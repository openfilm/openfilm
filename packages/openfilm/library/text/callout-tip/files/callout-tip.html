<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tip card</title>
<style>
:root { --font: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif; --accent: #ffc93c; --card: rgba(18, 20, 28, 0.86); --color: #ffffff; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
* { box-sizing: border-box; }
.ln { position: relative; display: inline-block; white-space: pre; }
.fx { position: absolute; left: 0; top: 0; width: 100%; white-space: pre; pointer-events: none; -webkit-text-fill-color: currentColor; }
.fx .ch { display: inline-block; will-change: transform; }
.src { -webkit-text-fill-color: transparent; }
.w { position: fixed; inset: 0; display: flex; align-items: center; padding: 0 5vh; font-family: var(--font); color: var(--color); }
.c { position: relative; display: flex; align-items: center; gap: 7vh; background: var(--card); border-radius: 5vh; padding: 10vh 12vh 10vh 9vh; overflow: hidden; box-shadow: 0 3vh 8vh rgba(0, 0, 0, 0.35); clip-path: inset(0 100% 0 0 round 5vh); animation: open 0.6s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
.c::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2.6vh; background: var(--accent); }
.b { position: relative; width: 44vh; height: 44vh; flex: none; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; transform-origin: 50% 0; animation: pop 0.5s 0.35s cubic-bezier(0.3, 1.8, 0.5, 1) both, swing 2.8s 1s ease-in-out infinite; }
.b::before { content: ""; position: absolute; inset: -4vh; border-radius: 50%; background: var(--accent); opacity: 0.25; animation: glow 1.4s 0.8s ease-in-out infinite; }
.b i { position: absolute; top: 7vh; width: 19vh; height: 19vh; border-radius: 50%; background: #1b1c22; }
.b b { position: absolute; top: 23vh; width: 11vh; height: 12vh; background: #1b1c22; border-radius: 0 0 2vh 2vh; box-shadow: inset 0 3vh 0 var(--accent), inset 0 5vh 0 #1b1c22, inset 0 6.6vh 0 var(--accent); }
.b em { position: absolute; top: 11vh; left: 50%; width: 3vh; height: 6vh; margin-left: -1.5vh; border-radius: 2vh; background: var(--accent); animation: glow 1.4s 0.8s ease-in-out infinite; }
.tx { display: flex; flex-direction: column; gap: 2.4vh; }
.t1 { font-size: 13vh; font-weight: 800; letter-spacing: 0.22em; color: var(--accent); white-space: pre; animation: side 0.5s 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t2 { font-size: 22vh; font-weight: 700; line-height: 1.12; white-space: pre; animation: side 0.6s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes open { to { clip-path: inset(0 0 0 0 round 5vh); } }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } }
@keyframes swing { 0%, 100% { rotate: -5deg; } 50% { rotate: 5deg; } }
@keyframes glow { 50% { opacity: 0.55; } }
@keyframes side { from { opacity: 0; transform: translateX(-5vh); } }
</style>
</head>
<body>
<div class="w"><div class="c">
      <div class="b"><i></i><em></em><b></b></div>
      <div class="tx"><span class="t1">TIP</span><span class="t2">Salt the water
before it boils</span></div>
    </div></div>
<script>
/*
 * A tip card: a bulb badge that lights up and swings a little, a label and a line of advice, on a card with a
 * stripe. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are held at
 * t by the host.
 */
window.film = { frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
