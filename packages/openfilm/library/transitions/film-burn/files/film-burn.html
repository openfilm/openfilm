<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Film burn</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { mix-blend-mode: screen; animation: w 0.8s ease-in-out both; background: linear-gradient(90deg, transparent, #ff6a00 25%, #fff6c4 50%, #ff6a00 75%, transparent); width: 220%; left: -60%; }
@keyframes w { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * An orange burn runs across like overexposed film. It lasts 0.8 s and covers the cut at its middle: put its
 * middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations
 * are held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
