<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Star</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ffd35a; }
.l { background: var(--color); clip-path: polygon(50% 5%, 61% 38%, 96% 38%, 68% 59%, 79% 92%, 50% 72%, 21% 92%, 32% 59%, 4% 38%, 39% 38%); left: calc(50% - 50px); top: calc(50% - 50px); width: 100px; height: 100px; inset: auto; animation: s 0.8s ease-in both; }
@keyframes s { 0% { transform: scale(0) rotate(-90deg); opacity: 1; } 50% { transform: scale(45) rotate(0); opacity: 1; } 100% { transform: scale(45); opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A star spins out from the middle and covers the cut, then fades. It lasts 0.8 s and covers the cut at its
 * middle: put its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone;
 * its CSS animations are held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
