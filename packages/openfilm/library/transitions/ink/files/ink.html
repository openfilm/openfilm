<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ink</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #0d0d0d; }
.l { animation: k 1s ease-in-out both; background: radial-gradient(circle at 48% 55%, var(--color) 0 28%, transparent 30%), radial-gradient(circle at 62% 40%, var(--color) 0 18%, transparent 20%), radial-gradient(circle at 35% 38%, var(--color) 0 15%, transparent 17%); }
@keyframes k { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(3.4); opacity: 1; } 100% { transform: scale(3.6); opacity: 0; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * Ink spreads from the middle and covers the cut, then lifts. It lasts 1 s and covers the cut at its middle: put
 * its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { duration: 1, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
