<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Confetti</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #ffd23f; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A curtain of your colour drops from the top behind a shower of tumbling confetti and covers the cut, then falls
 * on out of the bottom with confetti fluttering after it. It lasts 1 s and covers the cut at its middle: put its
 * middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of
 * the frame so it fits a stage of any shape.
 */
const D = 1;
const DEFAULT = '#ffd23f';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

const PAPER = ['#ff4f6d', '#3ec1ff', '#7cf29c', '#ffffff', '#b28dff', '#ff8a3d', '#ffd23f'];

function draw(u) {
  const c = color();
  const bottom = mix(-H * 0.2, H * 1.25, inOut(seg(u, 0.06, 0.42)));
  const top = mix(-H * 0.25, H * 1.2, inOut(seg(u, 0.58, 0.96)));
  /* the curtain */
  if (bottom > top) {
    g.fillStyle = c;
    g.fillRect(0, top, W, bottom - top);
    /* soft folds */
    for (let i = 0; i < 8; i++) {
      const x = (i / 8) * W + W / 16;
      const f = g.createLinearGradient(x - W / 16, 0, x + W / 16, 0);
      f.addColorStop(0, tone(c, -0.12, 0));
      f.addColorStop(0.5, tone(c, -0.12, 0.5));
      f.addColorStop(1, tone(c, -0.12, 0));
      g.fillStyle = f;
      g.fillRect(x - W / 16, top, W / 8, bottom - top);
    }
  }
  /* confetti: below the curtain's lower edge as it drops, above its upper edge as it goes */
  const pw = H * 0.05, ph = H * 0.024;
  for (let i = 0; i < 220; i++) {
    const after = i % 2 === 1;
    const edge = after ? top : bottom;
    if (after ? u < 0.5 : u > 0.62) continue;
    const lag = hash(i) * H * (after ? 0.5 : 0.35);
    const y = after ? edge - lag + u * H * 0.1 : edge + lag * (0.3 + 0.7 * seg(u, 0, 0.3)) - H * 0.05;
    const x = hash(i + 1) * W + Math.sin(u * 8 + i) * H * 0.03;
    const spin = u * (8 + 10 * hash(i + 2)) + hash(i + 3) * 6;
    g.save();
    g.translate(x, y);
    g.rotate(hash(i + 4) * 6 + u * 3);
    g.scale(1, Math.cos(spin));
    g.fillStyle = PAPER[i % PAPER.length];
    g.fillRect(-pw / 2, -ph / 2, pw, ph);
    g.restore();
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
