<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Datamosh</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * The picture breaks into blocks of smeared, wrong colour that spread until they fill the frame over the cut, then
 * drop out block by block. It lasts 0.7 s and covers the cut at its middle: put its middle on the cut. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so it fits a stage
 * of any shape.
 */
const D = 0.7;
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* muddy video colours, and two loud ones */
const MUD = ['#0d1117', '#1b2a30', '#2e1d36', '#123d2e', '#4a2a5e', '#262626', '#103b55', '#3b3020', '#b0347a', '#2fd17a'];

function draw(u) {
  const n = Math.floor(u * D * 24), cols = 16, rows = 9, cw = W / cols, ch = H / rows;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const id = j * cols + i;
      /* rows break up together, a little scattered */
      const on = hash(j * 7 + 1) * 0.2 + hash(id) * 0.18, off = 0.6 + hash(id + 3) * 0.36;
      if (u < on || u >= off) continue;
      /* most blocks hold their colour, some flicker */
      const pick = hash(id * 3 + (hash(id + 9) > 0.7 ? n : 0));
      const c = MUD[Math.floor(pick ** 3 * MUD.length)];
      const x = Math.floor(i * cw), y = Math.floor(j * ch), w = Math.ceil(cw) + 1, h = Math.ceil(ch) + 1;
      g.fillStyle = c;
      g.fillRect(x, y, w, h);
      /* smears: streaks dragged sideways through the block */
      for (let s = 0; s < 3; s++) {
        const sy = y + hash(id * 5 + s) * h, sh = 1 + hash(id * 5 + s + 1) * h * 0.25;
        g.fillStyle = `rgba(255, 255, 255, ${0.04 + 0.1 * hash(id + s + n)})`;
        g.fillRect(x, sy, w * (1 + 2 * hash(id + s)), sh);
      }
      /* some blocks melt downward */
      if (hash(id + 17) > 0.8) {
        const melt = g.createLinearGradient(0, y, 0, y + h * 2.5);
        melt.addColorStop(0, c);
        melt.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = melt;
        g.fillRect(x, y, w, h * 2.5);
      }
    }
  }
  /* a few full-width lines of loud colour */
  for (let m = 0; m < 4; m++) {
    if (hash(n * 9 + m) > Math.sin(Math.PI * u)) continue;
    g.fillStyle = m % 2 ? 'rgba(47, 209, 122, 0.85)' : 'rgba(176, 52, 122, 0.85)';
    g.fillRect(0, hash(n * 4 + m) * H, W, 1 + hash(n + m) * H * 0.02);
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
