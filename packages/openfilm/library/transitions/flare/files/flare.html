<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flare</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
.l { mix-blend-mode: screen; animation: f 0.8s ease-in-out both; background: radial-gradient(circle, #fff 0, rgba(255, 250, 220, 0.95) 20%, rgba(255, 230, 160, 0.4) 45%, transparent 70%); }
@keyframes f { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(2.6); } 100% { opacity: 0; transform: scale(2.8); } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A burst of light from the middle that whites out the cut. It lasts 0.8 s and covers the cut at its middle: put
 * its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS
 * animations are held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
