<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Color wipe</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #f0ece3; }
.l { background: var(--color); animation: w 0.8s cubic-bezier(0.7, 0, 0.3, 1) both; }
@keyframes w { 0% { transform: translateX(-101%); } 50% { transform: translateX(0); } 100% { transform: translateX(101%); } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A panel of color slides across and away; the cut happens behind it. It lasts 0.8 s and covers the cut at its
 * middle: put its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone;
 * its CSS animations are held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
