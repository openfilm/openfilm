<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Smoke</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #d9d9d6; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Smoke billows up from the bottom and the sides in soft rolling puffs until it fills the frame over the cut, then
 * clears in patches and drifts up and away. It lasts 1.2 s and covers the cut at its middle: put its middle on the
 * cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so
 * it fits a stage of any shape.
 */
const D = 1.2;
const DEFAULT = '#d9d9d6';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const inQuad = (x) => x * x;
const outQuad = (x) => 1 - (1 - x) * (1 - x);
const inCubic = (x) => x * x * x;
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

/* a soft puff of smoke */
const puff = (x, y, r, c, a) => {
  const p = g.createRadialGradient(x, y - r * 0.2, 0, x, y, r);
  p.addColorStop(0, tone(c, 0.15, a));
  p.addColorStop(0.55, tone(c, -0.05, a * 0.7));
  p.addColorStop(1, tone(c, -0.1, 0));
  g.fillStyle = p;
  g.fillRect(x - r, y - r, 2 * r, 2 * r);
};

function draw(u) {
  const c = color(), M = Math.max(W, H);
  /* the thick of it: a solid layer that comes in over the cut and clears after it */
  const thick = u < 0.5 ? inCubic(seg(u, 0.25, 0.42)) : 1;
  if (thick > 0) {
    g.fillStyle = tone(c, 0, thick);
    g.fillRect(0, 0, W, H);
  }
  if (u >= 0.5) {
    /* it clears in patches */
    g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 9; i++) {
      const s = 0.56 + hash(i + 70) * 0.18, p = seg(u, s, s + 0.3);
      if (p <= 0) continue;
      const r = M * (0.25 + 0.5 * outQuad(p)), x = hash(i + 71) * W, y = hash(i + 72) * H - p * H * 0.2;
      const hole = g.createRadialGradient(x, y, 0, x, y, r);
      hole.addColorStop(0, 'rgba(0, 0, 0, 1)');
      hole.addColorStop(0.5, `rgba(0, 0, 0, ${0.8 * p})`);
      hole.addColorStop(1, 'rgba(0, 0, 0, 0)');
      g.fillStyle = hole;
      g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    g.fillStyle = `rgba(0, 0, 0, ${inQuad(seg(u, 0.7, 0.96))})`;
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }
  /* puffs rolling up from the bottom and in from the sides */
  for (let i = 0; i < 60; i++) {
    const born = hash(i) * 0.4 + (i >= 40 ? 0.35 : 0), life = 0.45 + hash(i + 1) * 0.3;
    const p = seg(u, born, born + life);
    if (p <= 0 || p >= 1) continue;
    const side = hash(i + 2), x0 = side < 0.6 ? hash(i + 3) * W : side < 0.8 ? -W * 0.05 : W * 1.05;
    const x = x0 + (side < 0.6 ? 0 : side < 0.8 ? 1 : -1) * W * 0.4 * outQuad(p) + Math.sin(p * 4 + i) * H * 0.04;
    const y = H * (1.1 - (side < 0.6 ? 0.9 : 0.5) * outQuad(p) - (side < 0.6 ? 0 : hash(i + 4) * 0.8));
    const r = H * (0.25 + 0.35 * hash(i + 5)) * (0.4 + outQuad(p));
    puff(x, y, r, c, 0.75 * Math.sin(Math.PI * p));
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
