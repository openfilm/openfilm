<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Liquid</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #2a7fff; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Liquid in your colour rises in waves from the bottom with bubbles in it and fills the frame over the cut, then
 * flows on up and out of the top. It lasts 1 s and covers the cut at its middle: put its middle on the cut. A page
 * of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so it fits a
 * stage of any shape.
 */
const D = 1;
const DEFAULT = '#2a7fff';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

/* the wavy surface at level y, going across (dir 1) or back (dir -1) */
const surface = (y, u, k, amp, dir) => {
  for (let i = 0; i <= 48; i++) {
    const x = dir > 0 ? (i / 48) * W : W - (i / 48) * W;
    g.lineTo(x, y + amp * (0.6 * Math.sin((x / W) * TAU * 1.4 + u * 9 + k) + 0.4 * Math.sin((x / W) * TAU * 3.1 - u * 13 + k * 2)));
  }
};
const body = (top, bottom, u, k, amp) => {
  g.beginPath();
  surface(top, u, k, amp, 1);
  surface(bottom, u, k + 3, amp, -1);
  g.closePath();
};

function draw(u) {
  const c = color(), amp = H * 0.05, lo = H + amp * 2, hi = -amp * 2;
  /* a lighter wave runs ahead of the main one, and trails it out */
  const layers = [[tone(c, 0.35), 0, 0.36, 0.62, 1, 1], [c, 0.04, 0.42, 0.56, 0.94, 0]];
  layers.forEach(([style, a0, a1, b0, b1, k]) => {
    const top = mix(lo, hi, inOut(seg(u, a0, a1))), bottom = mix(lo, hi, inOut(seg(u, b0, b1)));
    if (top >= bottom) return;
    body(top, bottom, u, k, amp);
    g.fillStyle = style;
    g.fill();
  });
  /* bubbles rising in the main body */
  const top = mix(lo, hi, inOut(seg(u, 0.04, 0.42))), bottom = mix(lo, hi, inOut(seg(u, 0.56, 0.94)));
  if (top < bottom) {
    g.save();
    body(top, bottom, u, 0, amp);
    g.clip();
    g.fillStyle = tone(c, 0.45, 0.55);
    for (let i = 0; i < 26; i++) {
      const r = H * (0.006 + 0.018 * hash(i));
      const y = H * (1.2 - ((hash(i + 1) + u * (0.8 + hash(i + 2))) % 1.4));
      g.beginPath();
      g.arc(hash(i + 3) * W + Math.sin(u * 12 + i) * H * 0.01, y, r, 0, TAU);
      g.fill();
    }
    g.restore();
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
