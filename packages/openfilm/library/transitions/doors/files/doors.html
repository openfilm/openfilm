<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Doors</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #202024; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Two doors slide in from the sides with a lighter edge ahead of them, shut over the cut with a bump, and slide
 * open again onto the next shot. It lasts 0.8 s and covers the cut at its middle: put its middle on the cut. A
 * page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so it fits
 * a stage of any shape.
 */
const D = 0.8;
const DEFAULT = '#202024';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const outCubic = (x) => 1 - (1 - x) ** 3;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const outBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

function draw(u) {
  const c = color(), half = W / 2;
  /* how far each door has come in, 0 to 1 (a little past, as they bump) */
  const p = u < 0.5 ? outBack(seg(u, 0.02, 0.4)) : 1 - inOut(seg(u, 0.58, 0.98));
  const lead = u < 0.5 ? outCubic(seg(u, 0, 0.34)) : 1 - inOut(seg(u, 0.52, 0.94));
  const shadow = (x, dir) => {
    const sh = g.createLinearGradient(x, 0, x + dir * W * 0.12, 0);
    sh.addColorStop(0, `rgba(0, 0, 0, ${0.45 * Math.min(1, p * 3)})`);
    sh.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = sh;
    g.fillRect(Math.min(x, x + dir * W * 0.12), 0, W * 0.12, H);
  };
  const l = half * p + 1, r = W - half * p - 1;
  if (p < 1) { shadow(l, 1); shadow(r, -1); }
  /* the lighter edges run ahead, and are drawn over by the doors */
  g.fillStyle = tone(c, 0.35);
  g.fillRect(0, 0, half * lead + 1, H);
  g.fillRect(W - half * lead - 1, 0, half * lead + 1, H);
  g.fillStyle = c;
  g.fillRect(0, 0, l, H);
  g.fillRect(r, 0, W - r, H);
  /* the bevel on each door's edge, and the seam where they meet */
  g.fillStyle = tone(c, 0.25);
  g.fillRect(l - 3, 0, 3, H);
  g.fillRect(r, 0, 3, H);
  g.fillStyle = tone(c, -0.4);
  g.fillRect(l - 6, 0, 3, H);
  g.fillRect(r + 3, 0, 3, H);
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
