<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Iris</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #000000; }
@property --r { syntax: '<percentage>'; inherits: false; initial-value: 80%; }
.l { animation: i 0.8s ease-in-out both; background: radial-gradient(circle at 50% 50%, transparent var(--r), var(--color) calc(var(--r) + 0.3%)); }
@keyframes i { 0% { --r: 80%; } 50% { --r: 0%; } 100% { --r: 80%; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * A circle closes to black on the cut and opens again. It lasts 0.8 s and covers the cut at its middle: put its
 * middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations
 * are held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
