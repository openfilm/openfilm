<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blob</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #18c29c; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Wobbling blobs of yellow, rose and your colour swell from the middle one inside another and fill the frame over
 * the cut; then wobbling holes open in them, one after another. It lasts 1 s and covers the cut at its middle: put
 * its middle on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts
 * of the frame so it fits a stage of any shape.
 */
const D = 1;
const DEFAULT = '#18c29c';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;

/* a wobbling round shape around x, y */
const blob = (x, y, r, ph) => {
  for (let i = 0; i <= 96; i++) {
    const a = (i / 96) * TAU;
    const rr = r * (1 + 0.07 * Math.sin(3 * a + ph) + 0.04 * Math.sin(5 * a - ph * 1.7) + 0.02 * Math.sin(7 * a + ph * 2.3));
    if (i) g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); else g.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
  }
  g.closePath();
};
const LAYERS = ['#ffcf3f', '#ff5d8f'];

function draw(u) {
  const list = [...LAYERS, color()], R = Math.hypot(W, H) / 2 * 1.3;
  list.forEach((c, i) => {
    const x = W / 2 + W * 0.05 * Math.sin(u * 3 + i * 2), y = H / 2 + H * 0.05 * Math.cos(u * 2.5 + i);
    const ph = u * 9 + i * 1.7;
    g.fillStyle = c;
    g.beginPath();
    if (u < 0.5) {
      const r = R * inOut(seg(u, i * 0.07, i * 0.07 + 0.28));
      if (r <= 0) return;
      blob(x, y, r, ph);
    } else {
      /* the top layer opens first */
      const s = 0.56 + (list.length - 1 - i) * 0.07;
      const r = R * inOut(seg(u, s, s + 0.3));
      if (r >= R) return;
      g.rect(-10, -10, W + 20, H + 20);
      if (r > 0) blob(x, y, r, ph + 2);
    }
    g.fill('evenodd');
  });
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
