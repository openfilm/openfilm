<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Message flood</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #e9eef5; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Chat bubbles pop up faster and faster, scrolling as they stack, until they fill the frame over the cut; then
 * they pop away one by one onto the next shot. It lasts 1 s and covers the cut at its middle: put its middle on
 * the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame
 * so it fits a stage of any shape.
 */
const D = 1;
const DEFAULT = '#e9eef5';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const inCubic = (x) => x * x * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const outBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
const inBack = (x) => 2.70158 * x ** 3 - 1.70158 * x * x;
/* a fixed random number in [0, 1) for each n: the same on every frame */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

/* bubbles in your colour's chat: sent ones blue or green, received ones white */
const BUBBLES = ['#2f80ff', '#ffffff', '#34c759', '#ffffff', '#2f80ff'];
/* a bubble w by h with a tail on one side, and lines of text or typing dots */
const bubble = (x, y, w, h, c, right, seed) => {
  const r = h * 0.45;
  g.fillStyle = c;
  g.beginPath();
  g.roundRect(x, y, w, h, r);
  g.fill();
  g.beginPath();
  const tx = right ? x + w - r * 0.4 : x + r * 0.4;
  g.moveTo(tx, y + h * 0.6);
  g.lineTo(right ? x + w + h * 0.15 : x - h * 0.15, y + h);
  g.lineTo(right ? x + w - r * 1.2 : x + r * 1.2, y + h * 0.95);
  g.fill();
  const ink = c === '#ffffff' ? 'rgba(40, 50, 70, 0.35)' : 'rgba(255, 255, 255, 0.8)';
  g.fillStyle = ink;
  if (hash(seed) > 0.75) {
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + r + i * h * 0.28, y + h / 2, h * 0.08, 0, TAU); g.fill(); }
    return;
  }
  const lines = h > H * 0.12 ? 2 : 1;
  for (let i = 0; i < lines; i++) {
    const lw = (w - r * 1.6) * (i === lines - 1 ? 0.5 + 0.4 * hash(seed + 1) : 1);
    g.beginPath();
    g.roundRect(x + r * 0.8, y + h * (lines === 1 ? 0.42 : 0.28 + i * 0.3), lw, h * 0.14, h * 0.07);
    g.fill();
  }
};

function draw(u) {
  const c = color(), rh = H / 5.2;
  /* the chat's ground, under the bubbles over the cut */
  const ground = u < 0.5 ? inCubic(seg(u, 0.26, 0.42)) : 1 - seg(u, 0.56, 0.72);
  if (ground > 0) { g.fillStyle = tone(c, 0, ground); g.fillRect(0, 0, W, H); }
  /* the stack scrolls up as it fills */
  const scroll = H * 0.35 * inOut(seg(u, 0, 0.8));
  const rows = Math.ceil((H + H * 0.4) / rh) + 1;
  for (let j = 0; j < rows; j++) {
    let x = (hash(j * 7) - 0.8) * W * 0.25;
    for (let k = 0; x < W && k < 6; k++) {
      const id = j * 10 + k;
      const w = W * (0.2 + 0.28 * hash(id + 1)), h = rh * (0.72 + 0.2 * hash(id + 2));
      const y = j * rh + (rh - h) / 2 - scroll + H * 0.1;
      /* bubbles pop in faster and faster, from the bottom up */
      const order = (1 - j / rows) * 0.6 + hash(id + 3) * 0.4;
      const b = 0.36 * order ** 0.8, e = 0.58 + hash(id + 4) * 0.28;
      const p = u < 0.5 ? outBack(seg(u, b, b + 0.08)) : 1 - inBack(seg(u, e, e + 0.08));
      if (p > 0 && y < H && y + h > 0) {
        const right = hash(id + 5) > 0.5;
        const ox = right ? x + w : x, oy = y + h;
        g.save();
        g.translate(ox, oy);
        g.scale(p, p);
        g.translate(-ox, -oy);
        bubble(x, y, w, h, BUBBLES[Math.floor(hash(id + 6) * BUBBLES.length)], right, id);
        g.restore();
      }
      x += w + W * (0.02 + 0.04 * hash(id + 7));
    }
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
