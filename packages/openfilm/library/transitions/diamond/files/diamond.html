<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diamond</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #ffcf3f; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A diamond spins open from the middle behind a lighter one and fills the frame over the cut; then a diamond hole
 * spins open on the next shot. It lasts 0.8 s and covers the cut at its middle: put its middle on the cut. A page
 * of OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so it fits a
 * stage of any shape.
 */
const D = 0.8;
const DEFAULT = '#ffcf3f';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
/* the colour the page is given (its --color), read on each frame */
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;
const rgbOf = (c) => { g.fillStyle = '#000'; g.fillStyle = c; const s = String(g.fillStyle); return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number); };
/* a colour made lighter (k > 0, toward white) or darker (k < 0, toward black), at an opacity */
const tone = (c, k, a = 1) => `rgba(${rgbOf(c).map((x) => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))).join(', ')}, ${a})`;

/* a diamond of half-diagonal s around the middle, turned by rot */
const diamond = (s, rot) => {
  for (let i = 0; i < 4; i++) { const a = rot + (i * Math.PI) / 2, x = W / 2 + s * Math.cos(a), y = H / 2 + s * Math.sin(a); if (i) g.lineTo(x, y); else g.moveTo(x, y); }
  g.closePath();
};
/* the band between two diamonds turned alike (s0 = 0: a whole diamond) */
const band = (s0, s1, rot, style) => {
  if (s1 <= s0) return;
  g.fillStyle = style;
  g.beginPath();
  diamond(s1, rot);
  if (s0 > 0) diamond(s0, rot);
  g.fill('evenodd');
};

function draw(u) {
  const c = color(), S = Math.hypot(W, H) * 0.72 + 2;
  if (u < 0.5) {
    const p = inOut(seg(u, 0.07, 0.42)), q = inOut(seg(u, 0, 0.35)), rot = (1 - p) * 1.6;
    band(S * p, S * q, rot, tone(c, 0.5, 0.6));
    band(0, S * p, rot, c);
  } else {
    const p = inOut(seg(u, 0.56, 0.92)), q = inOut(seg(u, 0.63, 1)), rot = -p * 1.6;
    band(S * p, S * 1.5, rot, c);
    band(S * q, S * p, rot, tone(c, 0.5, 0.6));
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
