<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light leak</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Warm leaks of orange, rose and gold drift across the frame, run together into a golden white over the cut, and
 * drift on as it clears. It lasts 1 s and covers the cut at its middle: put its middle on the cut. A page of
 * OpenFilm's library (CC0): what it shows at t comes from t alone, drawn in parts of the frame so it fits a stage
 * of any shape.
 */
const D = 1;
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
/* how far u is through [a, b], from 0 to 1 */
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const inExpo = (x) => (x <= 0 ? 0 : 2 ** (10 * x - 10));

/* each leak: where it drifts from and to (parts of the frame), its size (parts of the diagonal) and its colour */
const LEAKS = [
  { x0: -0.2, y0: 1.1, x1: 0.7, y1: 0.4, s: 0.9, c: '255, 96, 24' },
  { x0: -0.1, y0: 0.1, x1: 0.9, y1: 0.75, s: 0.7, c: '255, 52, 92' },
  { x0: 0.3, y0: 1.2, x1: 1.2, y1: 0.05, s: 0.8, c: '255, 176, 48' },
  { x0: 0.05, y0: 0.6, x1: 1.1, y1: 0.95, s: 0.6, c: '255, 220, 140' },
  { x0: 0.6, y0: -0.2, x1: 1.3, y1: 0.5, s: 0.55, c: '255, 120, 60' },
];

function draw(u) {
  const R = Math.hypot(W, H);
  const swell = Math.sin(Math.PI * u);
  g.globalCompositeOperation = 'lighter';
  LEAKS.forEach((l, i) => {
    const p = mix(0.1, 0.9, u) + 0.04 * Math.sin(u * 7 + i * 2);
    const x = W * mix(l.x0, l.x1, p), y = H * mix(l.y0, l.y1, p);
    const r = R * l.s * mix(0.35, 1.05, swell);
    const a = 0.55 * swell ** 1.4;
    const glow = g.createRadialGradient(x, y, 0, x, y, r);
    glow.addColorStop(0, `rgba(${l.c}, ${a})`);
    glow.addColorStop(0.45, `rgba(${l.c}, ${a * 0.45})`);
    glow.addColorStop(1, `rgba(${l.c}, 0)`);
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);
  });
  g.globalCompositeOperation = 'source-over';
  /* the burst: the leaks run together into golden white over the cut */
  const cover = u < 0.5 ? inExpo(seg(u, 0.22, 0.42)) : 1 - inOut(seg(u, 0.56, 0.86));
  if (cover > 0) {
    const wash = g.createLinearGradient(0, H, W, 0);
    wash.addColorStop(0, `rgba(255, 214, 160, ${cover})`);
    wash.addColorStop(0.5, `rgba(255, 250, 236, ${cover})`);
    wash.addColorStop(1, `rgba(255, 226, 180, ${cover})`);
    g.fillStyle = wash;
    g.fillRect(0, 0, W, H);
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
