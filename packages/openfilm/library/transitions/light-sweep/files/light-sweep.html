<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light sweep</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --color: #ffa04a; }
.l { mix-blend-mode: screen; animation: s 0.8s ease-in-out both; background: radial-gradient(70% 110% at var(--x) 50%, #fff4dc, var(--color) 35%, rgba(255, 60, 40, 0.5) 60%, transparent 80%); }
@property --x { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
@keyframes s { 0% { opacity: 0; --x: -20%; } 50% { opacity: 1; --x: 50%; } 100% { opacity: 0; --x: 120%; } }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * Warm light sweeps across, brightest at the cut. It lasts 0.8 s and covers the cut at its middle: put its middle
 * on the cut. A page of OpenFilm's library (CC0): what it shows at t comes from t alone; its CSS animations are
 * held at t by the host.
 */
window.film = { duration: 0.8, frame() {} };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
