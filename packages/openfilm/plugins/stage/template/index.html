import { shot } from './shot.js';
window.film = shot({ pass: new URLSearchParams(location.search).get('pass') || 'beauty' });
// opened on its own, outside OpenFilm: it plays, round and round
if (!window.filmHost) {
  const start = performance.now();
  const play = () => { film.frame(((performance.now() - start) / 1000) % film.duration); requestAnimationFrame(play); };
  play();
}
