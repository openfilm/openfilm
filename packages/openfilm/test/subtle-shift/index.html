<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;background:#f5f1e8}
#dot{position:absolute;left:900px;top:520px;width:40px;height:40px;border-radius:50%;background:#ff6a2b}
</style></head><body><div id="dot"></div><script>
let calls = 0; // a 3 px drift that depends on how many frames were drawn before
window.film = { duration: 4, width: 1920, height: 1080, frame(t) { calls++; document.getElementById('dot').style.transform = `translate(${200 * Math.sin(t) + (calls % 2) * 3}px, 0)`; } };
</script></body></html>
