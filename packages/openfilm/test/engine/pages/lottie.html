<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080">
<style>body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#101318}#l{position:absolute;inset:0}</style>
<script src="/vendor/lottie-web/build/player/lottie.min.js"></script></head>
<body><div id="l"></div>
<script type="module">
// lottie-web (SVG renderer): a hand-written animation (what After Effects and Bodymovin export), goToAndStop(t * fps).
import { label } from './label.js';
const kf = (t, s, last) => (last ? { t, s } : { t, s, i: { x: [0.2], y: [1] }, o: { x: [0.8], y: [0] } });
const data = { v: '5.7.4', fr: 30, ip: 0, op: 60, w: 1920, h: 1080, nm: 'probe', ddd: 0, assets: [], layers: [{
  ddd: 0, ind: 1, ty: 4, nm: 'square', sr: 1, ao: 0, ip: 0, op: 60, st: 0, bm: 0,
  ks: { o: { a: 0, k: 100 }, r: { a: 1, k: [kf(0, [0]), kf(60, [270], true)] },
        p: { a: 1, k: [kf(0, [360, 540, 0]), kf(60, [1560, 540, 0], true)] }, a: { a: 0, k: [0, 0, 0] }, s: { a: 0, k: [100, 100, 100] } },
  shapes: [{ ty: 'gr', it: [
    { ty: 'rc', d: 1, s: { a: 0, k: [260, 260] }, p: { a: 0, k: [0, 0] }, r: { a: 0, k: 56 } },
    { ty: 'fl', c: { a: 0, k: [1, 0.42, 0.2, 1] }, o: { a: 0, k: 100 }, r: 1 },
    { ty: 'tr', p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }] }] }] };
const anim = lottie.loadAnimation({ container: document.getElementById('l'), renderer: 'svg', loop: false, autoplay: false, animationData: data });
const ready = new Promise((res) => anim.addEventListener('DOMLoaded', res));
window.film = { duration: 2, ready, frame(t) { anim.goToAndStop(t * 30, true); label(`lottie-web ${lottie.version} (svg): goToAndStop(t * fps)`); } };
</script></body></html>
