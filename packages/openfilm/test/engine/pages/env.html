<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080">
<style>body{margin:0;width:1920px;height:1080px;background:#111;color:#eee;font:18px/1.3 ui-monospace,Menlo,monospace;overflow:hidden}
#t{position:absolute;left:40px;top:96px;columns:2;column-gap:40px;width:1840px}#t div{break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
b{color:#8fb4ff;font-weight:400}</style></head>
<body><div id="t"></div>
<script type="module">
// What this engine can do, as window.__capabilities (read by test/engine/suite.mjs once the page is ready), and how the
// host's clock reads inside a frame, as window.__clock. Every check is tried on its own: one that throws is reported
// as its error, never ends the report.
import { label } from './label.js';
const caps = {};
const clock = [];
window.__capabilities = caps;
window.__clock = clock;
const attempt = async (key, fn) => { try { caps[key] = await fn(); } catch (e) { caps[key] = { error: String(e?.message ?? e) }; } };
const supports = (prop, value) => CSS.supports(prop, value);
const later = (ms) => new Promise((r) => setTimeout(r, ms));

/* HTML-in-Canvas tried for real: a red block inside a canvas marked one way or the other, drawn into it, its middle
   read back. A canvas whose subtree has not painted yet throws; it is drawn again after its `paint` event. */
async function htmlInCanvas(mark) {
  const make = () => {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    mark(c);
    const d = document.createElement('div');
    d.style.cssText = 'width:64px;height:64px;background:rgb(255,0,0)';
    c.append(d);
    document.body.append(c);
    return { c, d };
  };
  const painted = (c) => new Promise((done) => {
    const timer = setTimeout(() => done(false), 1500);
    c.addEventListener('paint', () => { clearTimeout(timer); done(true); }, { once: true });
    c.requestPaint?.();
  });
  const out = {};
  {
    const { c, d } = make();
    const ctx = c.getContext('2d', { willReadFrequently: true });
    let returned;
    const draw = () => { returned = ctx.drawElementImage(d, 0, 0); };
    try { draw(); } catch (e) {
      out.firstError = String(e.message);
      out.paintEvent = await painted(c);
      try { draw(); } catch (e2) { out.error = String(e2.message); }
    }
    const px = ctx.getImageData(32, 32, 1, 1).data;
    out.drawn2d = px[0] > 200 && px[1] < 60 && px[2] < 60 && px[3] > 200;
    out.returns = returned === undefined ? 'undefined' : returned === null ? 'null' : (returned.constructor?.name ?? typeof returned);
    c.remove();
  }
  {
    const { c, d } = make();
    const gl = c.getContext('webgl2');
    /* texElementImage2D took (target, level, internalformat, format, type, element) until Chromium 155 and takes
       (target, internalformat, element) from 156, with a sized format */
    out.webglForm = gl.texElementImage2D?.length >= 6 ? 'target, level, internalformat, format, type, element' : 'target, internalformat, element';
    const read = () => {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      if (gl.texElementImage2D.length >= 6) gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, d);
      else gl.texElementImage2D(gl.TEXTURE_2D, gl.RGBA8, d);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      const px = new Uint8Array(4);
      gl.readPixels(32, 32, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      return px;
    };
    try {
      let px;
      try { px = read(); } catch { await painted(c); px = read(); }
      out.drawnWebGL = px[0] > 200 && px[1] < 60 && px[2] < 60 && px[3] > 200;
    } catch (e) { out.drawnWebGL = false; out.webglError = String(e.message); }
    c.remove();
  }
  return out;
}

async function report() {
  caps.userAgent = navigator.userAgent;
  caps.chromium = /(?:HeadlessChrome|Chrome)\/([\d.]+)/.exec(navigator.userAgent)?.[1] ?? null;
  await attempt('webgl2', () => {
    const gl = document.createElement('canvas').getContext('webgl2');
    if (!gl) return null;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const has = (name) => gl.getSupportedExtensions().includes(name);
    return {
      renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
      maxSamples: gl.getParameter(gl.MAX_SAMPLES),
      colorBufferFloat: has('EXT_color_buffer_float'),
      colorBufferHalfFloat: has('EXT_color_buffer_half_float'),
      floatLinear: has('OES_texture_float_linear'),
      anisotropic: has('EXT_texture_filter_anisotropic'),
      parallelShaderCompile: has('KHR_parallel_shader_compile'),
      multiDraw: has('WEBGL_multi_draw'),
      timerQuery: has('EXT_disjoint_timer_query_webgl2'),
      clipControl: has('EXT_clip_control'),
      drawingBufferColorSpace: 'drawingBufferColorSpace' in gl,
      drawingBufferStorage: typeof gl.drawingBufferStorage === 'function',
    };
  });
  await attempt('webgpu', async () => {
    if (!navigator.gpu) return null;
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return { adapter: null };
    const info = adapter.info ?? {};
    const l = adapter.limits;
    let hdrCanvas = false;
    try {
      const device = await adapter.requestDevice();
      const ctx = document.createElement('canvas').getContext('webgpu');
      ctx.configure({ device, format: 'rgba16float', toneMapping: { mode: 'extended' } });
      hdrCanvas = ctx.getConfiguration?.()?.toneMapping?.mode === 'extended';
      device.destroy();
    } catch { /* no HDR canvas */ }
    return {
      adapter: `${info.vendor} / ${info.architecture}`,
      description: info.description ?? '',
      features: [...adapter.features].sort(),
      wgslFeatures: [...(navigator.gpu.wgslLanguageFeatures ?? [])].sort(),
      preferredFormat: navigator.gpu.getPreferredCanvasFormat(),
      limits: { maxTextureDimension2D: l.maxTextureDimension2D, maxBufferSize: l.maxBufferSize, maxStorageBufferBindingSize: l.maxStorageBufferBindingSize, maxComputeWorkgroupStorageSize: l.maxComputeWorkgroupStorageSize, maxColorAttachments: l.maxColorAttachments },
      hdrCanvas,
    };
  });
  await attempt('htmlInCanvas', async () => ({
    drawElementImage: 'drawElementImage' in CanvasRenderingContext2D.prototype,
    texElementImage2D: 'texElementImage2D' in WebGL2RenderingContext.prototype,
    oldDrawElement: 'drawElement' in CanvasRenderingContext2D.prototype,
    layoutSubtreeProperty: 'layoutSubtree' in HTMLCanvasElement.prototype,
    layoutsubtree: await htmlInCanvas((c) => c.setAttribute('layoutsubtree', '')),
    contentDrawable: await htmlInCanvas((c) => c.setAttribute('content', 'drawable')),
  }));
  await attempt('canvas2d', () => {
    const c = document.createElement('canvas').getContext('2d');
    let p3 = null, float16 = null;
    try { p3 = document.createElement('canvas').getContext('2d', { colorSpace: 'display-p3' }).getContextAttributes().colorSpace; } catch { /* none */ }
    try { float16 = document.createElement('canvas').getContext('2d', { colorType: 'float16' })?.getContextAttributes().colorType ?? null; } catch { /* none */ }
    return { filter: 'filter' in c, letterSpacing: 'letterSpacing' in c, reset: typeof c.reset === 'function', roundRect: typeof c.roundRect === 'function', conicGradient: typeof c.createConicGradient === 'function', colorSpaceP3: p3, colorTypeFloat16: float16 };
  });
  await attempt('webcodecs', async () => {
    const out = { VideoDecoder: typeof VideoDecoder, VideoEncoder: typeof VideoEncoder, AudioDecoder: typeof AudioDecoder, ImageDecoder: typeof ImageDecoder, VideoFrame: typeof VideoFrame };
    const codecs = { h264: 'avc1.640028', hevc: 'hvc1.1.6.L120.90', vp9: 'vp09.00.10.08', av1: 'av01.0.08M.08' };
    out.decode = {};
    out.encode = {};
    for (const [name, codec] of Object.entries(codecs)) {
      out.decode[name] = typeof VideoDecoder === 'function' ? (await VideoDecoder.isConfigSupported({ codec, codedWidth: 1920, codedHeight: 1080 }).catch(() => ({ supported: false }))).supported : false;
      out.encode[name] = typeof VideoEncoder === 'function' ? (await VideoEncoder.isConfigSupported({ codec, width: 1920, height: 1080, bitrate: 8e6, framerate: 30 }).catch(() => ({ supported: false }))).supported : false;
    }
    out.images = {};
    for (const type of ['image/png', 'image/apng', 'image/gif', 'image/webp', 'image/avif', 'image/jpeg']) out.images[type] = typeof ImageDecoder === 'function' ? await ImageDecoder.isTypeSupported(type) : false;
    return out;
  });
  await attempt('media', () => {
    const v = document.createElement('video');
    const play = (type) => v.canPlayType(type) || 'no';
    return { h264: play('video/mp4; codecs="avc1.640028"'), hevc: play('video/mp4; codecs="hvc1.1.6.L120.90"'), vp9: play('video/webm; codecs="vp09.00.10.08"'), av1: play('video/mp4; codecs="av01.0.08M.08"'), prores: play('video/quicktime; codecs="apch"'), requestVideoFrameCallback: 'requestVideoFrameCallback' in HTMLVideoElement.prototype };
  });
  await attempt('css', () => ({
    backdropFilter: supports('backdrop-filter', 'blur(2px)'),
    registerProperty: !!CSS.registerProperty,
    paintWorklet: 'paintWorklet' in CSS,
    viewTransitions: !!document.startViewTransition,
    scrollTimelines: supports('animation-timeline', 'scroll()'),
    anchorPositioning: supports('anchor-name', '--a'),
    containerQueries: supports('container-type', 'inline-size'),
    has: CSS.supports('selector(:has(a))'),
    colorMix: supports('color', 'color-mix(in oklch, red, blue)'),
    oklch: supports('color', 'oklch(0.7 0.1 200)'),
    relativeColor: supports('color', 'rgb(from red r g b)'),
    lightDark: supports('color', 'light-dark(red, blue)'),
    textWrapBalance: supports('text-wrap', 'balance'),
    textBoxTrim: supports('text-box', 'trim-both cap alphabetic'),
    interpolateSize: supports('interpolate-size', 'allow-keywords'),
    cornerShape: supports('corner-shape', 'squircle'),
    shapeFunction: supports('clip-path', 'shape(from 0 0, line to 10px 10px)'),
    siblingIndex: supports('width', 'calc(sibling-index() * 1px)'),
    ifFunction: supports('color', 'if(style(--x: 1): red; else: blue)'),
    mathRound: supports('width', 'round(10.5px, 1px)'),
    typedOM: typeof CSS.px === 'function',
  }));
  await attempt('platform', () => ({
    offscreenCanvas: typeof OffscreenCanvas,
    crossOriginIsolated,
    sharedArrayBuffer: typeof SharedArrayBuffer,
    hardwareConcurrency: navigator.hardwareConcurrency,
    devicePixelRatio,
    webAssembly: typeof WebAssembly,
    wasmSimd: WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11])),
    float16Array: typeof Float16Array,
    webnn: 'ml' in navigator,
    fontFaceSet: !!document.fonts,
  }));
  await later(0);
}

window.film = {
  duration: 2,
  ready: report(),
  frame(t) {
    clock.push({ t, now: performance.now(), date: Date.now(), timeline: document.timeline.currentTime, random: Math.random() });
    const rows = Object.entries(caps).map(([k, v]) => `<div><b>${k}</b> ${JSON.stringify(v).replace(/</g, '&lt;')}</div>`);
    document.getElementById('t').innerHTML = rows.join('');
    label('environment report');
  },
};
</script></body></html>
