<!doctype html><html><head><style>
  body { margin: 0; width: 960px; height: 540px; background: #101418; color: #fff; font: 700 64px system-ui; overflow: hidden }
  #headline { position: absolute; left: 520px; top: 80px; white-space: nowrap }
  .card { position: absolute; left: 60px; top: 300px; width: 300px; height: 70px; overflow: hidden; background: #234 }
  .card p { margin: 0; font-size: 44px; white-space: nowrap }
  #fly { position: absolute; top: 420px; font-size: 40px }
</style></head><body>
<!-- two mistakes an agent makes, and one thing that only looks like one -->
<div id="headline">A headline too long for the frame</div>
<div class="card"><p>Text wider than its card</p></div>
<div id="fly">flying in</div>
<script>
const fly = document.getElementById('fly');
window.film = { duration: 3, width: 960, height: 540, frame(t) { fly.style.left = `${-300 + Math.min(1, t / 0.5) * 360}px`; } };
</script></body></html>
